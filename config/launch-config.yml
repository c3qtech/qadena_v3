# Qadena mainnet launch parameters -- TEMPLATE, NOT RUNNABLE.
#
# This is a parameter recommendation to feed genesis construction.  It is deliberately NOT a working
# ignite config: every value that only you can decide is a TODO_ placeholder that will fail loudly
# rather than quietly launching something wrong.
#
# HOW A MAINNET GENESIS IS ACTUALLY BUILT
#
#   Not with `ignite chain init`.  That trusts one machine's keyring for the validator key, which is
#   fine for a test chain and wrong for mainnet.  The normal flow is:
#     1. publish a genesis.json containing accounts, balances and params (this file's contents)
#     2. each validator runs `gentx` with their own key and submits it
#     3. the gentxs are collected (`collect-gentxs`) into the final genesis
#     4. everyone verifies the same genesis hash before starting
#   config/config.yml stays as it is -- the test chain -- and does not inherit from this.
#
# BLOCK TIME: TARGET 3s
#
#   The single-validator test chain runs at exactly timeout_commit because there is no consensus
#   round-trip -- that number is the floor, not a prediction.  A real validator set adds the
#   propose -> prevote -> precommit cycle on top: Cosmos Hub sets timeout_commit 5s and observes
#   ~6.5s blocks.
#
#   MEASURED HERE on the 4-validator M1-M4 fleet, 2026-09-02:
#       timeout_commit 2s -> 2.32s blocks      timeout_commit 3s -> 3.32s blocks
#   so the cycle costs ~0.32s on a LAN.  SETTLED: timeout_commit 3s, and blocks_per_year computed
#   as 9,500,000 (implying 3.32s, the measured rate) -- the BEST CASE.  A slower real network then UNDER-mints slightly,
#   which is the safe direction; padding the assumption upward would OVER-mint and break the
#   stated 1% figure.  blocks_per_year is governance-updatable, so correct it by proposal once
#   the real topology has been measured.
#
#   THE LATENCY KNOB TO WATCH IS timeout_propose, NOT timeout_commit.  timeout_commit only paces;
#   timeout_propose (3s) is how long a validator waits for the proposal before prevoting NIL.  If
#   propagation routinely exceeds it the round FAILS and the chain advances by round-skipping,
#   which collapses throughput.  The _delta knobs (500ms each) grow the timeouts per failed round
#   so a laggy network degrades instead of deadlocking.
#
#   VERIFY ON THE REAL TOPOLOGY before freezing these, then recompute:
#       blocks_per_year = 31,536,000 / observed_block_time
#   Getting it wrong does not break anything, it makes real inflation drift from target: if blocks
#   are faster than blocks_per_year assumes, you mint more than intended.
#
#   At 3s:  1 day = 28,800 blocks   1 year = 10,512,000 blocks
#
# REFERENCE POINTS USED BELOW (researched, not recalled)
#
#   param                       Cosmos Hub        Osmosis           this file
#   unbonding_time              21 days           14 days           21 days
#   max_validators              100               -                 100
#   signed_blocks_window        10000 (~18h)      -                 20000 (~16.7h at 3s)
#   min_signed_per_window       5%                -                 5%
#   slash_fraction_double_sign  5%                5% + perm jail    5%
#   slash_fraction_downtime     0.01%             0 (jail only)     0.01%  -- see note
#   voting_period               14 days           -                 72h at launch -- see note
#   expedited_voting_period     1 day             -                 6h at launch -- see note
#   min_deposit                 250 ATOM          6000 OSMO         see note
#   inflation_max / min         20% / 7%          -                 1% fixed -- see note
#   goal_bonded                 67%               -                 67%
#   community_tax               2%                -                 2%

version: 1

# CHAIN ID.  The numeric part is the EIP-155 chain ID and must be REGISTERED in
# ethereum-lists/chains before anything EVM-facing exists.
#
# This is not cosmetic.  EIP-155 replay protection IS the chain ID, and eth_secp256k1 derives the
# same 0x address on every EVM chain -- so two chains sharing an ID means any address that exists
# on both has its signed transactions replayable in BOTH directions.  A collision is a live
# vulnerability, not a naming inconvenience.
#
# 4444 was the old test value and CANNOT be used: it is registered to Htmlcoin Mainnet (shortName
# "html"), an active chain with a live RPC and block explorer.
#
# Checked against ethereum-lists/chains on 2026-08-27, digits 4/2/8:
#   TAKEN  428 (Geso Verse) · 248 (Oasys Mainnet) · 824 (Daily Network) · 842 (Taraxa Testnet)
#          8428 (THAT Mainnet) · 4444 (Htmlcoin Mainnet)
#   FREE   482 · 284 · 4228 · 4288 · 4824 · 4828 · 2848
#
# Assigned as a stem-plus-digit family, so a misconfigured node is obvious at a glance:
#   mainnet  qadena_482-1     <- this file
#   testnet  qadena_4824-1    stem + 4
#   devnet   qadena_4828-1    stem + 8   (config/config.yml)
#
# The -1 suffix is the EPOCH: bump it (-2, -3, ...) whenever a network is restarted from a NEW
# genesis.  Mainnet stays at -1 unless the chain is re-genesised.
#
# RE-CHECK ALL THREE against the registry immediately before launch -- a pending PR could claim
# one between now and then -- and reserve them by PR so a later collision cannot force a rename.
chain_id: "qadena_482-1"

# ---------------------------------------------------------------------------------------------
# NODE RUNTIME
# ---------------------------------------------------------------------------------------------
#
# These four stanzas are what ignite needs to BUILD a chain, and they were absent until
# 2026-09-01.  They are here, with MAINNET values, rather than borrowed from
# config/config.yml -- because that file is the TEST chain and its values are wrong here in
# ways that do not announce themselves:
#
#     validators[0].bonded  100000qdn  -> 10x the 10,000 the allocation actually funds
#     timeout_commit        1.5s       -> the mainnet value is 3s (see the block time note)
#
# That last pair is the dangerous one: importing a 1.5s timeout_commit while mint is
# configured for 3s blocks would run the chain at roughly twice the assumed rate and
# over-mint for its entire life, silently.  The node runtime for mainnet IS a mainnet
# parameter, so it belongs in the mainnet parameter file.
#
# NOTE ON `validators:` AND KEY CUSTODY.  Its presence does not commit you to
# `ignite chain init`.  The documented mainnet flow is still publish-genesis -> gentx ->
# collect-gentxs, which keeps each validator's key on its own machine; these values then
# describe the node runtime that flow produces.  A test fleet may use chain init directly.
validation: sovereign

build:
  main: cmd/qadenad

client:
  openapi:
    path: docs/static/openapi.yml

validators:
  # ONE IDENTITY, NOT TWO.  This is both the genesis validator and the genesis pioneer, which
  # the chain requires rather than merely permits: a pioneer's external address is published
  # ONLY by updateIsValidator(), behind `if in.IsProposer { if !PioneerIsValidator {...} }`
  # (cmd/qadenad_enclave/enclave_external_address.go).  It fires on the node's first PROPOSED
  # block.  A pioneer that never bonds never proposes, so it never publishes an address,
  # getAddressPublishedPioneers() never counts it, and it never carries a secret share --
  # registered in genesis and inert.  config/config.yml has always merged these for the same
  # reason.  Splitting them was considered and rejected on 2026-09-01.
  - name: qfi-pioneer1
    # 10,000 QDN, matching the min-self-delegation floor documented in the staking section.
    # The qfi-pioneer1 row in allocations.csv funds 110,100 = this 10,000 self-bond + a 100,100
    # working balance for the re-share traffic a running pioneer never stops broadcasting.
    bonded: "10000qdn"
    app:
      # Taken from config/config.yml (the devnet's working value) by decision, 2026-09-01.
      # Deliberate, not inherited: it is high enough to price out spam and low enough that
      # the sponsored flows in Phase D stay affordable -- a sponsor pays this on every
      # wallet creation and every dsvs signature.
      minimum-gas-prices: "500000000aqdn"
      # A PROMISE, not an entry fee: fall below it and the validator is permanently
      # unbonded.  10,000 QDN in aqdn.  Note the unit trap (cosmos-sdk#9386): a bare
      # "10000" would mean 10000 aqdn, a floor of 0.00000000000001 QDN.
      min-self-delegation: "10000000000000000000000"
      pruning: "default"
      pruning-keep-recent: "0"
      pruning-interval: "0"
      # --- CARRIED FROM config/config.yml, 2026-09-01 -----------------------------------
      # These were absent and therefore taking Cosmos defaults.  state-sync is the one with
      # teeth: with no snapshot-interval a node produces NO snapshots, so nothing can ever
      # state-sync from it and every joiner must block-sync the whole chain.
      wasm:
        query_gas_limit: "300000"
        memory_cache_size: "300"
      evm:
        tracer: ""
        max-tx-gas-wanted: "0"
        cache-preimage: false
        min-tip: "0"
        geth-metrics-address: "0.0.0.0:8100"
        mempool:
          price-limit: "1"
          price-bump: "10"
          account-slots: "16"
          global-slots: "5120"
          account-queue: "64"
          global-queue: "1024"
          lifetime: "3h0m0s"
      json-rpc:
        enable: true
        address: "0.0.0.0:8545"
        ws-address: "0.0.0.0:8546"
        ws-origins:
          - "127.0.0.1"
          - "localhost"
        api: "eth,net,web3"
        gas-cap: "25000000"
        allow-insecure-unlock: true
        evm-timeout: "5s"
        txfee-cap: "1"
        filter-cap: "200"
        feehistory-cap: "100"
        logs-cap: "10000"
        block-range-cap: "10000"
        http-timeout: "30s"
        http-idle-timeout: "2m0s"
        allow-unprotected-txs: false
        max-open-connections: "0"
        enable-indexer: true
        metrics-address: "0.0.0.0:6065"
        batch-request-limit: "1000"
        batch-response-max-size: "25000000"
        enable-profiling: false
      state-sync:
        snapshot-interval: "2000"
        snapshot-keep-recent: "3"
    # The node's own client.toml.  Must match chain_id above: a client pointed at the wrong
    # chain-id sends every CLI query and tx to a chain that will reject them -- or, on a chain
    # that happens to share the id, accept them.
    client:
      chain-id: "qadena_482-1"
    config:
      # THE MONIKER IS THE PIONEER ID.  Not cosmetic, and not free-form: the node looks its
      # own signing key up BY MONIKER when it initialises the enclave --
      # cmd/qadenad/cmd/enclave_selfstart.go does
      #     GetAddressByName(clientCtx, moniker, ...)
      # and fails with "no key named %q (the moniker) in the keyring".
      # scripts/convert_to_validator.sh reads it back the same way
      # (`status | jq .node_info.moniker`) to learn which pioneer it is operating on.
      #
      # So this MUST equal the account name above.  Omitting it is not neutral: ignite
      # defaults the moniker to "mynode", the chain builds, the genesis is correct -- and
      # then InitEnclave cannot find a key named "mynode", so the node comes up and never
      # registers its enclave.  Observed on the 2026-09-01 bring-up.
      moniker: "qfi-pioneer1"

      # THE REMOTE SIGNER LISTENER.  WITHOUT THIS THE NODE CRASH-LOOPS.
      #
      # This chain signs blocks in an ENCLAVE: signer_enclave dials the node and serves as a
      # CometBFT remote signer.  Leave priv_validator_laddr unset and qadenad never opens the
      # listener, so signer_enclave dials 127.0.0.1:26659, retries 60 times at 1s intervals,
      # and exits 1.  The node then halts in EndBlock ("enclave wallet sync failed"), systemd
      # restarts it, and it does the whole thing again ~29 blocks later.
      #
      # Measured on M1, 2026-09-01: 345 consecutive halts at exact multiples of 29 blocks
      # (29, 58, 87, ...), NRestarts=109, from the very first run.  The node still produces
      # blocks between halts and reports catching_up=false, so it LOOKS healthy in any
      # snapshot short enough to miss a crash -- which is how it passed a first inspection.
      priv_validator_laddr: "tcp://0.0.0.0:26659"

      # addr_book_strict=false accepts PRIVATE addresses in the address book.  Required for a
      # fleet on 192.168.x.x; a public mainnet should drop it and take the strict default.
      log_level: "p2p:info,consensus:info,mempool:info,server:info,*:debug"
      p2p:
        addr_book_strict: false
        max_num_inbound_peers: "80"
        max_num_outbound_peers: "60"
      mempool:
        size: "10000"
      consensus:
        # ~3s BLOCKS, which is what blocks_per_year: 10512000 below assumes.
        #
        # timeout_commit is a FLOOR, not the rate.  On top of it every block pays for the
        # propose -> prevote -> precommit -> finalize cycle: two rounds of vote gossip, block
        # propagation, and this chain's ABCI work (EnclaveEndBlock does a gRPC round trip to
        # the enclave before the block can commit).  MEASURED on the real 4-validator M1-M4
        # fleet, 2026-09-02: "2s" produced 2.32s blocks, so that cycle costs ~0.32s on a LAN.
        #
        # 3s therefore yields ~3.3s, which is the intent -- near 3s, deliberately not exact.
        #
        # NOTE IF create_empty_blocks IS EVER TURNED OFF: the delays STACK.  finalizeCommit
        # sets the next round to CommitTime + timeout_commit (config.Commit(),
        # consensus/state.go), and enterNewRound THEN waits create_empty_blocks_interval again
        # before proposing.  Tuning timeout_commit alone is not enough in that mode.
        #
        # A geographically spread mainnet set carries MORE propagation latency, so RE-MEASURE
        # there and recompute blocks_per_year from what you observe.
        timeout_commit: "3s"
        timeout_propose: "3s"
        # EMPTY BLOCKS STAY ON, and that is a decision, not a default.  This chain needs a
        # steady heartbeat regardless of traffic:
        #   * the enclave's UpdateHeight runs PER BLOCK and drives SS interval-key rotation --
        #     no blocks, no re-sharing, and the SS set is consensus-relevant;
        #   * mint pays provisions per block against blocks_per_year, so a chain that idles
        #     produces fewer blocks than the inflation model assumes and under-pays stakers.
        # Measured 2026-09-02: 17 transactions in ~13,000 blocks, so on a quiet fleet ~99.9%
        # of blocks are empty -- turning them off would make the IDLE path the normal path.
        #
        # With create_empty_blocks true, the interval is unused (enterNewRound proposes
        # immediately); it only takes effect if empty blocks are turned off.
        create_empty_blocks: true
        create_empty_blocks_interval: "0s"

# ---------------------------------------------------------------------------------------------
# ACCOUNTS AND TOKEN ALLOCATION
# ---------------------------------------------------------------------------------------------
#
# NO MNEMONICS.  Production keys must never live in a repo file; supply addresses generated in
# whatever custody you are using (hardware, multisig, MPC).  Every address below is a
# placeholder until you supply one.
#
# The allocation below is NOT a starting structure to be edited here.  It is transcribed from
# tokenomics/allocations.csv, which is human-owned; qadena-master-brief.md is authoritative for
# every percentage, token count, cliff, vest duration and threshold.  Changing any of them is an
# OUT OF SCOPE decision -- ask the human, do not adjust this file.
#
# VESTING -- READ THIS, IT REVERSES EARLIER GUIDANCE IN THIS FILE.
#
# There are NO VESTING ACCOUNTS AND NO CONTRACTS AT GENESIS.  Not one.  Every bucket lands as a
# plain BaseAccount at a temporary native 2-of-3 multisig, fully liquid, and every lock is applied
# AFTER launch: permanent custody (cw3-flex / cw-vesting) is deployed in week 1 on the live chain
# (brief Phase C), and individual grants are issued later still through a cw3 proposal carrying
# MsgCreatePeriodicVestingAccount (brief Phase D1).
#
# This file previously described writing ContinuousVesting / DelayedVesting / PeriodicVesting /
# PermanentLocked accounts into genesis.json after the fact.  DO NOT DO THAT.  It would put locked
# accounts and unaudited schedules into the artifact everyone has to verify by hash before launch,
# and it is not what the brief specifies.
#
# The reason it is safe to defer: the locks still work when applied later.  Vesting locks hold
# against the EVM (balance reads resolve to SpendableCoin), locked tokens can still be delegated so
# the foundation tranche secures the chain while locked, and a backdated start_time gives everyone
# the same clock regardless of when their grant is actually issued.  See evm-vesting-handoff.md.
accounts:
  # --- CHAIN BOOTSTRAP IDENTITIES ---
  #
  # !! UNRESOLVED CONFLICT -- DO NOT DELETE THESE TWO WITHOUT READING THIS !!
  #
  # qadena-master-brief.md says "Zero external addresses at genesis except genesis validator
  # operators", and specifies exactly 11 genesis accounts: 10 buckets + 1 validator.  Taken
  # literally that deletes qfi-pioneer1 and treasury.  THEY CANNOT BE DELETED: the x/qadena genesis
  # stanza further down this file is NAME-BOUND to both --
  #     publicKeyList          needs qfi-pioneer1PubKID / qfi-pioneer1PubK_pubk (transaction AND credential)
  #     intervalPublicKeyIDList needs both a `pioneer` and a `treasury` nodeType entry
  #     bankSendWhitelistList   grants the AML scan exemption to treasuryPubKID
  # and buildscripts/setPubKAndPubKID.sh resolves "<name>PubKID" from the keyring for a NAMED
  # account, so the account has to exist at genesis for the substitution to produce anything.
  #
  # Resolving this means either (a) accepting two bootstrap identities the brief excludes, or
  # (b) changing what x/qadena requires at genesis.  Both are OUT OF SCOPE per the brief
  # ("genesis validator count/operators").  ASK THE HUMAN.  This blocks Phase B, not Phase A.
  #
  # Until then both are left in place, and their amounts are NOT drawn from any bucket -- which
  # is itself part of the conflict, since the bucket percentages already sum to 100.
  # 110,100 QDN = 10,000 gentx self-bond (the min-self-delegation floor, so the genesis node and
  # every later joiner share one number) + 100,100 working balance.  NOT foundation-sponsored:
  # this node bootstraps the chain, so both halves are real.  The working balance is what pays
  # for what a RUNNING pioneer broadcasts forever -- MsgPioneerAddPublicKey,
  # MsgPioneerUpdateIntervalPublicKeyID and the MsgPioneerUpdatePublicKey SS re-share, emitted
  # from updateSSIntervalKey off UpdateHeight (scripts/foundation_sponsor_node.sh documents the
  # full message set).  A join-only balance is a trap: the node runs, then stops re-sharing while
  # continuing to look healthy.
  # Operator-supplied address; part of the Node Operations bucket, not additional to it.
  - name: qfi-pioneer1
    address: "TODO_ADDR_QFI_PIONEER1"
    coins: ["110100qdn"]
  # NO `treasury` ACCOUNT.  It is gone as of 2026-09-01, and nothing references it:
  #   * the chain role it served is now `wallet-incentive-pool`, funded from bucket 01;
  #   * its only other use was bankSendWhitelistList, a field x/qadena no longer HAS.
  # Removing it also makes this file's accounts sum to exactly 4,000,000,000 -- while it
  # existed, its unset amount was supply that allocations.csv did not account for.
  #
  # The DEVNET (config/config.yml) still has one and still needs it: setup_prerequisites.sh
  # funds every test user from it. That is a test-chain concern and does not belong here.

  # --- THE TEN ALLOCATION BUCKETS ---
  #
  # Transcribed from tokenomics/allocations.csv, which is HUMAN-OWNED and authoritative.
  # Names, percentages and amounts are COPIED, never recomputed here.  If a number below
  # disagrees with the CSV, the CSV wins and this file is stale.
  #
  # Every bucket is held at genesis by a TEMPORARY native 2-of-3 multisig of the operator's own
  # keys.  Permanent custody (cw3-flex / cw-vesting) is deployed in week 1 on the LIVE chain --
  # see Phase C of the brief -- after which these msigs are empty scaffolding and are retired.
  #
  # bucket_id 08 and 11 are intentionally absent.  Ten buckets, not twelve.

  # Adoption Programs -- 24%, 960,000,000 QDN.  custody: cw3-flex 3of5
  # Merchant incentives, DID onboarding, loyalty, gas subsidies. Capped annual tranches.
  - name: adoption
    address: "TODO_ADDR_ADOPTION"
    coins: ["999000000qdn"]

  # THE WALLET INCENTIVE POOL -- part of bucket 01, not a bucket of its own.
  #
  # x/qadena debits this account DIRECTLY for create_wallet incentives (500 + 500 per
  # wallet, 50 per ephemeral wallet).  It is found by HARDCODED constants
  # (types.IncentivePoolNodeID / NodeType, both "wallet-incentive-pool") and the chain
  # PANICS on its first wallet creation if the intervalPublicKeyIDList entry is missing.
  #
  # It sits inside Adoption Programs because onboarding is exactly what that bucket is
  # for -- so the 24% is unchanged and no eleventh allocation is invented.  1M QDN is a
  # working float, not the whole onboarding budget; top it up from adoption as it drains.
  #
  # It replaces the old `treasury` role.  "treasury" collided three ways: this account,
  # the Foundation Treasury bucket, and a deployment's sec-treasury.
  - name: wallet-incentive-pool
    address: "TODO_ADDR_WALLET_INCENTIVE_POOL"
    coins: ["1000000qdn"]

  # Long-Term Reserve -- 15%, 600,000,000 QDN.  custody: cw-vesting + cw3-flex 4of5
  # 10yr linear unlock ENFORCED by cw-vesting; cw3 controls each unlocked tranche. Governance-
  # only.
  - name: ltr
    address: "TODO_ADDR_LTR"
    coins: ["600000000qdn"]

  # Foundation Treasury -- 14%, 560,000,000 QDN.  custody: cw-vesting + cw3-flex 3of5
  # 10% liquid for ops. Locked 504M is DELEGATED to consortium validators (locked stake works).
  - name: foundation
    address: "TODO_ADDR_FOUNDATION"
    coins: ["560000000qdn"]

  # Builder & Partner Grants -- 11%, 440,000,000 QDN.  custody: cw3-flex 3of5
  # Integrators, POS, dev milestones. Vesting grant on delivery, start_time=grant date.
  - name: grants
    address: "TODO_ADDR_GRANTS"
    coins: ["440000000qdn"]

  # Personnel -- 8%, 320,000,000 QDN.  custody: cw3-flex 3of5
  # Team 6% (12mo cliff@25, 36mo) + Advisors 2% (6mo cliff@12.5, 18mo). Split charter-bound.
  - name: personnel
    address: "TODO_ADDR_PERSONNEL"
    coins: ["320000000qdn"]

  # Early Backers Escrow -- 7%, 280,000,000 QDN.  custody: cw3-flex 3of5
  # Grants as addresses arrive: 12mo cliff@20, 36mo linear, start_time=TGE (backdated).
  - name: backers
    address: "TODO_ADDR_BACKERS"
    coins: ["280000000qdn"]

  # Founders Escrow -- 5%, 200,000,000 QDN.  custody: cw3-flex 3of5
  # 2 founders x 100M. Grant on address supply: 18mo cliff@12.5, 42mo, start_time=TGE.
  # eth_secp256k1, never-used, personal 2of3 multisig advised.
  - name: founders
    address: "TODO_ADDR_FOUNDERS"
    coins: ["200000000qdn"]

  # Contingency Reserve -- 6%, 240,000,000 QDN.  custody: cw3-flex 2of5
  # Security incident + regulatory response. LOW threshold for speed. Two named triggers in
  # charter.
  - name: contingency
    address: "TODO_ADDR_CONTINGENCY"
    coins: ["240000000qdn"]

  # Public Sector Programs -- 8%, 320,000,000 QDN.  custody: cw3-flex 5of7
  # Sub-allocations: SEC PH VERITAS 60M; future MOUs; OTC swap reserve. Entities only, never
  # individuals. Funds feegrant sponsor account.
  - name: pubsec
    address: "TODO_ADDR_PUBSEC"
    coins: ["320000000qdn"]

  # Node Operations -- 1%, 40,000,000 QDN.  custody: native msig 3of5
  # Post-launch onboarding: 10,000 self-bond + gas per node, then foundation delegates.
  # Commission is operator compensation.
  # SPLIT ROW: this reserve PLUS the qfi-pioneer1 account below sum to the full 40,000,000 QDN
  # (39,889,900 + 110,100).  There is no separate genesis-validator account: qfi-pioneer1 is it.
  - name: nodeops
    address: "TODO_ADDR_NODEOPS"
    coins: ["39889900qdn"]

  # NO SEPARATE `genval1` ACCOUNT.  Merged into qfi-pioneer1 above on 2026-09-01: the genesis
  # validator and the genesis pioneer are one identity, because a non-validator pioneer never
  # publishes an address and never carries a share.  The validator set still grows one node at
  # a time POST-launch via Phase D2 -- one gentx here.

genesis:
  # Must match the top-level chain_id above.  See the registry note there.
  chain_id: "qadena_482-1"

  app_state:

    # -----------------------------------------------------------------------------------------
    # STAKING
    # -----------------------------------------------------------------------------------------
    staking:
      # ---------------------------------------------------------------------------------------
      # MIN-SELF-DELEGATION IS NOT A GENESIS PARAM -- and it is decided here anyway.
      #
      # There is NO chain-wide minimum self-delegation.  x/staking validates only three things
      # (x/staking/types/msg.go): the self-bond is positive, the operator's DECLARED
      # MinSelfDelegation is positive, and the bond is not below that declaration.  x/qadena adds
      # no gate of its own.  So the chain's floor is 1 aqdn, and the floor that actually applies is
      # whatever policy sets.
      #
      # That policy lives in NODE config, not in genesis state:
      #     validators.first().app.min-self-delegation      (config/config.yml)
      # which scripts/convert_to_validator.sh reads for both the genesis validator and every joiner.
      # It is recorded HERE because it is a mainnet PARAMETER DECISION, and because leaving it unset
      # is not neutral: convert_to_validator.sh falls back to **1 aqdn**, announces it, and proceeds.
      # A mainnet validator could then be created with a self-bond of one atto-QDN.
      #
      # MAINNET VALUE: 10,000 QDN = "10000000000000000000000" aqdn, matching config/config.yml.
      # Note the unit trap (cosmos-sdk#9386): a bare "10000" means 10000 aqdn, a floor of
      # 0.00000000000001 QDN.
      #
      # WHY IT MATTERS MORE HERE THAN ON MOST CHAINS.  Voting power comes from the FOUNDATION's
      # delegation, not the operator's bond, and slashing is keyed to the infraction height -- so
      # the foundation absorbs the penalty whether or not it reacts.  The self-bond is therefore the
      # operator's ENTIRE exposure.  At 1 aqdn they risk nothing; at 10,000 QDN they risk something.
      # It is a PROMISE, not an entry fee: fall below it and the validator is permanently unbonded.
      #
      # Fees for becoming a validator ARE foundation-sponsorable (convert_to_validator.sh
      # --foundation-sponsored); the self-bond deliberately is not.
      params:
        bond_denom: "aqdn"
        # 21 days is the Cosmos default and the usual choice.  It is the window during which a
        # validator's stake is still slashable after they unbond, so it is the main defence against
        # long-range attacks -- shortening it to please delegators weakens exactly that.
        unbonding_time: "1814400s"
        # 100 is a common launch size.  Raising it later is easy, lowering it forcibly unbonds the
        # tail, so start at or below where you intend to end up.
        max_validators: 100
        max_entries: 7
        historical_entries: 10000
        # CONTESTED -- decide deliberately.  The SDK default is 0.  A floor prevents a race to 0%
        # commission, which pushes validators to fund themselves by other means and tends to
        # centralise the set.  But it is not settled practice: the Cosmos Hub REJECTED a 5% floor in
        # proposal 76 before revisiting it later.  5% is the usual figure where chains do set one.
        min_commission_rate: "0.05"

    # -----------------------------------------------------------------------------------------
    # SLASHING -- entirely absent from config/config.yml today
    # -----------------------------------------------------------------------------------------
    slashing:
      params:
        # ~16.7 hours at 3s.  Cosmos Hub uses 10000 blocks which at its ~6.5s is ~18h, so this is
        # the same real-world window expressed in faster blocks.  RECOMPUTE if block time moves --
        # this is a duration written in blocks, so a wrong block-time assumption shifts it directly.
        signed_blocks_window: "20000"
        # must sign 5% of the window to avoid jail -- Hub's value, tolerant of ordinary blips
        min_signed_per_window: "0.05"
        downtime_jail_duration: "600s"
        # 5% -- both Cosmos Hub and Osmosis.  Equivocation is never accidental, so this is the one
        # fault with a serious penalty.  Osmosis additionally jails permanently.
        slash_fraction_double_sign: "0.05"
        # DECIDE DELIBERATELY.  0.01% is the Hub's value.  Osmosis slashes NOTHING for downtime and
        # relies on jailing alone, reasoning that downtime is an operator mistake and slashing it
        # punishes delegators who cannot control it.  Since jail already costs the validator all
        # rewards, the slash adds little deterrence.  Set 0 here if you find that argument
        # persuasive -- for an identity chain where operators may be regulated institutions rather
        # than professional validators, it is worth weighing.
        slash_fraction_downtime: "0.0001"

    # -----------------------------------------------------------------------------------------
    # MINT
    # -----------------------------------------------------------------------------------------
    mint:
      params:
        mint_denom: "aqdn"
        # 9,500,000 -- a ROUND NUMBER, and it lands almost exactly on the measurement.
        #
        # 31,536,000 / 9,500,000 = 3.3196s implied, against 3.32s MEASURED on the real
        # 4-validator M1-M4 fleet on 2026-09-02 (timeout_commit "3s", 23 blocks / 76.4s).  That
        # is a 0.01% difference -- the round number costs nothing here, and a figure people can
        # hold in their heads is worth more than four digits of false precision on a rate that
        # will change the moment the validator set is geographically spread.
        #
        # It is the BEST CASE deliberately: the fastest this chain has been observed to run.
        #
        # WHICH WAY THE ERROR RUNS, because it is not symmetric.  Mint pays
        # annual_provisions / blocks_per_year PER BLOCK, so realised inflation is
        #     target x (t_assumed / t_actual)
        # Blocks FASTER than assumed mint MORE than 1%; SLOWER mint less.  Assuming the best
        # case therefore biases toward UNDER-minting, which pays stakers slightly less than
        # modelled.  The opposite bias -- padding the assumption to 4s "for headroom" -- would
        # over-mint by ~20% at the measured rate and break a publicly stated 1% figure, which
        # is the worse failure.  Deliberate choice, 2026-09-02.
        #
        # AND IT IS CORRECTABLE.  blocks_per_year is x/mint params, updatable by governance
        # (MsgUpdateParams, gov authority) -- unlike the genesis-frozen items in this file.  So
        # the plan is: launch on this, MEASURE on the real topology, and correct by proposal.
        # Write that proposal into the launch runbook as a scheduled action, not a surprise.
        #     blocks_per_year = 31,536,000 / observed_block_time
        #
        # NOT the number qadena-master-brief.md Phase B asks for.  That one is measured on the
        # single-validator DEVNET, which runs at timeout_commit with no consensus round-trip.
        # Keep the two separate: a devnet measurement must never be pasted in here.
        blocks_per_year: "9500000"
        # 1.00% FIXED.  inflation_min == inflation_max, so there is no band and no steering -- the
        # rate is a constant.  This supersedes the earlier 10%/3% band; see tokenomics/
        # qadena-master-brief.md, which is authoritative for every token decision.
        #
        # WHY SO LOW.  Provisions = rate x TOTAL supply, but they are paid out to BONDED stake
        # only.  At launch bonded stake is ~504M of 4,000,000,000 -- the foundation's locked
        # tranche delegated to consortium validators -- so the yield concentrates hard:
        #     1% x 4.0B = 40M/yr paid to ~504M bonded  ->  ~7.9% staker APR
        # A Cosmos-Hub-style 10% ceiling against that same tiny bonded set would pay roughly 79%,
        # which is absurd yield for a permissioned consortium and dilutes every holder to fund it.
        # The old band was written before the bonded set was known to be this small.
        #
        # Uncapped: inflation stays ON.  Never describe QDN as having a total, max or capped
        # supply -- 4,000,000,000 is the INITIAL supply.
        inflation_max: "0.010000000000000000"
        inflation_min: "0.010000000000000000"
        # No rate change: with min == max there is nothing to change between.
        inflation_rate_change: "0"
        #
        # goal_bonded AND inflation_rate_change ARE NOW INERT.  They are kept, not deleted, so a
        # future reader sees they were considered rather than forgotten -- x/mint only consults
        # them when inflation is allowed to move between a min and a max, and here it is not.
        # If the 1% constant is ever replaced by a real band, these two wake up again: do not
        # "restore" the band without deciding these deliberately at the same time.
        goal_bonded: "0.67"

    # -----------------------------------------------------------------------------------------
    # GOVERNANCE -- config/config.yml values are test-only (300s voting)
    # -----------------------------------------------------------------------------------------
    gov:
      params:
        # 10,000 QDN, taken from config/config.yml by decision, 2026-09-01.
        #
        # STILL REVISIT BY GOVERNANCE ONCE A PRICE EXISTS.  The right way to set this is by
        # TARGET FIAT VALUE, not token count.  The real chains anchor
        # around USD 1-2k of deposit: Cosmos Hub 250 ATOM, Osmosis 6000 OSMO.  qdn has no market
        # price yet, so pick the token amount that lands in that band at your expected launch price
        # and revisit by governance once a price exists.  10,000 qdn below is a placeholder shape.
        min_deposit:
          - denom: "aqdn"
            amount: "10000000000000000000000"
        # LAUNCH-WINDOW TIMINGS.  The three periods below are deliberately SHORTER than the
        # steady-state values, and they are TEMPORARY.  Read the sunset clause before copying them
        # anywhere.  Steady-state values to restore: max_deposit 172800s, voting 604800s,
        # expedited 86400s.
        #
        # WHY SHORT IS SAFE *NOW* AND NOT LATER.  At launch, bonded stake is ~504M and nearly all
        # of it is the foundation's locked tranche delegated to consortium validators -- so 66.7%
        # of bonded stake IS the foundation.  The expedited period is therefore not a defence
        # against outsiders; it is a SELF-IMPOSED REVIEW WINDOW, time for a non-colluding party to
        # notice and object before something irreversible executes.  The stock warning about
        # "giving distributed delegators less time to notice" does not bite yet because there are
        # no distributed delegators yet.  That changes, and when it does these values must go back.
        #
        # 24h.  Clears junk proposals out of the queue faster.  Low risk while the foundation
        # self-funds every deposit.
        max_deposit_period: "86400s"
        #
        # 72h, down from 7 days.  Survives a weekend -- a proposal filed Friday evening still ends
        # Monday evening -- while being 2.3x more responsive than the steady-state value.
        #
        # Do NOT compress this towards the expedited period.  A failed expedited proposal is
        # converted to a regular one rather than rejected (see below), and the SDK sets the new end
        # time from the ORIGINAL voting start -- x/gov/abci.go:
        #     endTime := proposal.VotingStartTime.Add(*params.VotingPeriod)
        # so the fallback window is (voting_period - expedited_voting_period), not a fresh period.
        # At 72h/6h that leaves 66h of fallback.  Set voting_period to 8h with expedited at 6h and
        # the fallback track silently collapses to 2h.  Keep the ratio wide.
        voting_period: "259200s"
        # expedited is for emergencies (a security patch), so it costs 5x
        expedited_min_deposit:
          - denom: "aqdn"
            amount: "50000000000000000000000"
        # 6h, down from 24h.  Long enough that a non-colluding council member in SOME timezone is
        # awake and could object; short enough to actually be an emergency lever.
        #
        # THIS NUMBER HAS A PRECONDITION: it assumes the council spans timezones (PH/AU/US).  If
        # the council ends up concentrated in ONE timezone, raise this to 12h ("43200s").  A window
        # that fits entirely inside one region's night is the wrong design when the thing that can
        # pass is enclave key custody -- see the charter rule below.
        #
        # Hard SDK constraint: must be STRICTLY LESS than voting_period, or ValidateBasic rejects
        # the params (x/gov/types/v1/params.go).
        expedited_voting_period: "21600s"
        # UNCHANGED at 0.667, and it must stay above `threshold` (another hard SDK constraint).
        # With the expedited period cut 4x, this is the only thing left separating the two tiers.
        # Note also that a FAILED expedited proposal does not burn its deposit -- it just converts
        # to a regular proposal -- so expedited is cheap to attempt.  Keep the bar high.
        expedited_threshold: "0.667"
        #
        # CHARTER RULE -- the params cannot express this, so the consortium agreement must.
        # gov v1 has exactly two tiers and no per-message-type periods (see the note further down),
        # while a passed proposal is what makes an enclave measurement `active` -- after which every
        # node hands its sealed jar and regulator keys to that MRENCLAVE.  So the expedited track is
        # RESERVED for params, upgrades and incident response, and MUST NOT be used for
        # MsgUpdateEnclaveIdentity.  Enclave registration is a routine operation and belongs on the
        # regular track; at 72h that is no longer painful.  This is the operational stand-in for a
        # per-handler bar (backlog 95) until one exists.
        #
        # SUNSET -- these values expire.  Restore the steady-state timings when EITHER:
        #   (a) stake NOT delegated by the foundation exceeds 25% of bonded stake, or
        #   (b) TGE + 90 days,
        # whichever comes first.  The risk being managed here is not the low numbers; it is the low
        # numbers still being in place when real delegators arrive and can no longer be assumed to
        # be watching the council chat.  Write the restoring MsgUpdateParams proposal at launch and
        # commit it to the repo, so restoration is one command rather than a drafting exercise
        # nobody gets around to.  Because these are gov params, the restoring proposal runs UNDER
        # the lowered timings -- there is no chicken-and-egg.
        # TALLY PARAMS, AND WHY THESE NUMBERS.
        #
        # Read what quorum actually permits, not how many validators it implies: at minimum turnout
        # a proposal passes with just over half of it, so quorum 0.334 lets ~17% of bonded stake
        # decide.  0.40 raises that to ~20% and is Cosmos Hub's value -- well exercised, and short of
        # the level where legitimate proposals start expiring for delegator apathy, which is the
        # common failure mode on live chains.  Do not read this as "N of M validators": once real
        # delegators exist, turnout is a fraction of STAKE and most of it is not the validators'.
        #
        # THIS NOW DECIDES MORE THAN MONEY.  Since 2026-08-21, a passed proposal is what makes an
        # enclave measurement `active`, and an active measurement is one every node will hand its
        # sealed jar and regulator keys to once someone runs code with that MRENCLAVE
        # (vouchesForIdentity, backlog 92).  Governance is the trust anchor for the enclave now, so
        # these numbers gate key custody, not just spending.
        quorum: "0.40"
        threshold: "0.5"
        # VETO STAYS AT THE STANDARD 0.334, deliberately.  It is the ANTI-SPAM mechanism, not the
        # way to block a proposal you disagree with -- a simple majority of No already fails one at
        # `threshold`, with no deposit burned.  Lowering veto so a single operator could block an
        # enclave registration would also make it cheap to burn a colleague's deposit on a
        # legitimate one, and registering a measurement is a ROUTINE operation, not a rare event.
        veto_threshold: "0.334"
        #
        # WHAT THESE PARAMS CANNOT EXPRESS, and do not pretend to: a higher bar for
        # MsgUpdateEnclaveIdentity than for a text proposal.  gov v1 has exactly two tiers, regular
        # and expedited, with no per-message-type thresholds.  If enclave registration should need
        # more than an ordinary proposal, that belongs in the msg handler -- see backlog 95 -- not in
        # a chain-wide param distorted to approximate it.
        # burn the deposit of a vetoed proposal -- makes spamming governance expensive
        burn_vote_veto: true
        # a proposal must arrive with 25% of the deposit, so the mempool is not free to fill
        min_initial_deposit_ratio: "0.25"

    # -----------------------------------------------------------------------------------------
    # DISTRIBUTION -- absent from config/config.yml today
    # -----------------------------------------------------------------------------------------
    distribution:
      params:
        # 2% of staking rewards to the community pool, spendable by governance
        community_tax: "0.02"
        withdraw_addr_enabled: true

    # -----------------------------------------------------------------------------------------
    # CRISIS
    # -----------------------------------------------------------------------------------------
    # crisis: DELIBERATELY ABSENT -- decide this BEFORE launch, not after.
    #
    # x/crisis is deprecated as of cosmos-sdk v0.53, which is the version this chain runs
    # (go.mod: v0.53.5).  It moves to contrib/ in v0.54, so the next SDK upgrade forces a choice
    # between a contrib import and removal.  There is also an advisory that it does not actually
    # charge ConstantFee (GHSA-w5w5-2882-47pc), so tuning the fee buys nothing.
    #
    # The asymmetry that matters: dropping it from app wiring before genesis costs nothing.
    # Dropping it from a LIVE chain is a coordinated upgrade with a migration handler, because the
    # module's genesis state and store keys already exist.  Launching with a module you have already
    # decided to remove means signing up for that migration.
    #
    # It is still wired in app/app.go and app/app_config.go today, so removing it is a code change,
    # not a config change.  config/config.yml keeps a crisis section only because the module is
    # still registered there.

    protocolpool:
      params:
        enabled_distribution_denoms:
          - "aqdn"

    bank:
      denom_metadata:
        - description: "Qadena Token"
          denom_units:
            - denom: "aqdn"
              exponent: 0
              aliases: []
            - denom: "qdn"
              exponent: 18
              aliases: []
          base: "aqdn"
          display: "qdn"
          name: "Qadena Token"
          symbol: "qdn"

    # -----------------------------------------------------------------------------------------
    # QADENA
    # -----------------------------------------------------------------------------------------
    # -----------------------------------------------------------------------------------------
    # WASM  --  present so the permissions are a DECISION, not a default.
    #
    # The token design uses no contracts at genesis (custody is native multisig throughout), but
    # x/wasm is compiled in, so its params exist either way.  Spelling them out here keeps
    # "who may upload code, and who may instantiate it" reviewable in this file rather than
    # inherited from whatever wasmd currently defaults to.
    wasm:
      codes: []
      contracts: []
      params:
        code_upload_access:
          addresses: []
          permission: "Everybody"
        instantiate_default_permission: "Everybody"
      sequences: []
    # -----------------------------------------------------------------------------------------
    # EVM  --  THE evm_denom IS LOAD-BEARING AND HAS NO SAFE DEFAULT.
    #
    # Omitting this whole section does not omit the module: Cosmos EVM falls back to its own
    # default denom, "aatom", and the node PANICS at startup with
    #     error initializing evm coin info: denom metadata aatom could not be found
    # because bank.denom_metadata declares aqdn and nothing else.  The chain builds, the genesis
    # verifies, and the node dies on first start.  Observed 2026-09-01.
    #
    # extended_denom must match evm_denom -- both are aqdn, the 18-decimal base unit.  Note the
    # EVM chain id is NOT set here: it is PARSED from chain_id (<name>_<eip155>-<epoch>), and a
    # malformed one fails silently.  See the chain_id note at the top of this file.
    #
    # Precompiles are left empty deliberately, matching the devnet.  Enabling one is a
    # governance decision with a security review, not a launch default.
    evm:
      accounts: []
      params:
        access_control:
          call:
            access_control_list: []
            access_type: "ACCESS_TYPE_PERMISSIONLESS"
          create:
            access_control_list: []
            access_type: "ACCESS_TYPE_PERMISSIONLESS"
        active_static_precompiles: []
        evm_channels: []
        evm_denom: "aqdn"
        extended_denom_options:
          extended_denom: "aqdn"
        extra_eips: []
        history_serve_window: "8192"
      preinstalls: []
    qadena:
      params:
        # ONBOARDING INCENTIVES, paid by create-wallet-sponsor -- an operating cost, not an
        # allocation.  At 500 + 500 per wallet plus 50 per eph wallet, onboarding 100k users is
        # ~100M qdn out of a live hot account.  Size the sponsor balance against your growth plan
        # and decide whether these should start lower on mainnet than on the test chain.
        create_wallet_incentive:
          amount: "500"
          denom: "qdn"
        create_wallet_transparent_incentive:
          amount: "500"
          denom: "qdn"
        create_ephemeral_wallet_incentive:
          amount: "0"
          denom: "qdn"
        create_ephemeral_wallet_transparent_incentive:
          amount: "50"
          denom: "qdn"

        # Fiat-denominated, so these REQUIRE a working pricefeed: create/update credential converts
        # through cn:qdn:php.  Do not launch with fiat fees until prices are actually being posted.
        create_credential_fee: "30php"
        create_bulk_credentials_fee: "10php"

        ekyc_submit_new_app_royalty_percentage: "40"
        ekyc_submit_reuse_app_royalty_percentage: "20"
        ekyc_submit_reuse_provider_royalty_percentage: "20"
        ekyc_identity_owner_royalty_percentage: "30"

        # CREDENTIAL UPDATE POLICY
        update_credential_fee: "30php"
        # 2, MATCHING THE POLICY THE CODE ACTUALLY IMPLEMENTS.  Resolved 2026-09-01: this file
        # said 1 while the devnet had moved to 2 in f233c6b6, the commit that rewrote
        # x/qadena/common/credential_policy.go (155 lines).  1 was stale, not a decision.
        #
        # WHAT IT IS.  A version marker for the credential-update policy, which runs INSIDE THE
        # ENCLAVE on every validator -- so two nodes disagreeing is a consensus failure, not a
        # bad UX.  The policy avoids golang.org/x/text because its Unicode tables are
        # module-versioned; the stdlib's move only with the toolchain, and this field exists to
        # make that movement VISIBLE.  See the header of credential_policy.go.
        #
        # NOTHING READS IT.  It is a real params field (params.proto #12) with a getter, but no
        # keeper, enclave or Validate() path consumes it -- checked 2026-09-01.  So a wrong
        # value changes no behaviour; it just makes the chain misdescribe itself from block 1,
        # which is the one thing a version marker must not do.
        update_credential_policy_version: 2

        # PRESENT SO IT IS NOT A DEFAULT.  config/config.yml sets 1; omitting it here would
        # take whatever x/qadena defaults to, which is not the same decision.
        update_credential_max_changed_identity_fields: 1
        update_credential_max_identity_aliases: 4
        update_credential_max_life_events: 2
        update_name_max_edit_distance: 2
        update_name_max_edit_distance_percent: 34
        update_birthdate_max_year_delta: 1
        # ~1 day at 3s blocks.  RECOMPUTE with your measured block time.  The test config says
        # "~1 day at 8s blocks" for 10000 blocks, which has never matched its own chain -- at the
        # test chain's 1.5s that value is about 4 hours, not a day.
        update_credential_min_blocks_between_updates: "28800"
        update_credential_allow_last_name_life_event: true
        update_credential_allow_gender_change: true

        # AML scan.  These are LEGAL figures, so they must be confirmed against each regulator the
        # chain reports to rather than carried over from here.  The threshold that applies to a
        # transfer is the LOWEST among the sender's residency and citizenship, so listing a country
        # can only tighten a sender's limit, never loosen it.
        #
        # Every currency named below needs a cn:qdn:<denom> market with a live price, or transfers
        # fail closed: the keeper refuses to scan a transfer it cannot measure. Adding a
        # jurisdiction here means adding its market and an oracle posting to it.
        # From config/config.yml by decision, 2026-09-01.  Note these are FIAT-denominated
        # and converted through the pricefeed, so they are only as good as the posted price
        # below -- a stale cn:qdn:php makes every threshold wrong in the same direction.
        suspicious_transaction_threshold: "10000usd"
        suspicious_transaction_threshold_overrides:
          # e.g. PH files at PHP 500,000 rather than a converted USD figure
          - country: "PH"
            threshold: "500000php"
        # 30 days.  Shortening this narrows what counts as structuring; lengthening it grows the
        # stored history per wallet.
        suspicious_transaction_window_seconds: 2592000
        # Leave false unless the chain deliberately permits un-KYC'd wallets to send.  False is the
        # enforcing state, and is also what an un-upgraded chain reports, so it fails safe.
        allow_transfer_without_ekyc: false
        # Institutional guardians stating the identity they verified on a social-recovery
        # signature: 0 = off, 1 = audit (compare and log, still accept), 2 = enforce.
        #
        # SHIPS AT 0, and this deliberately DIFFERS from config/config.yml, which runs the devnet
        # at 1 (audit) so the invariant gets measured somewhere before it is enforced anywhere.
        #
        # Raising this to 2 before a devnet at 1 has shown real traffic matching would fail every
        # institutional signature closed -- the gate rests on a guardian's hash equalling the one
        # issuance produced, which is unproven until those logs are clean.  Individual guardians
        # are exempt in every mode.  Raised by governance, not by a deploy.
        sign_recover_key_guardian_assertion_mode: 0

      # ---------------------------------------------------------------------------------
      # THE AML SCAN WHITELIST -- WITHOUT THIS THE CHAIN IS FUNDED AND FROZEN.
      #
      # app.go:630 registers qadenaBankSendRestriction on the bank keeper, so it sits UNDER
      # SendCoins and per-output under InputOutputCoins -- MsgSend, MsgMultiSend, authz-wrapped
      # sends and EVM value transfers alike, not just the message a user typed.  It exempts
      # exactly one thing: a MODULE account on either side (fees, staking, gov deposits, the
      # x/qadena escrow).  EVERYTHING ELSE IS SCANNED, and refused if it cannot be scanned.
      #
      # None of these accounts holds an eKYC credential -- they are plain addresses and native
      # multisigs.  So without an entry here, a bucket can pay gas, bond, and vote, but cannot
      # send a single token to a person or to another bucket: code 1159, ErrBankSendNotScannable.
      # Adoption could not even refill the wallet incentive pool.
      #
      # Listed is NOT exempt.  A listed party may transact without holding a credential, but its
      # sends are still scanned, measured and reported -- which is why this replaced the old
      # bankSendWhitelistList (see the note below) rather than restoring it.
      #
      # codeID 0 because every one of these is a PLAIN ACCOUNT, not a wasm contract.  A contract
      # MUST be pinned to its code ID: its admin can migrate it, and an unpinned entry would
      # carry the approval over to code governance never reviewed.  The chain rejects a mismatch.
      #
      # Per-deployment treasuries (ekycph-treasury, enf-treasury, sec-treasury) are NOT here.
      # They are created at runtime and add themselves by governance during onboarding.
      #
      # tokenomics/build_config.py adds any bucket missing from this list when it renders the
      # ignite config.  Listing them here anyway is the point: the whitelist is a security
      # decision and belongs somewhere a human reviews, not only in a generator's fallback.
      scannedContractWhitelistList:
        - address: TODO_ADDR_ADOPTION
          codeID: 0
          reason: "Adoption Programs genesis custody"
        - address: TODO_ADDR_WALLET_INCENTIVE_POOL
          codeID: 0
          reason: "Wallet Incentive Pool genesis custody"
        - address: TODO_ADDR_LTR
          codeID: 0
          reason: "Long-Term Reserve genesis custody"
        - address: TODO_ADDR_FOUNDATION
          codeID: 0
          reason: "Foundation Treasury genesis custody"
        - address: TODO_ADDR_GRANTS
          codeID: 0
          reason: "Builder & Partner Grants genesis custody"
        - address: TODO_ADDR_PERSONNEL
          codeID: 0
          reason: "Personnel genesis custody"
        - address: TODO_ADDR_BACKERS
          codeID: 0
          reason: "Early Backers Escrow genesis custody"
        - address: TODO_ADDR_FOUNDERS
          codeID: 0
          reason: "Founders Escrow genesis custody"
        - address: TODO_ADDR_CONTINGENCY
          codeID: 0
          reason: "Contingency Reserve genesis custody"
        - address: TODO_ADDR_PUBSEC
          codeID: 0
          reason: "Public Sector Programs genesis custody"
        - address: TODO_ADDR_NODEOPS
          codeID: 0
          reason: "Node Operations genesis custody"
        - address: TODO_ADDR_QFI_PIONEER1
          codeID: 0
          reason: "genesis validator and pioneer: bootstrap identity, Node Operations bucket"

      # bankSendWhitelistList IS GONE -- the field no longer exists in x/qadena GenesisState
      # (see types/genesis.pb.go: Params, CredentialList, PublicKeyList, WalletList,
      # IntervalPublicKeyIDList, PioneerJarList, JarRegulatorList, SuspiciousTransactionList,
      # SuspiciousTransactionCount, ProtectKeyList, RecoverKeyList, EnclaveIdentityList,
      # ScannedContractWhitelistList).  It used to grant an UNSCANNED exemption; what replaced it
      # is the scannedContractWhitelistList above, which is narrower: a listed party may transact
      # without holding a credential, but its sends are still scanned, measured and reported.
      #
      # The stale stanza was carried here until 2026-09-01 naming `treasuryPubKID`, and removing it
      # removes the LAST reason launch-config needed a `treasury` account at all -- the chain role
      # that account served is now `wallet-incentive-pool`, which is funded from bucket 01.

      # THE MOST SECURITY-CRITICAL ENTRY IN THIS FILE.
      # These are the SGX measurements the chain will trust.  The test chain ships
      # test-unique-id/test-signer-id/test-product-id, which WORK -- so this is the item most likely
      # to be shipped unchanged by accident.  Placeholders here are deliberately invalid.
      # !! TEST-FLEET VALUES !!  These are the placeholders config/config.yml uses;
      # buildscripts/build_enclave.sh rewrites uniqueID and signerID in the GENERATED
      # genesis.json with the ids the debug build produced.  They are correct for a
      # debug fleet (M1-M4 have no SGX) and MUST NOT reach mainnet: a real launch
      # needs the MRENCLAVE of the exact SGX build, read with
      #     qadenad query qadena enclave-measurement
      enclaveIdentityList:
        - uniqueID: "test-unique-id"
          signerID: "test-signer-id"
          productID: "test-product-id"
          status: active

      # qfi-pioneer1 and treasury only.  Every service provider is onboarded at runtime by a
      # MsgAddServiceProvider governance proposal -- see testscripts/setup_prerequisites.sh.
      # ONE KEY FOR BOTH ROLES -- DECIDED 2026-09-01, NOT AN OVERSIGHT.
      #
      # The chain distinguishes the transaction key from the credential key, and they COULD be
      # separate keys under separate custody, so that compromising the one that signs
      # transactions does not also yield the one that bears credentials.  That was considered
      # and declined: it doubles the public values to collect from the operator and the
      # ceremony to check them, for a split neither the devnet nor any test exercises.
      #
      # It is genesis-fixed.  Revisiting it means a new genesis, not a governance proposal.
      publicKeyList:
        - pubKID: qfi-pioneer1PubKID
          pubK: qfi-pioneer1PubK_pubk
          pubKType: transaction
        - pubKID: qfi-pioneer1PubKID
          pubK: qfi-pioneer1PubK_pubk
          pubKType: credential
      intervalPublicKeyIDList:
        - pubKID: qfi-pioneer1PubKID
          nodeType: pioneer
          nodeID: qfi-pioneer1
        # THE INCENTIVE POOL -- the account the chain debits for create_wallet incentives
        # (500 + 500 per wallet, 50 per ephemeral wallet; ~100M QDN per 100k users).
        #
        # It points at the ADOPTION PROGRAMS bucket, whose stated purpose in allocations.csv is
        # exactly this: "Merchant incentives, DID onboarding, loyalty, gas subsidies".  That
        # resolves what looked like a conflict with the brief's "zero external addresses at
        # genesis" rule -- no eleventh account is needed, and the onboarding budget comes from the
        # bucket that was always meant to fund it rather than from an allocation nobody sized.
        #
        # The pool NEVER SIGNS: x/qadena debits it with SendCoinsFromAccountToModule from the
        # keeper (helpers.go lockAccountAmount), so a native multisig works here.  UNTESTED --
        # verify a multisig actually serves as this identity before genesis.
        #
        # nodeID/nodeType are STATE KEY bytes and the lookup constants are hardcoded
        # (types.IncentivePoolNodeID / NodeType).  They must match exactly or every wallet
        # creation PANICS.
        - pubKID: TODO_ADDR_WALLET_INCENTIVE_POOL
          nodeType: wallet-incentive-pool
          nodeID: wallet-incentive-pool

    # -----------------------------------------------------------------------------------------
    # PRICEFEED
    # -----------------------------------------------------------------------------------------
    pricefeed:
      params:
        # THREE MARKETS, DELIBERATELY -- decided 2026-09-01.  config/config.yml carries six:
        # these three plus fn:aud:usd, cn:btc:usd and cn:eth:usd.  All three extras are excluded
        # here.  They are reference prices the token design does not use: nothing on this chain
        # prices in AUD, BTC or ETH, and a seeded price with no oracle behind it is a number the
        # chain will assert until someone replaces it.
        #
        # Adding one later is a governance proposal -- but read the REMINDER below first, because
        # that proposal must carry ALL markets, not just the new one.
        #
        # No oracles at genesis; registration is a MsgUpdateParams governance proposal.
        # REMINDER: MsgUpdateParams replaces the whole params object and Params.Validate() is a
        # no-op, so any proposal must carry ALL markets or it silently deletes the missing ones.
        markets:
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:php"
            quoteAsset: "php"
            oracles: []
          - active: true
            baseAsset: "php"
            marketId: "fn:php:usd"
            quoteAsset: "usd"
            oracles: []

      # BOOTSTRAP PRICES ONLY.
      # The test chain seeds these with a 2030 expiry, which is fine there and wrong here: stale
      # seeds never age out and would blend with real oracle postings for years, because the current
      # price is the median of all unexpired raw prices for the market.
      #
      # Give them days, not years -- long enough to bootstrap, short enough that real prices take
      # over cleanly.  And do not launch fiat-denominated fees without something actually posting.
      # From config/config.yml by decision, 2026-09-01.  cn:qdn:php is DERIVED, not
      # independent: qdn:php = qdn:usd / php:usd = 0.01 / 0.016297 = 0.613610.  Keep the
      # three in step -- cn:qdn:php is the one that matters in practice, because it is what
      # the credential fee ("30php") is converted through.
      #
      # THE 0.01 QDN:USD IS A PLACEHOLDER PRICE, not an observation: qdn is not traded yet.
      # Every fiat-denominated fee and AML threshold on this chain is priced through it, so
      # replace it the moment a real source exists -- and note the expiry below is 2030, far
      # longer than the "days, not years" this section otherwise recommends.
      postedPriceList:
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:qdn:usd"
          price: "0.01"
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:qdn:php"
          price: "0.613610"
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "fn:php:usd"
          price: "0.016297"
