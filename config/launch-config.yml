# Qadena mainnet launch parameters -- TEMPLATE, NOT RUNNABLE.
#
# This is a parameter recommendation to feed genesis construction.  It is deliberately NOT a working
# ignite config: every value that only you can decide is a TODO_ placeholder that will fail loudly
# rather than quietly launching something wrong.
#
# HOW A MAINNET GENESIS IS ACTUALLY BUILT
#
#   Not with `ignite chain init`.  That trusts one machine's keyring for the validator key, which is
#   fine for a test chain and wrong for mainnet.  The normal flow is:
#     1. publish a genesis.json containing accounts, balances and params (this file's contents)
#     2. each validator runs `gentx` with their own key and submits it
#     3. the gentxs are collected (`collect-gentxs`) into the final genesis
#     4. everyone verifies the same genesis hash before starting
#   config/config.yml stays as it is -- the test chain -- and does not inherit from this.
#
# BLOCK TIME: TARGET 3s
#
#   The single-validator test chain runs at exactly timeout_commit (1.5s) because there is no
#   consensus round-trip -- that number is the floor, not a prediction.  A real validator set is
#   dominated by propagation latency: Cosmos Hub sets timeout_commit 5s and observes ~6.5s blocks.
#
#   3s is the stated target here, which is achievable but on the fast side for a globally
#   distributed set.  It suits timeout_commit ~2s.  VERIFY ON A MULTI-VALIDATOR TESTNET before
#   freezing these, then recompute:
#       blocks_per_year = 31,536,000 / observed_block_time
#   Getting it wrong does not break anything, it makes real inflation drift from target: if blocks
#   are faster than blocks_per_year assumes, you mint more than intended.
#
#   At 3s:  1 day = 28,800 blocks   1 year = 10,512,000 blocks
#
# REFERENCE POINTS USED BELOW (researched, not recalled)
#
#   param                       Cosmos Hub        Osmosis           this file
#   unbonding_time              21 days           14 days           21 days
#   max_validators              100               -                 100
#   signed_blocks_window        10000 (~18h)      -                 20000 (~16.7h at 3s)
#   min_signed_per_window       5%                -                 5%
#   slash_fraction_double_sign  5%                5% + perm jail    5%
#   slash_fraction_downtime     0.01%             0 (jail only)     0.01%  -- see note
#   voting_period               14 days           -                 72h at launch -- see note
#   expedited_voting_period     1 day             -                 6h at launch -- see note
#   min_deposit                 250 ATOM          6000 OSMO         see note
#   inflation_max / min         20% / 7%          -                 1% fixed -- see note
#   goal_bonded                 67%               -                 67%
#   community_tax               2%                -                 2%

version: 1

# CHAIN ID.  The numeric part is the EIP-155 chain ID and must be REGISTERED in
# ethereum-lists/chains before anything EVM-facing exists.
#
# This is not cosmetic.  EIP-155 replay protection IS the chain ID, and eth_secp256k1 derives the
# same 0x address on every EVM chain -- so two chains sharing an ID means any address that exists
# on both has its signed transactions replayable in BOTH directions.  A collision is a live
# vulnerability, not a naming inconvenience.
#
# 4444 was the old test value and CANNOT be used: it is registered to Htmlcoin Mainnet (shortName
# "html"), an active chain with a live RPC and block explorer.
#
# Checked against ethereum-lists/chains on 2026-08-27, digits 4/2/8:
#   TAKEN  428 (Geso Verse) · 248 (Oasys Mainnet) · 824 (Daily Network) · 842 (Taraxa Testnet)
#          8428 (THAT Mainnet) · 4444 (Htmlcoin Mainnet)
#   FREE   482 · 284 · 4228 · 4288 · 4824 · 4828 · 2848
#
# Assigned as a stem-plus-digit family, so a misconfigured node is obvious at a glance:
#   mainnet  qadena_482-1     <- this file
#   testnet  qadena_4824-1    stem + 4
#   devnet   qadena_4828-1    stem + 8   (config/config.yml)
#
# The -1 suffix is the EPOCH: bump it (-2, -3, ...) whenever a network is restarted from a NEW
# genesis.  Mainnet stays at -1 unless the chain is re-genesised.
#
# RE-CHECK ALL THREE against the registry immediately before launch -- a pending PR could claim
# one between now and then -- and reserve them by PR so a later collision cannot force a rename.
chain_id: "qadena_482-1"

# ---------------------------------------------------------------------------------------------
# ACCOUNTS AND TOKEN ALLOCATION
# ---------------------------------------------------------------------------------------------
#
# NO MNEMONICS.  Production keys must never live in a repo file; supply addresses generated in
# whatever custody you are using (hardware, multisig, MPC).  Everything here is TODO_ADDR_.
#
# The allocation below is NOT a starting structure to be edited here.  It is transcribed from
# tokenomics/allocations.csv, which is human-owned; qadena-master-brief.md is authoritative for
# every percentage, token count, cliff, vest duration and threshold.  Changing any of them is an
# OUT OF SCOPE decision -- ask the human, do not adjust this file.
#
# VESTING -- READ THIS, IT REVERSES EARLIER GUIDANCE IN THIS FILE.
#
# There are NO VESTING ACCOUNTS AND NO CONTRACTS AT GENESIS.  Not one.  Every bucket lands as a
# plain BaseAccount at a temporary native 2-of-3 multisig, fully liquid, and every lock is applied
# AFTER launch: permanent custody (cw3-flex / cw-vesting) is deployed in week 1 on the live chain
# (brief Phase C), and individual grants are issued later still through a cw3 proposal carrying
# MsgCreatePeriodicVestingAccount (brief Phase D1).
#
# This file previously described writing ContinuousVesting / DelayedVesting / PeriodicVesting /
# PermanentLocked accounts into genesis.json after the fact.  DO NOT DO THAT.  It would put locked
# accounts and unaudited schedules into the artifact everyone has to verify by hash before launch,
# and it is not what the brief specifies.
#
# The reason it is safe to defer: the locks still work when applied later.  Vesting locks hold
# against the EVM (balance reads resolve to SpendableCoin), locked tokens can still be delegated so
# the foundation tranche secures the chain while locked, and a backdated start_time gives everyone
# the same clock regardless of when their grant is actually issued.  See evm-vesting-handoff.md.
accounts:
  # --- CHAIN BOOTSTRAP IDENTITIES ---
  #
  # !! UNRESOLVED CONFLICT -- DO NOT DELETE THESE TWO WITHOUT READING THIS !!
  #
  # qadena-master-brief.md says "Zero external addresses at genesis except genesis validator
  # operators", and specifies exactly 11 genesis accounts: 10 buckets + 1 validator.  Taken
  # literally that deletes pioneer1 and treasury.  THEY CANNOT BE DELETED: the x/qadena genesis
  # stanza further down this file is NAME-BOUND to both --
  #     publicKeyList          needs pioneer1PubKID / pioneer1PubK_pubk (transaction AND credential)
  #     intervalPublicKeyIDList needs both a `pioneer` and a `treasury` nodeType entry
  #     bankSendWhitelistList   grants the AML scan exemption to treasuryPubKID
  # and buildscripts/setPubKAndPubKID.sh resolves "<name>PubKID" from the keyring for a NAMED
  # account, so the account has to exist at genesis for the substitution to produce anything.
  #
  # Resolving this means either (a) accepting two bootstrap identities the brief excludes, or
  # (b) changing what x/qadena requires at genesis.  Both are OUT OF SCOPE per the brief
  # ("genesis validator count/operators").  ASK THE HUMAN.  This blocks Phase B, not Phase A.
  #
  # Until then both are left in place, and their amounts are NOT drawn from any bucket -- which
  # is itself part of the conflict, since the bucket percentages already sum to 100.
  - name: pioneer1
    address: "TODO_ADDR_PIONEER1"
    coins: ["1000000qdn"]
  - name: treasury
    address: "TODO_ADDR_TREASURY"
    coins: ["TODO_AMOUNT_TREASURYqdn"]
  # --- THE TEN ALLOCATION BUCKETS ---
  #
  # Transcribed from tokenomics/allocations.csv, which is HUMAN-OWNED and authoritative.
  # Names, percentages and amounts are COPIED, never recomputed here.  If a number below
  # disagrees with the CSV, the CSV wins and this file is stale.
  #
  # Every bucket is held at genesis by a TEMPORARY native 2-of-3 multisig of the operator's own
  # keys.  Permanent custody (cw3-flex / cw-vesting) is deployed in week 1 on the LIVE chain --
  # see Phase C of the brief -- after which these msigs are empty scaffolding and are retired.
  #
  # bucket_id 08 and 11 are intentionally absent.  Ten buckets, not twelve.

  # Adoption Programs -- 24%, 960,000,000 QDN.  custody: cw3-flex 3of5
  # Merchant incentives, DID onboarding, loyalty, gas subsidies. Capped annual tranches.
  - name: adoption
    address: "TODO_ADDR_ADOPTION"
    coins: ["960000000qdn"]

  # Long-Term Reserve -- 15%, 600,000,000 QDN.  custody: cw-vesting + cw3-flex 4of5
  # 10yr linear unlock ENFORCED by cw-vesting; cw3 controls each unlocked tranche. Governance-
  # only.
  - name: ltr
    address: "TODO_ADDR_LTR"
    coins: ["600000000qdn"]

  # Foundation Treasury -- 14%, 560,000,000 QDN.  custody: cw-vesting + cw3-flex 3of5
  # 10% liquid for ops. Locked 504M is DELEGATED to consortium validators (locked stake works).
  - name: foundation
    address: "TODO_ADDR_FOUNDATION"
    coins: ["560000000qdn"]

  # Builder & Partner Grants -- 11%, 440,000,000 QDN.  custody: cw3-flex 3of5
  # Integrators, POS, dev milestones. Vesting grant on delivery, start_time=grant date.
  - name: grants
    address: "TODO_ADDR_GRANTS"
    coins: ["440000000qdn"]

  # Personnel -- 8%, 320,000,000 QDN.  custody: cw3-flex 3of5
  # Team 6% (12mo cliff@25, 36mo) + Advisors 2% (6mo cliff@12.5, 18mo). Split charter-bound.
  - name: personnel
    address: "TODO_ADDR_PERSONNEL"
    coins: ["320000000qdn"]

  # Early Backers Escrow -- 7%, 280,000,000 QDN.  custody: cw3-flex 3of5
  # Grants as addresses arrive: 12mo cliff@20, 36mo linear, start_time=TGE (backdated).
  - name: backers
    address: "TODO_ADDR_BACKERS"
    coins: ["280000000qdn"]

  # Founders Escrow -- 5%, 200,000,000 QDN.  custody: cw3-flex 3of5
  # 2 founders x 100M. Grant on address supply: 18mo cliff@12.5, 42mo, start_time=TGE.
  # eth_secp256k1, never-used, personal 2of3 multisig advised.
  - name: founders
    address: "TODO_ADDR_FOUNDERS"
    coins: ["200000000qdn"]

  # Contingency Reserve -- 6%, 240,000,000 QDN.  custody: cw3-flex 2of5
  # Security incident + regulatory response. LOW threshold for speed. Two named triggers in
  # charter.
  - name: contingency
    address: "TODO_ADDR_CONTINGENCY"
    coins: ["240000000qdn"]

  # Public Sector Programs -- 8%, 320,000,000 QDN.  custody: cw3-flex 5of7
  # Sub-allocations: SEC PH VERITAS 60M; future MOUs; OTC swap reserve. Entities only, never
  # individuals. Funds feegrant sponsor account.
  - name: pubsec
    address: "TODO_ADDR_PUBSEC"
    coins: ["320000000qdn"]

  # Node Operations -- 2%, 80,000,000 QDN.  custody: cw3-flex 3of5
  # Post-launch onboarding: 1000 self-bond + 100 gas per node, then foundation delegates.
  # Commission is operator compensation.
  # SPLIT ROW: this bucket is the reserve below PLUS the genesis validator account,
  # which together sum to the full 80,000,000 QDN.
  - name: nodeops
    address: "TODO_ADDR_NODEOPS"
    coins: ["79998900qdn"]

  # --- GENESIS VALIDATOR OPERATOR ---
  # The ONLY externally-held address at genesis.  1,100 QDN = 1,000 gentx self-bond + 100 gas.
  # Operator-supplied address; part of the Node Operations bucket, not additional to it.
  # The validator set grows one node at a time POST-launch via Phase D2 -- one gentx here.
  - name: genval1
    address: "TODO_ADDR_GENVAL_1"
    coins: ["1100qdn"]

genesis:
  # Must match the top-level chain_id above.  See the registry note there.
  chain_id: "qadena_482-1"

  app_state:

    # -----------------------------------------------------------------------------------------
    # STAKING
    # -----------------------------------------------------------------------------------------
    staking:
      params:
        bond_denom: "aqdn"
        # 21 days is the Cosmos default and the usual choice.  It is the window during which a
        # validator's stake is still slashable after they unbond, so it is the main defence against
        # long-range attacks -- shortening it to please delegators weakens exactly that.
        unbonding_time: "1814400s"
        # 100 is a common launch size.  Raising it later is easy, lowering it forcibly unbonds the
        # tail, so start at or below where you intend to end up.
        max_validators: 100
        max_entries: 7
        historical_entries: 10000
        # CONTESTED -- decide deliberately.  The SDK default is 0.  A floor prevents a race to 0%
        # commission, which pushes validators to fund themselves by other means and tends to
        # centralise the set.  But it is not settled practice: the Cosmos Hub REJECTED a 5% floor in
        # proposal 76 before revisiting it later.  5% is the usual figure where chains do set one.
        min_commission_rate: "0.05"

    # -----------------------------------------------------------------------------------------
    # SLASHING -- entirely absent from config/config.yml today
    # -----------------------------------------------------------------------------------------
    slashing:
      params:
        # ~16.7 hours at 3s.  Cosmos Hub uses 10000 blocks which at its ~6.5s is ~18h, so this is
        # the same real-world window expressed in faster blocks.  RECOMPUTE if block time moves --
        # this is a duration written in blocks, so a wrong block-time assumption shifts it directly.
        signed_blocks_window: "20000"
        # must sign 5% of the window to avoid jail -- Hub's value, tolerant of ordinary blips
        min_signed_per_window: "0.05"
        downtime_jail_duration: "600s"
        # 5% -- both Cosmos Hub and Osmosis.  Equivocation is never accidental, so this is the one
        # fault with a serious penalty.  Osmosis additionally jails permanently.
        slash_fraction_double_sign: "0.05"
        # DECIDE DELIBERATELY.  0.01% is the Hub's value.  Osmosis slashes NOTHING for downtime and
        # relies on jailing alone, reasoning that downtime is an operator mistake and slashing it
        # punishes delegators who cannot control it.  Since jail already costs the validator all
        # rewards, the slash adds little deterrence.  Set 0 here if you find that argument
        # persuasive -- for an identity chain where operators may be regulated institutions rather
        # than professional validators, it is worth weighing.
        slash_fraction_downtime: "0.0001"

    # -----------------------------------------------------------------------------------------
    # MINT
    # -----------------------------------------------------------------------------------------
    mint:
      params:
        mint_denom: "aqdn"
        # 31,536,000 / 3s.  RECOMPUTE -- see the block time note at the top.
        #
        # This is the MAINNET target (3s blocks), and is NOT the same number as the one the brief
        # asks for.  qadena-master-brief.md Phase B says to compute blocks_per_year from the
        # MEASURED devnet block time -- that is an input to the devnet genesis build, where the
        # single-validator chain runs at timeout_commit with no consensus round-trip.  Keep the two
        # separate: a devnet measurement must never be pasted in here.
        blocks_per_year: "10512000"
        # 1.00% FIXED.  inflation_min == inflation_max, so there is no band and no steering -- the
        # rate is a constant.  This supersedes the earlier 10%/3% band; see tokenomics/
        # qadena-master-brief.md, which is authoritative for every token decision.
        #
        # WHY SO LOW.  Provisions = rate x TOTAL supply, but they are paid out to BONDED stake
        # only.  At launch bonded stake is ~504M of 4,000,000,000 -- the foundation's locked
        # tranche delegated to consortium validators -- so the yield concentrates hard:
        #     1% x 4.0B = 40M/yr paid to ~504M bonded  ->  ~7.9% staker APR
        # A Cosmos-Hub-style 10% ceiling against that same tiny bonded set would pay roughly 79%,
        # which is absurd yield for a permissioned consortium and dilutes every holder to fund it.
        # The old band was written before the bonded set was known to be this small.
        #
        # Uncapped: inflation stays ON.  Never describe QDN as having a total, max or capped
        # supply -- 4,000,000,000 is the INITIAL supply.
        inflation_max: "0.010000000000000000"
        inflation_min: "0.010000000000000000"
        # No rate change: with min == max there is nothing to change between.
        inflation_rate_change: "0"
        #
        # goal_bonded AND inflation_rate_change ARE NOW INERT.  They are kept, not deleted, so a
        # future reader sees they were considered rather than forgotten -- x/mint only consults
        # them when inflation is allowed to move between a min and a max, and here it is not.
        # If the 1% constant is ever replaced by a real band, these two wake up again: do not
        # "restore" the band without deciding these deliberately at the same time.
        goal_bonded: "0.67"

    # -----------------------------------------------------------------------------------------
    # GOVERNANCE -- config/config.yml values are test-only (300s voting)
    # -----------------------------------------------------------------------------------------
    gov:
      params:
        # TODO_MIN_DEPOSIT: set this by TARGET FIAT VALUE, not token count.  The real chains anchor
        # around USD 1-2k of deposit: Cosmos Hub 250 ATOM, Osmosis 6000 OSMO.  qdn has no market
        # price yet, so pick the token amount that lands in that band at your expected launch price
        # and revisit by governance once a price exists.  10,000 qdn below is a placeholder shape.
        min_deposit:
          - denom: "aqdn"
            amount: "10000000000000000000000"
        # LAUNCH-WINDOW TIMINGS.  The three periods below are deliberately SHORTER than the
        # steady-state values, and they are TEMPORARY.  Read the sunset clause before copying them
        # anywhere.  Steady-state values to restore: max_deposit 172800s, voting 604800s,
        # expedited 86400s.
        #
        # WHY SHORT IS SAFE *NOW* AND NOT LATER.  At launch, bonded stake is ~504M and nearly all
        # of it is the foundation's locked tranche delegated to consortium validators -- so 66.7%
        # of bonded stake IS the foundation.  The expedited period is therefore not a defence
        # against outsiders; it is a SELF-IMPOSED REVIEW WINDOW, time for a non-colluding party to
        # notice and object before something irreversible executes.  The stock warning about
        # "giving distributed delegators less time to notice" does not bite yet because there are
        # no distributed delegators yet.  That changes, and when it does these values must go back.
        #
        # 24h.  Clears junk proposals out of the queue faster.  Low risk while the foundation
        # self-funds every deposit.
        max_deposit_period: "86400s"
        #
        # 72h, down from 7 days.  Survives a weekend -- a proposal filed Friday evening still ends
        # Monday evening -- while being 2.3x more responsive than the steady-state value.
        #
        # Do NOT compress this towards the expedited period.  A failed expedited proposal is
        # converted to a regular one rather than rejected (see below), and the SDK sets the new end
        # time from the ORIGINAL voting start -- x/gov/abci.go:
        #     endTime := proposal.VotingStartTime.Add(*params.VotingPeriod)
        # so the fallback window is (voting_period - expedited_voting_period), not a fresh period.
        # At 72h/6h that leaves 66h of fallback.  Set voting_period to 8h with expedited at 6h and
        # the fallback track silently collapses to 2h.  Keep the ratio wide.
        voting_period: "259200s"
        # expedited is for emergencies (a security patch), so it costs 5x
        expedited_min_deposit:
          - denom: "aqdn"
            amount: "50000000000000000000000"
        # 6h, down from 24h.  Long enough that a non-colluding council member in SOME timezone is
        # awake and could object; short enough to actually be an emergency lever.
        #
        # THIS NUMBER HAS A PRECONDITION: it assumes the council spans timezones (PH/AU/US).  If
        # the council ends up concentrated in ONE timezone, raise this to 12h ("43200s").  A window
        # that fits entirely inside one region's night is the wrong design when the thing that can
        # pass is enclave key custody -- see the charter rule below.
        #
        # Hard SDK constraint: must be STRICTLY LESS than voting_period, or ValidateBasic rejects
        # the params (x/gov/types/v1/params.go).
        expedited_voting_period: "21600s"
        # UNCHANGED at 0.667, and it must stay above `threshold` (another hard SDK constraint).
        # With the expedited period cut 4x, this is the only thing left separating the two tiers.
        # Note also that a FAILED expedited proposal does not burn its deposit -- it just converts
        # to a regular proposal -- so expedited is cheap to attempt.  Keep the bar high.
        expedited_threshold: "0.667"
        #
        # CHARTER RULE -- the params cannot express this, so the consortium agreement must.
        # gov v1 has exactly two tiers and no per-message-type periods (see the note further down),
        # while a passed proposal is what makes an enclave measurement `active` -- after which every
        # node hands its sealed jar and regulator keys to that MRENCLAVE.  So the expedited track is
        # RESERVED for params, upgrades and incident response, and MUST NOT be used for
        # MsgUpdateEnclaveIdentity.  Enclave registration is a routine operation and belongs on the
        # regular track; at 72h that is no longer painful.  This is the operational stand-in for a
        # per-handler bar (backlog 95) until one exists.
        #
        # SUNSET -- these values expire.  Restore the steady-state timings when EITHER:
        #   (a) stake NOT delegated by the foundation exceeds 25% of bonded stake, or
        #   (b) TGE + 90 days,
        # whichever comes first.  The risk being managed here is not the low numbers; it is the low
        # numbers still being in place when real delegators arrive and can no longer be assumed to
        # be watching the council chat.  Write the restoring MsgUpdateParams proposal at launch and
        # commit it to the repo, so restoration is one command rather than a drafting exercise
        # nobody gets around to.  Because these are gov params, the restoring proposal runs UNDER
        # the lowered timings -- there is no chicken-and-egg.
        # TALLY PARAMS, AND WHY THESE NUMBERS.
        #
        # Read what quorum actually permits, not how many validators it implies: at minimum turnout
        # a proposal passes with just over half of it, so quorum 0.334 lets ~17% of bonded stake
        # decide.  0.40 raises that to ~20% and is Cosmos Hub's value -- well exercised, and short of
        # the level where legitimate proposals start expiring for delegator apathy, which is the
        # common failure mode on live chains.  Do not read this as "N of M validators": once real
        # delegators exist, turnout is a fraction of STAKE and most of it is not the validators'.
        #
        # THIS NOW DECIDES MORE THAN MONEY.  Since 2026-08-21, a passed proposal is what makes an
        # enclave measurement `active`, and an active measurement is one every node will hand its
        # sealed jar and regulator keys to once someone runs code with that MRENCLAVE
        # (vouchesForIdentity, backlog 92).  Governance is the trust anchor for the enclave now, so
        # these numbers gate key custody, not just spending.
        quorum: "0.40"
        threshold: "0.5"
        # VETO STAYS AT THE STANDARD 0.334, deliberately.  It is the ANTI-SPAM mechanism, not the
        # way to block a proposal you disagree with -- a simple majority of No already fails one at
        # `threshold`, with no deposit burned.  Lowering veto so a single operator could block an
        # enclave registration would also make it cheap to burn a colleague's deposit on a
        # legitimate one, and registering a measurement is a ROUTINE operation, not a rare event.
        veto_threshold: "0.334"
        #
        # WHAT THESE PARAMS CANNOT EXPRESS, and do not pretend to: a higher bar for
        # MsgUpdateEnclaveIdentity than for a text proposal.  gov v1 has exactly two tiers, regular
        # and expedited, with no per-message-type thresholds.  If enclave registration should need
        # more than an ordinary proposal, that belongs in the msg handler -- see backlog 95 -- not in
        # a chain-wide param distorted to approximate it.
        # burn the deposit of a vetoed proposal -- makes spamming governance expensive
        burn_vote_veto: true
        # a proposal must arrive with 25% of the deposit, so the mempool is not free to fill
        min_initial_deposit_ratio: "0.25"

    # -----------------------------------------------------------------------------------------
    # DISTRIBUTION -- absent from config/config.yml today
    # -----------------------------------------------------------------------------------------
    distribution:
      params:
        # 2% of staking rewards to the community pool, spendable by governance
        community_tax: "0.02"
        withdraw_addr_enabled: true

    # -----------------------------------------------------------------------------------------
    # CRISIS
    # -----------------------------------------------------------------------------------------
    # crisis: DELIBERATELY ABSENT -- decide this BEFORE launch, not after.
    #
    # x/crisis is deprecated as of cosmos-sdk v0.53, which is the version this chain runs
    # (go.mod: v0.53.5).  It moves to contrib/ in v0.54, so the next SDK upgrade forces a choice
    # between a contrib import and removal.  There is also an advisory that it does not actually
    # charge ConstantFee (GHSA-w5w5-2882-47pc), so tuning the fee buys nothing.
    #
    # The asymmetry that matters: dropping it from app wiring before genesis costs nothing.
    # Dropping it from a LIVE chain is a coordinated upgrade with a migration handler, because the
    # module's genesis state and store keys already exist.  Launching with a module you have already
    # decided to remove means signing up for that migration.
    #
    # It is still wired in app/app.go and app/app_config.go today, so removing it is a code change,
    # not a config change.  config/config.yml keeps a crisis section only because the module is
    # still registered there.

    protocolpool:
      params:
        enabled_distribution_denoms:
          - "aqdn"

    bank:
      denom_metadata:
        - description: "Qadena Token"
          denom_units:
            - denom: "aqdn"
              exponent: 0
              aliases: []
            - denom: "qdn"
              exponent: 18
              aliases: []
          base: "aqdn"
          display: "qdn"
          name: "Qadena Token"
          symbol: "qdn"

    # -----------------------------------------------------------------------------------------
    # QADENA
    # -----------------------------------------------------------------------------------------
    qadena:
      params:
        # ONBOARDING INCENTIVES, paid by create-wallet-sponsor -- an operating cost, not an
        # allocation.  At 500 + 500 per wallet plus 50 per eph wallet, onboarding 100k users is
        # ~100M qdn out of a live hot account.  Size the sponsor balance against your growth plan
        # and decide whether these should start lower on mainnet than on the test chain.
        create_wallet_incentive:
          amount: "500"
          denom: "qdn"
        create_wallet_transparent_incentive:
          amount: "500"
          denom: "qdn"
        create_ephemeral_wallet_incentive:
          amount: "0"
          denom: "qdn"
        create_ephemeral_wallet_transparent_incentive:
          amount: "50"
          denom: "qdn"

        # Fiat-denominated, so these REQUIRE a working pricefeed: create/update credential converts
        # through cn:qdn:php.  Do not launch with fiat fees until prices are actually being posted.
        create_credential_fee: "30php"
        create_bulk_credentials_fee: "10php"

        ekyc_submit_new_app_royalty_percentage: "40"
        ekyc_submit_reuse_app_royalty_percentage: "20"
        ekyc_submit_reuse_provider_royalty_percentage: "20"
        ekyc_identity_owner_royalty_percentage: "30"

        # CREDENTIAL UPDATE POLICY
        update_credential_fee: "30php"
        update_credential_policy_version: 1
        update_credential_max_identity_aliases: 4
        update_credential_max_life_events: 2
        update_name_max_edit_distance: 2
        update_name_max_edit_distance_percent: 34
        update_birthdate_max_year_delta: 1
        # ~1 day at 3s blocks.  RECOMPUTE with your measured block time.  The test config says
        # "~1 day at 8s blocks" for 10000 blocks, which has never matched its own chain -- at the
        # test chain's 1.5s that value is about 4 hours, not a day.
        update_credential_min_blocks_between_updates: "28800"
        update_credential_allow_last_name_life_event: true
        update_credential_allow_gender_change: true

        # AML scan.  These are LEGAL figures, so they must be confirmed against each regulator the
        # chain reports to rather than carried over from here.  The threshold that applies to a
        # transfer is the LOWEST among the sender's residency and citizenship, so listing a country
        # can only tighten a sender's limit, never loosen it.
        #
        # Every currency named below needs a cn:qdn:<denom> market with a live price, or transfers
        # fail closed: the keeper refuses to scan a transfer it cannot measure. Adding a
        # jurisdiction here means adding its market and an oracle posting to it.
        suspicious_transaction_threshold: "TODO_SUSPICIOUS_THRESHOLD"   # e.g. "10000usd"
        suspicious_transaction_threshold_overrides:
          # e.g. PH files at PHP 500,000 rather than a converted USD figure
          - country: "TODO_JURISDICTION_ALPHA2"
            threshold: "TODO_JURISDICTION_THRESHOLD"
        # 30 days.  Shortening this narrows what counts as structuring; lengthening it grows the
        # stored history per wallet.
        suspicious_transaction_window_seconds: 2592000
        # Leave false unless the chain deliberately permits un-KYC'd wallets to send.  False is the
        # enforcing state, and is also what an un-upgraded chain reports, so it fails safe.
        allow_transfer_without_ekyc: false
        # Institutional guardians stating the identity they verified on a social-recovery
        # signature: 0 = off, 1 = audit (compare and log, still accept), 2 = enforce.
        #
        # SHIPS AT 0, and this deliberately DIFFERS from config/config.yml, which runs the devnet
        # at 1 (audit) so the invariant gets measured somewhere before it is enforced anywhere.
        #
        # Raising this to 2 before a devnet at 1 has shown real traffic matching would fail every
        # institutional signature closed -- the gate rests on a guardian's hash equalling the one
        # issuance produced, which is unproven until those logs are clean.  Individual guardians
        # are exempt in every mode.  Raised by governance, not by a deploy.
        sign_recover_key_guardian_assertion_mode: 0

      # Accounts allowed to move coins with a direct bank send WITHOUT being AML-scanned.  Every
      # other account-to-account transfer, by any module, goes through the same enclave scan as
      # transfer-funds: eKYC gate, per-jurisdiction threshold, rolling window.
      #
      # EVERY ENTRY HERE IS AN AML EXEMPTION.  Keep the list to accounts that genuinely cannot be
      # scanned -- ones that are not user wallets and hold no credential to draw a jurisdiction
      # from.  In practice that means the bootstrap treasury and nothing else at genesis.
      #
      # Per-deployment treasuries are deliberately NOT listed: they are created at runtime and add
      # themselves by governance when that deployment is onboarded, so a deployment that never
      # launches never gets an exemption.  The `reason` is stored on chain and is what a later
      # reviewer has to judge the entry by, so write it for them.
      # treasuryPubKID is substituted with the treasury's derived address by
      # buildscripts/setPubKAndPubKID.sh during init, so it needs no TODO -- but review whether this
      # account should be exempt at all before launch, and delete the entry if it should not.
      bankSendWhitelistList:
        - address: treasuryPubKID
          reason: "TODO: state why this account cannot be AML-scanned"

      # THE MOST SECURITY-CRITICAL ENTRY IN THIS FILE.
      # These are the SGX measurements the chain will trust.  The test chain ships
      # test-unique-id/test-signer-id/test-product-id, which WORK -- so this is the item most likely
      # to be shipped unchanged by accident.  Placeholders here are deliberately invalid.
      enclaveIdentityList:
        - uniqueID: "TODO_ENCLAVE_UNIQUE_ID"
          signerID: "TODO_ENCLAVE_SIGNER_ID"
          productID: "TODO_ENCLAVE_PRODUCT_ID"
          status: active

      # pioneer1 and treasury only.  Every service provider is onboarded at runtime by a
      # MsgAddServiceProvider governance proposal -- see testscripts/setup_prerequisites.sh.
      publicKeyList:
        - pubKID: pioneer1PubKID
          pubK: pioneer1PubK_pubk
          pubKType: transaction
        - pubKID: pioneer1PubKID
          pubK: pioneer1PubK_pubk
          pubKType: credential
      intervalPublicKeyIDList:
        - pubKID: pioneer1PubKID
          nodeType: pioneer
          nodeID: pioneer1
        - pubKID: treasuryPubKID
          nodeType: treasury
          nodeID: treasury

    # -----------------------------------------------------------------------------------------
    # PRICEFEED
    # -----------------------------------------------------------------------------------------
    pricefeed:
      params:
        # No oracles at genesis; registration is a MsgUpdateParams governance proposal.
        # REMINDER: MsgUpdateParams replaces the whole params object and Params.Validate() is a
        # no-op, so any proposal must carry ALL markets or it silently deletes the missing ones.
        markets:
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:php"
            quoteAsset: "php"
            oracles: []
          - active: true
            baseAsset: "php"
            marketId: "fn:php:usd"
            quoteAsset: "usd"
            oracles: []

      # BOOTSTRAP PRICES ONLY.
      # The test chain seeds these with a 2030 expiry, which is fine there and wrong here: stale
      # seeds never age out and would blend with real oracle postings for years, because the current
      # price is the median of all unexpired raw prices for the market.
      #
      # Give them days, not years -- long enough to bootstrap, short enough that real prices take
      # over cleanly.  And do not launch fiat-denominated fees without something actually posting.
      postedPriceList:
        - expiry: "TODO_EXPIRY_DAYS_AFTER_LAUNCH"
          marketId: "cn:qdn:php"
          price: "TODO_LAUNCH_PRICE_QDN_PHP"
