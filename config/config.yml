version: 1
validation: sovereign
accounts: 
- name: pioneer1
  coins: ["1000000qdn"]
  mnemonic: "nest gown ability blouse ski tortoise wall female across know accuse guard shy drive grunt assault cricket solar pave arrange actress ring more country"
# create-wallet-sponsor is NOT here either.  A sponsor is purely a client-side signer and fee payer
# (tx_create_wallet.go loads it from the keyring; msg_server_create_wallet.go has no concept of one),
# so it needs no genesis identity -- just a funded account.  testscripts/setup_prerequisites.sh
# creates and funds it from the treasury, the same way veritas_scripts/step_3.sh stands up
# sec-create-wallet-sponsor.
#
# What remains below is only the chain's own bootstrap identity: the validator/pioneer and the
# treasury that funds everything else.  Neither can move to runtime -- block production, funding and
# governance all need them to exist at genesis.
- name: treasury
  coins: ["2000000000qdn"] # 2 billion 
  mnemonic: "eyebrow unaware jealous actor annual farm radio open sword memory other secret twelve reduce festival buddy peace fun film return sniff december february post"
# No oracle accounts.  The seeded postedPriceList below carries no oracleAddress, so genesis needs
# no oracle identity to load prices; registering an address that may post NEW prices is a pricefeed
# MsgUpdateParams governance decision, made once a real price source exists.
#
# NO service provider is a genesis account -- not the coopnet / maya / coinsph / unionbank identity
# providers, and not testfinancesrvprv either.  They are all srv-prv nodes, so they belong in a
# MsgAddServiceProvider governance proposal, and a genesis-declared provider has no
# <name>-credential key (see the note below).
#
# testidentitysrvprv and testdsvssrvprv are deliberately NOT genesis accounts.  They are onboarded
# at runtime by testscripts/setup_prerequisites.sh, which creates their wallets with
# `tx qadena create-wallet` and registers them through a governance proposal.
#
# This is not just tidiness.  create-wallet derives BOTH the transaction key (account index 0) and
# the <name>-credential key (index 1, CredentialWalletType in x/qadena/types/keys.go) from the one
# provider mnemonic and registers both pubKs.  A genesis-declared provider never runs create-wallet,
# so it has no -credential key at all -- which is why sign-recover-key's service-provider branch
# (tx_sign_recover_key.go) fails for genesis providers when they are used as recovery partners.

client:
  openapi:
    path: docs/static/openapi.yml
validators:
- name: pioneer1
  bonded: 100000qdn
  app:
    minimum-gas-prices: "500000000aqdn"
    # THE VALIDATOR SELF-BOND FLOOR, in QDN.  Read by scripts/convert_to_validator.sh, which converts
    # it to aqdn -- MsgCreateValidator takes min_self_delegation as an integer in the BASE unit, so
    # a bare "10000" here would mean 10000aqdn, a floor of 0.00000000000001 QDN.  That unit is a
    # long-standing source of confusion (cosmos-sdk#9386) and the reason this is spelled in QDN and
    # converted in one place.
    #
    # It is a PROMISE, not an entry fee: if self-delegation ever falls below it the validator is
    # permanently unbonded, so it is chosen deliberately rather than set as high as possible.  It
    # lived hardcoded as "1" in convert_to_validator.sh before, which made the floor meaningless.
    min-self-delegation: "10000qdn"
    pruning: "default"
    pruning-keep-recent: "0"
    pruning-interval: "0"
    wasm:
      query_gas_limit: "300000"
      memory_cache_size: "300"
    evm:
      tracer: ""
      max-tx-gas-wanted: "0"
      cache-preimage: false
      min-tip: "0"
      geth-metrics-address: "0.0.0.0:8100"
      mempool:
        price-limit: "1"
        price-bump: "10"
        account-slots: "16"
        global-slots: "5120"
        account-queue: "64"
        global-queue: "1024"
        lifetime: "3h0m0s"
    json-rpc:
      enable: true
      address: "0.0.0.0:8545"
      ws-address: "0.0.0.0:8546"
      ws-origins:
        - "127.0.0.1"
        - "localhost"
      api: "eth,net,web3"
      gas-cap: "25000000"
      allow-insecure-unlock: true
      evm-timeout: "5s"
      txfee-cap: "1"
      filter-cap: "200"
      feehistory-cap: "100"
      logs-cap: "10000"
      block-range-cap: "10000"
      http-timeout: "30s"
      http-idle-timeout: "2m0s"
      allow-unprotected-txs: false
      max-open-connections: "0"
      enable-indexer: true
      metrics-address: "0.0.0.0:6065"
      batch-request-limit: "1000"
      batch-response-max-size: "25000000"
      enable-profiling: false
    state-sync:
      snapshot-interval: "2000"
      snapshot-keep-recent: "3"
  config:
    # QUIET THE FOUR MODULES THAT ARE THE VOLUME, KEEP EVERYTHING THAT DIAGNOSES.
    #
    # Debug logging is 92.2% of a node's log bytes -- measured on a real 13 GB day: p2p 45.9%,
    # server 21.9%, consensus 15.7%, mempool 15.0%.  That is 11-13 GB per node per day, which
    # fills a 60 GB disk in about five days and is what took the ARM fleet down on 2026-08-22
    # (M4 halted at 99%, M1 stalled at 100% with 87 MB free).
    #
    # None of that volume is enclave diagnosis.  The drivers are Read PacketMsg, setHasVote, Send
    # channel, BATCH SAVE, SAVE TREE.  The enclave's own output is untouched by this setting:
    # 167,564 of its 168,177 debug lines carry no module= field at all, because they come from the
    # enclave PROCESS's stdout rather than the SDK logger, so "*:debug" keeps every one of them.
    #
    # 8f8a1729 made a per-module level WORK -- before it, three places compared the whole string
    # against "debug", so asking for "*:debug" produced silence on the one setting whose job is
    # deciding what gets recorded when something goes wrong.  That fix shipped on 2026-08-22 and
    # this line was never changed to use it, so the fleet kept generating 18 GB a node for
    # prune_logs.sh to delete.  Both halves are needed: write less, and reap what is written.
    #
    # `server` is included where 8f8a1729's suggested string omitted it, because its own
    # measurement puts it second at 21.9% -- confirmed again on M1 2026-08-26 (p2p 18.0 MB,
    # server 15.7 MB, consensus 14.1 MB of a 48.3 MB sample).
    log_level: "p2p:info,consensus:info,mempool:info,server:info,*:debug"
    moniker: "pioneer1"
    consensus:
      timeout_propose: "3s"
      create_empty_blocks: true
      create_empty_blocks_interval: "0s"
      timeout_commit: "1.5s"
    p2p:
      addr_book_strict: false
      max_num_inbound_peers: "80"
      max_num_outbound_peers: "60"
    priv_validator_laddr: "tcp://0.0.0.0:26659"
    mempool:
      size: "10000"
      
  client:
    chain-id: "qadena_4828-1"
build:
  main: cmd/qadenad

genesis:
  chain_id: "qadena_4828-1"
  app_state:
    # Params below are kept IDENTICAL to config/launch-config.yml wherever the value does not affect
    # how fast the test suite runs.  A param that only ever appears in the launch config is a param
    # that has never actually been exercised.  The handful that must differ are marked TEST VALUE
    # with the reason.
    staking:
      params:
        bond_denom: "aqdn"
        unbonding_time: "1814400s"
        max_validators: 100
        max_entries: 7
        historical_entries: 10000
        # safe here: ignite generates pioneer1's gentx at 10% commission, above this floor
        min_commission_rate: "0.05"

    slashing:
      params:
        signed_blocks_window: "20000"
        min_signed_per_window: "0.05"
        downtime_jail_duration: "600s"
        slash_fraction_double_sign: "0.05"
        slash_fraction_downtime: "0.0001"

    distribution:
      params:
        community_tax: "0.02"
        withdraw_addr_enabled: true
    "bank": {
      "denom_metadata": [
        {
          "description": "",
          "denom_units": [
            {
              "denom": "aqdn",
              "exponent": 0,
              "aliases": []
            },
            {
              "denom": "qdn",
              "exponent": 18,
              "aliases": []
            }
          ],
          "base": "aqdn",
          "display": "qdn",
          "name": "Qadena Token",
          "symbol": "qdn"
        }
      ]
    }
    mint:
      params:
        mint_denom: "aqdn"
        # TEST VALUE: 31,536,000 / 1.5s, this chain's single-validator block time.  Mainnet targets
        # 3s and therefore 10,512,000 -- see config/launch-config.yml.
        blocks_per_year: "21024000"
        inflation_max: "0.10"
        inflation_min: "0.03"
        inflation_rate_change: "0.13"
        goal_bonded: "0.67"

    gov:
      params:
        # Deposits match launch.  Nothing slows down: setup_prerequisites.sh submits proposals
        # carrying a 100,000qdn deposit, so the threshold is met on submission either way -- but now
        # the deposit path is exercised against a realistic figure instead of 1qdn.
        min_deposit:
          - denom: "aqdn"
            amount: "10000000000000000000000"
        expedited_min_deposit:
          - denom: "aqdn"
            amount: "50000000000000000000000"
        max_deposit_period: "172800s"
        # TEST VALUES: the only two params here that gate wall-clock time.  setup_prerequisites.sh
        # waits out the expedited period three times per run, so 30s is load-bearing for the test
        # suite.  Mainnet is 7 days / 1 day -- see config/launch-config.yml.
        voting_period: "300s"
        expedited_voting_period: "30s"
        # Tally params match launch and are genuinely exercised: setup_prerequisites.sh delegates
        # 10,000,000qdn from the treasury, so the treasury's yes vote carries ~99% of bonded stake --
        # clearing quorum, threshold and the expedited threshold on real numbers rather than by
        # default.  The treasury holds 2B qdn at genesis but UNBONDED, which carries no voting power
        # at all, so without that delegation its vote counts zero and proposals fail quorum.
        #
        # That 10,000,000 is split evenly across the bonded validators, NOT concentrated on
        # pioneer1.  The treasury's governance power is unchanged either way -- a delegator votes
        # with the sum of its delegations -- but concentrating it would also hand one validator
        # >2/3 of CONSENSUS power, letting it finalise blocks over a peer's nil prevote.
        quorum: "0.334"
        threshold: "0.5"
        veto_threshold: "0.334"
        expedited_threshold: "0.667"
        burn_vote_veto: true
        min_initial_deposit_ratio: "0.25"
    wasm:
      codes: []
      contracts: []
      params:
        code_upload_access:
          addresses: []
          permission: "Everybody"
        instantiate_default_permission: "Everybody"
      sequences: []
    evm:
      accounts: []
      params:
        access_control:
          call:
            access_control_list: []
            access_type: ACCESS_TYPE_PERMISSIONLESS
          create:
            access_control_list: []
            access_type: ACCESS_TYPE_PERMISSIONLESS
        active_static_precompiles: []
        evm_channels: []
        evm_denom: aqdn
        extended_denom_options:
          extended_denom: aqdn
        extra_eips: []
        history_serve_window: "8192"
      preinstalls: []
    # no crisis section: x/crisis has been removed from the app entirely (deprecated in
    # cosmos-sdk v0.53, this chain's version; moved to contrib/ in v0.54).  Removed pre-launch,
    # while it was still just a code change rather than a chain upgrade with a migration handler.
    protocolpool:
      params:
        enabled_distribution_denoms:
          - "aqdn"
    qadena:
      params:
        # THESE ARE THE NORMAL VALUES.  They were zeroed on 2026-08-29 for toll-free testing and
        # restored on 2026-08-30, because setup_veritas.sh cannot complete against a zero endowment:
        # step_3 dies with "spendable balance 0aqdn is smaller than 1000000aqdn: insufficient funds"
        # at the first operation the fee grant does not cover.  A chain nobody can set up is not a
        # useful test chain.
        #
        # WHY ZEROING IS STILL WORTH DOING, DELIBERATELY AND TEMPORARILY.  A new wallet arrives with
        # 500 qdn (real) or 50 qdn (ephemeral), and that is a SECOND, INVISIBLE FUNDING SOURCE: an
        # operation its fee grant does not cover still succeeds, silently drawing on the endowment,
        # and only starts failing once the endowment runs out -- on a wallet with no way to ask for a
        # new grant.  Four message types were missing from the app-server's allowlist for exactly
        # that reason and nothing failed anywhere.
        #
        # At zero, an ungranted operation fails immediately at the step that needs it.  So zero is
        # the right setting for auditing fee-grant COVERAGE, and the wrong setting for a chain that
        # also has to run setup_veritas.sh -- which is the conflict that produced this note.  Zero
        # them for a coverage run, restore them here, and never ship zero where users hold tokens.
        # main wallet granted by sponsor upon wallet creation (encrypted)
        create_wallet_incentive:
          amount: "500"
          denom: "qdn"
        # main wallet granted by sponsor upon wallet creation (transparent)
        create_wallet_transparent_incentive:
          amount: "500"
          denom: "qdn"
        # sub wallet granted by sponsor upon sub wallet creation (encrypted)
        create_ephemeral_wallet_incentive:
          amount: "0"
          denom: "qdn"
        # sub wallet granted by sponsor upon sub wallet creation (transparent)
        create_ephemeral_wallet_transparent_incentive:
          amount: "50"
          denom: "qdn"
        create_credential_fee: "30php"
        create_bulk_credentials_fee: "10php"
        ekyc_submit_new_app_royalty_percentage: "40"
        ekyc_submit_reuse_app_royalty_percentage: "20"
        ekyc_submit_reuse_provider_royalty_percentage: "20"
        ekyc_identity_owner_royalty_percentage: "30"
        # MsgUpdateCredential.  The numerics match the compiled-in defaults in
        # x/qadena/common/credential_policy.go; they are repeated here so an operator can see and
        # tune them.  The two allow_ gates must be set explicitly: proto3 cannot distinguish an
        # unset bool from false, so an unset gate reads as closed.
        update_credential_fee: "30php"
        # bump whenever the policy engine's behaviour changes, so a divergence between enclave
        # builds is visible on chain instead of silent
        # 2: the one-identity-field-at-a-time rule became
        # update_credential_max_changed_identity_fields, and the verdict now reports every changed
        # field rather than one.  The default is still a single field, so behaviour is unchanged on
        # a chain that does not set the cap -- the bump records that the ENGINE moved.
        update_credential_policy_version: 2
        # the alias list holds the original identity plus one hash per hash-changing update, so 4
        # aliases is a lifetime budget of 3 such updates
        update_credential_max_identity_aliases: 4
        update_credential_max_life_events: 2
        update_name_max_edit_distance: 2
        # relative cap, in percent of the longer name; 34 means a 1-edit fix needs >= 3 runes
        update_name_max_edit_distance_percent: 34
        update_birthdate_max_year_delta: 1
        # TEST VALUE.  ~4 hours at this chain's 1.5s blocks -- the old "~1 day at 8s blocks" comment
        # never matched this config, which sets timeout_commit 1.5s.  4 hours is fine here: case 9
        # of test_credentials.sh only needs the window to still be open moments after case 1.
        # Mainnet targets 3s blocks and a real day: see update_credential_min_blocks_between_updates
        # in config/launch-config.yml.
        update_credential_min_blocks_between_updates: "10000"
        # marriage/divorce surname replacement
        update_credential_allow_last_name_life_event: true
        update_credential_allow_gender_change: true
        # How many identity fields (first/middle/last name, birthdate, gender) may move in one
        # update.  ONE IS THE SAFE VALUE: two simultaneous changes are hard to tell apart from
        # substituting one person for another, which is why this was a compiled-in constant before
        # it was a param.  Raising it also weakens the surname life-event rule, which is only safe
        # because the remaining fields still pin the identity while the surname is replaced.
        update_credential_max_changed_identity_fields: 1
        # AML scan (ScanTransaction in the enclave).  The reporting limit is a legal figure set by
        # each jurisdiction, not a converted one, so it is expressed in that jurisdiction's own
        # currency; the keeper prices each one through cn:qdn:<denom> before the enclave compares.
        # Every currency named here therefore needs a market -- php and usd both have one.
        suspicious_transaction_threshold: "10000usd"
        suspicious_transaction_threshold_overrides:
          - country: "PH"
            threshold: "500000php"
        # 30 days, the usual structuring-detection window.  Measured on BLOCK time, so this is safe
        # to keep at the real value in tests -- it costs no wall-clock waiting.  Expiry itself is
        # therefore not covered end-to-end; see the unit tests in x/qadena/common.
        suspicious_transaction_window_seconds: 2592000
        # Whether a wallet with no claimed credential may send.  Left false (the enforcing state):
        # the threshold is chosen from the sender's residency and citizenship, so a sender with
        # neither has no limit to be held to.  Set true only for a chain that does not require eKYC.
        allow_transfer_without_ekyc: false
        # Whether an INSTITUTIONAL guardian must state, in its social-recovery signature, the
        # identity it verified -- so the enclave resolves that identity to a wallet itself instead
        # of trusting the wallet id the guardian's server picked.
        #
        #   0 = off, 1 = audit (compare and log, still accept), 2 = enforce (reject a mismatch)
        #
        # AUDIT HERE, OFF AT LAUNCH.  This is the DEVNET genesis, and 1 is deliberately not the
        # same value config/launch-config.yml ships -- the two are meant to differ.
        #
        # The whole scheme rests on one unmeasured invariant: that the hash a guardian computes at
        # signing time equals the one issuance produced and the enclave stores.  If that is wrong,
        # enforcing it fails every institutional signature CLOSED and recovery stops for everyone.
        # Audit resolves and compares and LOGS, while still accepting, so running the devnet here
        # is what actually measures the invariant instead of assuming it.  Grep the enclave log for
        #
        #     guardian-assertion: MISMATCH
        #
        # A clean devnet run at 1 is the evidence needed before anyone proposes 2 anywhere.
        # Mismatches are expected until the app server side ships the assertion (Plan B) -- an
        # absent assertion counts as a mismatch, so before then every institutional signature logs
        # one and is still accepted.  That is the point; it is not a regression.
        #
        # Individual (family/friend) guardians are exempt in every mode.  "Institutional" means any
        # guardian whose name resolves via PioneerNodeType or ServiceProviderNodeType -- pioneer1
        # included, not just the --is-service-provider signers.
        sign_recover_key_guardian_assertion_mode: 1
      # Non-wallet parties allowed to take part in a direct bank send.  They are STILL AML-scanned --
      # nothing on this chain moves account-to-account without being scanned.  Listing an address
      # here says only that it may participate while holding no credential, and that reports naming
      # it carry an address and a reason instead of a person.
      #
      # This replaced a bank-send whitelist that switched scanning OFF for its entries.  That
      # exemption existed only because a report could not name a party without a personal-info
      # credential; now that it can, the exemption has no justification and is gone.
      #
      # Only the bootstrap treasury is seeded, and it has to be: setup_prerequisites.sh funds
      # accounts with a bank send before any governance proposal can run, so an empty list here
      # leaves the chain unable to fund anything -- an unlisted sender with no credential is refused
      # as unscannable.
      #
      # codeID is 0 because the treasury is a plain account, not a wasm contract.  A wasm contract
      # MUST be pinned to its code ID: its admin can migrate it, and an unpinned entry would carry
      # the approval over to code governance never reviewed.  The chain rejects either mismatch.
      #
      # Per-deployment treasuries (ekycph-treasury, enf-treasury, sec-treasury) are NOT here.  They
      # are created at runtime and add themselves by governance during onboarding, which is why the
      # list takes individual add/remove messages rather than living in Params.
      #
      # treasuryPubKID is substituted with the treasury's address by
      # buildscripts/setPubKAndPubKID.sh, which init.sh already runs for this account -- so the
      # entry follows the mnemonic automatically instead of going stale if it changes.
      scannedContractWhitelistList:
        - address: treasuryPubKID
          codeID: 0
          reason: "bootstrap treasury: funds every other account, including the treasuries that fund deployments"
      enclaveIdentityList:
        - uniqueID: test-unique-id
          signerID: test-signer-id
          productID: test-product-id
          status: active
      publicKeyList:
        - pubKID: pioneer1PubKID
          pubK: pioneer1PubK_pubk
          pubKType: transaction
        - pubKID: pioneer1PubKID
          pubK: pioneer1PubK_pubk
          pubKType: credential
        # No service provider pubKs here: create-wallet registers them at onboarding time
        # -- see the note above the client: section
      intervalPublicKeyIDList:
        - pubKID: pioneer1PubKID
          nodeType: pioneer
          nodeID: pioneer1
        # The account create_wallet incentives are paid FROM.  Renamed from "treasury" to the ROLE
        # name: the chain's incentive pool is a different thing from the Foundation Treasury bucket
        # and from a deployment's sec-treasury, and the collision cost real confusion.
        # nodeID/nodeType are STATE KEY bytes -- changing them moves the entry, so this had to land
        # before mainnet genesis.  On the test chain it still points at the `treasury` key.
        - pubKID: treasuryPubKID
          nodeType: incentive-pool
          nodeID: incentive-pool
        # No srv-prv entries: every service provider is registered by a MsgAddServiceProvider
        # governance proposal at onboarding time -- see the note above the client: section
    pricefeed:
      params:
        # Every market starts with NO registered oracle: nobody may post a price until a pricefeed
        # MsgUpdateParams proposal adds one.  The seeded postedPriceList below still produces working
        # current prices at genesis -- InitGenesis calls keeper.SetPrice, which validates only the
        # expiry, and SetCurrentPrices aggregates raw prices without ever consulting market.oracles.
        # Registration gates future MsgPostPrice only.
        #
        # NOTE when you do add oracles: MsgUpdateParams REPLACES the whole params object (see the
        # "All parameters must be supplied" note in proto/qadena/pricefeed/tx.proto), so the proposal
        # must carry all six markets.  Omitting one deletes it, and Params.Validate() is a no-op that
        # will not catch it.  Generate the proposal from `query pricefeed params`, do not hand-write.
        markets:
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "qdn"
            marketId: "cn:qdn:php"
            quoteAsset: "php"
            oracles: []
          - active: true
            baseAsset: "php"
            marketId: "fn:php:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "aud"
            marketId: "fn:aud:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "btc"
            marketId: "cn:btc:usd"
            quoteAsset: "usd"
            oracles: []
          - active: true
            baseAsset: "eth"
            marketId: "cn:eth:usd"
            quoteAsset: "usd"
            oracles: []
      # Bootstrap prices, attributed to no oracle.  oracleAddress is omitted deliberately: SetPrice
      # never validates it, and PostedPriceKey length-prefixes the empty address to 0x00, giving a
      # valid key that stays unique because there is one seeded price per market.
      #
      # Non-qdn rates are spot values as of 2026-07-29.  qdn is not traded yet, so cn:qdn:usd keeps
      # its 0.01 placeholder -- and cn:qdn:php is DERIVED from it, not independent:
      #     qdn:php = qdn:usd / php:usd = 0.01 / 0.016297 = 0.613610
      # Keep those three in step; cn:qdn:php is the one that matters in practice, since it is what
      # msg_server_create_credential.go converts the "30php" fee through.
      postedPriceList:
        # placeholder: qdn is not traded yet, so this rate is assumed, not observed
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:qdn:usd"
          price: "0.01"
        # derived from cn:qdn:usd and fn:php:usd as of 2026-07-29: 0.01 / 0.016297
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:qdn:php"
          price: "0.613610"
        # as of 2026-07-29: 1 USD = 61.360986685 PHP (xe.com)
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "fn:php:usd"
          price: "0.016297"
        # as of 2026-07-29 (exchangerates.org.uk)
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "fn:aud:usd"
          price: "0.696"
        # as of 2026-07-29 (Fortune; MetaMask quoted 63766 the same day)
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:btc:usd"
          price: "64363.66"
        # as of 2026-07-29 (Fortune; MetaMask quoted 1914.28 the same day)
        - expiry: "2030-01-01T00:00:00Z"
          marketId: "cn:eth:usd"
          price: "1916.18"
