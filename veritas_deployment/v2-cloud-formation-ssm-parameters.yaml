        - '{"SEC_DSVS_SRV_PRV_PRIVATE_KEY": "WyJSRVBMQUNFX01FX0FSTU9SRURfUFJJVkFURV9LRVlTIl0="}'

  AppServerSECIdentitySrvPrvUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/SEC_IDENTITY_SRV_PRV_USERNAME"
      Type: String
      # base64 JSON array: base, credential, plus 30 ephemerals.
      # Staging value verified against stacks/veritas/env-staging-no-aws.
      # PRODUCTION VALUE IS UNRECONCILED -- it is whatever this template
