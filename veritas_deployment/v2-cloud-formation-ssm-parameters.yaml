  # helper returns a one-element array holding the raw string, so the app boots
  # and runs with a single garbage key instead of ~30.
  AppServerSECIdentitySrvPrvPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "VERITAS SEC_IDENTITY_SRV_PRV_PRIVATE_KEY (base64 JSON array of armored keys)"
      Name: !Sub "/veritas/${EnvType}/AppServer/SEC_IDENTITY_SRV_PRV_PRIVATE_KEY"
      SecretString: !If
