AWSTemplateFormatVersion: "2010-09-09"

Description: 'Creates the SSM and Secret Manager parameters for VERITAS.'

Parameters:

  EnvType:
    Description: Environment type.
    Default: production
    Type: String
    AllowedValues:
      - staging
      - production
    ConstraintDescription: must specify production or staging.

Conditions:
  CreateProdResources: !Equals 
    - !Ref EnvType
    - production
  Staging: !Equals 
    - !Ref EnvType
    - staging

Resources:


  GITPATSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "VERITAS git personal access token"
      Name: !Sub /veritas/${EnvType}/Common/git-personal-access-token
      SecretString: !Sub |
        {
          "git-personal-access-token": "dummy-token"
        }      

  QadenaArmorPassphraseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "VERITAS Qadena armor passphrase, use this to export all the required Qadena keys"
      Name: !Sub /veritas/${EnvType}/Common/qadena-armor-passphrase
      SecretString: !Sub |
        {
          "qadena-armor-passphrase": "dummy-passphrase"
        }

  PortalKeycloakBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/Portal/KEYCLOAK_BASE_URL"
      Type: String
      Value: !If
        - CreateProdResources
        - "https://privateiam.sec.gov.ph"
        - !Join [ "", [ "https://deviam.sec.gov.ph:8443" ] ]


  PortalKeycloakClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/Portal/KEYCLOAK_CLIENT_ID"
      Type: String
      Value: !If
        - CreateProdResources
        - "dsvs"
        - !Join [ "", [ "dsvs" ] ]

  PortalKeycloakClientSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/Portal/KEYCLOAK_CLIENT_SECRET"
      Type: String
      Value: !If
        - CreateProdResources
        - "QOQ7wEShCwHK6yhXlIuViO67pYknbUmX"
        - !Join [ "", [ "QOQ7wEShCwHK6yhXlIuViO67pYknbUmX" ] ]

  PortalKeycloakRealmNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/Portal/KEYCLOAK_REALM_NAME"
      Type: String
      Value: !If
        - CreateProdResources
        - "SEC-Private"
        - !Join [ "", [ "SEC-Employees" ] ]

  AppServerKeycloakBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/KEYCLOAK_BASE_URL"
      Type: String
      Value: !If
        - CreateProdResources
        - "https://iampub.sec.gov.ph"
        - !Join [ "", [ "https://deviam.sec.gov.ph:8443" ] ]

  AppServerSecApiBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/SEC_API_BASE_URL"
      Type: String
      # staging points at dev-signapp/api/v1, not secapi/dev-veritas.
      # Staging value verified against stacks/veritas/env-staging-no-aws.
      # PRODUCTION VALUE IS UNRECONCILED -- it is whatever this template
      # already carried, which is a stale staging snapshot. Replace it from
      # the live parameter store before running an update against production.
      Value: !If
        - CreateProdResources
        - "https://secapi.sec.gov.ph/veritas"
        - "https://dev-signapp.sec.gov.ph/api/v1"

  AppServerSecApiValueParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/SEC_API_VALUE"
      Type: String
      # staging uses a different key from the one recorded here.
      # Staging value verified against stacks/veritas/env-staging-no-aws.
      # PRODUCTION VALUE IS UNRECONCILED -- it is whatever this template
      # already carried, which is a stale staging snapshot. Replace it from
      # the live parameter store before running an update against production.
      Value: !If
        - CreateProdResources
        - "5404bc7e-5b8a-4415-84bc-7e5b8ad41502"
        - "54644877-33e3-429c-9e36-66c5652863e0"

  AppServerEsapApiUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESAP_API_URL"
      Type: String
      Value: !If
        - CreateProdResources
        - "https://secapi.sec.gov.ph/veritas"
        - !Join [ "", [ "https://dev-signapp.sec.gov.ph/dsvs" ] ]

  AppServerEsapApiKeyValueParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESAP_API_KEY_VALUE"
      Type: String
      Value: !If
        - CreateProdResources
        - "5404bc7e-5b8a-4415-84bc-7e5b8ad41502"
        - !Join [ "", [ "54644877-33e3-429c-9e36-66c5652863e0" ] ]

  # Folded in from patch-2-cloud-formation-ssm-parameters.yaml so this template is
