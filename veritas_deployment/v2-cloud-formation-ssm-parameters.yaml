    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESAP_VERITAS_SERVICE_ID"
      Type: String
      Value: !If
        - CreateProdResources
        - "17c20ff1-18d2-48d3-8c9d-ce760a0ac5df"
        - "073bb20c-e080-43ce-959e-902c5c2cde70"

  AppServerEsecureClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESECURE_CLIENT_ID"
      Type: String
      Value: !If
        - CreateProdResources
        - "dsvs"
        - !Join [ "", [ "dsvs" ] ]

  AppServerEsecureClientSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESECURE_CLIENT_SECRET"
      Type: String
      Value: !If
        - CreateProdResources
        - "QMy4QpaMBoHKN2zCjD58CI4NJji0sOb8"
        - !Join [ "", [ "QOQ7wEShCwHK6yhXlIuViO67pYknbUmX" ] ]

  AppServerKeycloakRealmNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESECURE_REALM_NAME"
      Type: String
      Value: !If
        - CreateProdResources
        - "SEC-Public"
        - !Join [ "", [ "SEC-Development" ] ]

  AppServerEsecureApiBaseParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/veritas/${EnvType}/AppServer/ESECURE_API_BASE_URL"
