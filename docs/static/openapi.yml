,"qadena.qadena.HelloReply":{"type":"object","title":"The response message containing the greetings","properties":{"message":{"type":"string"}}},"qadena.qadena.HelloRequest":{"description":"The request message containing the user's name.","type":"object","properties":{"name":{"type":"string"}}},"qadena.qadena.InitEnclaveReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.IntervalPublicKeyID":{"type":"object","properties":{"externalIPAddress":{"type":"string"},"homePioneerID":{"type":"string"},"nodeID":{"type":"string"},"nodeType":{"type":"string"},"previousPubKID":{"description":"The key this record replaced.  A VShare bound to it stays acceptable until the NEXT rotation\noverwrites this pointer, so the grace period expires on its own -- no height arithmetic, and\nnothing to prune.  Empty on a first write and on records written before this field existed,\nwhich simply means \"no grace yet\"; the first rotation after an upgrade fills it in.\n\nDerived only by SetIntervalPublicKeyID from what is already in the store, never taken from a\nmessage, so every validator computes the same value and no caller can nominate a key of its\nchoosing.","type":"string"},"pubKID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"},"serviceProviderType":{"type":"string"}}},"qadena.qadena.JarRegulator":{"type":"object","properties":{"jarID":{"type":"string"},"regulatorID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.ListWalletAmount":{"type":"object","properties":{"walletAmounts":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.WalletAmount"}}}},"qadena.qadena.MsgAddPublicKey":{"type":"object","properties":{"creator":{"type":"string"},"pubK":{"type":"string"},"pubKType":{"type":"string"}}},"qadena.qadena.MsgAddPublicKeyResponse":{"type":"object"},"qadena.qadena.MsgAddScannedContractWhitelist":{"description":"Add one non-wallet party to the scanned-contract whitelist.  One en