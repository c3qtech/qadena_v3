scan as MsgTransferFunds.\n\nSeparate from MsgScanTransactions because almost none of that message applies here: a transfer's\namount is spread across Pedersen commitments and VShares that the enclave has to decrypt, whereas\na bank send's amount is public and arrives as a plain integer.  What the two share -- the window,\nthe jurisdiction lookup, the threshold table -- is shared as code inside the enclave rather than\nby forcing one message to carry both shapes.","type":"object","properties":{"coins":{"description":"One per denomination in the send.  bank SendCoins carries sdk.Coins, so a single message can\nmove several denominations at once and each needs its own market and its own fail-closed\npricing check.","type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.ScanBankSendCoin"}},"countryThresholds":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.ScanCountryThreshold"}},"defaultThresholdAttoUSD":{"type":"string"},"dstContract":{"$ref":"#/definitions/qadena.qadena.ScannedContractWhitelist"},"dstWalletID":{"type":"string"},"height":{"type":"string","format":"int64"},"jarID":{"type":"string"},"params":{"$ref":"#/definitions/qadena.qadena.Params"},"srcContract":{"description":"Set when the corresponding side is on the scanned-contract whitelist, nil otherwise.\n\nThe KEEPER resolves this, not the enclave.  Whitelist membership and the pinned-code-ID check\nare chain state the enclave does not hold, and the enclave has no way to ask whether an address\nis a contract.  Passing the resolved entry keeps the enclave deciding only what it is for --\nwhether the value is reportable -- and keeps contract detection on the side that can do it.","$ref":"#/definitions/qadena.qadena.ScannedContractWhitelist"},"srcWalletID":{"type":"string"},"timestamp":{"type":"string","format":"date-time"}}},"qadena.qadena.MsgScanTransactions":{"type":"object","properties":{"countryThresholds":{"description":"Thresholds already converted to attoUSD by the keeper.  They arrive pre-resolved because\nneither side can do this alone: the keeper holds the pricefeed but cannot see the sender's\ncountries, which are sealed inside a credential, while the enclave can read the countries but\nhas no pricefeed.  So the keeper values every configured threshold and the enclave only picks.","type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.ScanCountryThreshold"}},"defaultThresholdAttoUSD":{"description":"Applied when none of the sender's countries is configured.  Also in attoUSD.","type":"string"},"exchangerate":{"type":"string"},"height":{"type":"string","format":"int64"},"msg":{"$ref":"#/definitions/qadena.qadena.MsgTransferFunds"},"params":{"description":"The AML policy, read per scan rather than fixed at enclave startup, so a governance change to\nthe window or the eKYC gate takes effect without restarting every node.","$ref":"#/definitions/qadena.qadena.Params"},"timestamp":{"type":"string","format":"date-time"}}},"qadena.qadena.MsgSignRecoverPrivateKey":{"type":"object","properties":{"creator":{"type":"string"},"destinationEWalletIDVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"},"encDestinationEWalletIDVShare":{"type":"string","format":"byte","title":"formerly encDestinationEWalletIDSSIntervalPubK"},"recoverShare":{"$ref":"#/definitions/qadena.qadena.RecoverShare"}}},"qadena.qadena.MsgSignRecoverPrivateKeyResponse":{"type":"object"},"qadena.qadena.MsgSyncCredentials":{"type":"object","properties":{"clear":{"type":"boolean"}}},"qadena.qadena.MsgSyncEnclave":{"type":"object","properties":{"externalAddress":{"type":"string"},"pioneerArmorPassPhrase":{"type":"string"},"pioneerArmorPrivK":{"type":"string"},"pioneerID":{"type":"string"},"seedNode":{"type":"string"}}},"qadena.qadena.MsgSyncRecoverKeys":{"type":"object","properties":{"clear":{"type":"boolean"}}},"qadena.qadena.MsgSyncSuspiciousTransactions":{"type":"object","properties":{"clear":{"type":"boolean"}}},"qadena.qadena.MsgSyncWallets":{"type":"object","properties":{"clear":{"type":"boolean"}}},"qadena.qadena.MsgTransactionComplete":{"type":"object","properties":{"success":{"type":"boolean"}}},"qadena.qadena.MsgTransferFunds":{"type":"object","properties":{"anonTransferFundsVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"},"creator":{"type":"string"},"encAnonTransferFundsVShare":{"type":"string","format":"byte"},"encNewDestinationWalletAmountVShare":{"type":"string","format":"byte"},"encNewSourceWalletAmountVShare":{"type":"string","format":"byte"},"encTransferFundsVShare":{"type":"string","format":"byte"},"hiddenTransferPC":{"$ref":"#/definitions/qadena.qadena.BPedersenCommit"},"hiddenTransferPCProof":{"$ref":"#/definitions/qadena.qadena.BRangeProof"},"newDestinationWalletAmountVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"},"newSourcePC":{"$ref":"#/definitions/qadena.qadena.BPedersenCommit"},"newSourcePCProof":{"$ref":"#/definitions/qadena.qadena.BRangeProof"},"newSourceWalletAmountVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"},"sourcePC":{"$ref":"#/definitions/qadena.qadena.BPedersenCommit"},"tokenDenom":{"type":"string"},"transactionID":{"type":"string"},"transferFundsVShareBind":{"title":"formerly vShareBind","$ref":"#/definitions/qadena.qadena.VShareBindData"},"transparentAmount":{"$ref":"#/definitions/qadena.qadena.BInt"}}},"qadena.qadena.MsgTransferFundsResponse":{"type":"object"},"qadena.qadena.MsgUpdateCredential":{"description":"MsgUpdateCredential folds corrected personal info, re-issued by an identity provider as a\nfresh ownerless credential, into a credential the creator already owns.  Unlike a claim it\nnever writes wallet.credentialID -- same credential, same wallet, same recovery.","type":"object","properties":{"creator":{"type":"string"},"credentialID":{"type":"string","title":"the creator's EXISTING credentialID, i.e. the row being overwritten in place"},"credentialType":{"type":"string"},"encUpdateCredentialExtraParmsVShare":{"type":"string","format":"byte"},"updateCredentialExtraParmsVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"}}},"qadena.qadena.MsgUpdateCredentialResponse":{"type":"object"},"qadena.qadena.MsgUpdateEnclaveIdentity":{"type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"productID":{"type":"string"},"signerID":{"type":"string"},"status":{"type":"string"},"uniqueID":{"type":"string"}}},"qadena.qadena.MsgUpdateEnclaveIdentityResponse":{"type":"object"},"qadena.qadena.MsgUpdateHeight":{"type":"object","properties":{"height":{"type":"string","format":"int64"},"isProposer":{"type":"boolean"}}},"qadena.qadena.MsgUpdateParams":{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"NOTE: All parameters must be supplied.","$ref":"#/definitions/qadena.qadena.Params"}}},"qadena.qadena.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"qadena.qadena.MsgUpdateSSIntervalKey":{"type":"object"},"qadena.qadena.MsgUpgradeEnclave":{"type":"object","properties":{"enclavePubK":{"type":"string"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.Params":{"description":"Params defines the parameters for the module.","type":"object","properties":{"allow_transfer_without_ekyc":{"description":"Whether a wallet with no claimed credential may send at all.  Named for what it PERMITS so\nthat proto3's zero value (false) is the ENFORCING state: an unset param must never silently\nswitch an AML control off, and every other spelling of this flag would do exactly that on a\nchain whose params predate it.","type":"boolean"},"block_transfer_without_opt_in_reason":{"description":"What to do with a reportable transfer whose sender gave no --opt-in-reason.\n\nFALSE (default): file the report anyway, substituting \"No reason provided\", and let the\ntransfer through.  TRUE: refuse it and file nothing, which is what this chain did before the\nflag existed.\n\nThe old behaviour made every report self-selected: a sender unwilling to be named was blocked\nrather than reported, so the regulator saw only volunteered transfers and never the refusals.\nDefaulting to false means an un-upgraded chain starts producing MORE reports, never fewer,\nwhich is why the proto3 zero is safe here even though it reads as \"do not block\".","type":"boolean"},"create_bulk_credentials_fee":{"type":"string"},"create_credential_fee":{"type":"string"},"create_ephemeral_wallet_incentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"create_ephemeral_wallet_transparent_incentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"create_wallet_incentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"create_wallet_transparent_incentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"ekyc_identity_owner_royalty_percentage":{"type":"string"},"ekyc_submit_new_app_royalty_percentage":{"type":"string"},"ekyc_submit_reuse_app_royalty_percentage":{"type":"string"},"ekyc_submit_reuse_provider_royalty_percentage":{"type":"string"},"suspicious_transaction_threshold":{"description":"The AML scan in the enclave (ScanTransaction).  Two rules use these: a single transfer at or\nabove the threshold, and the rolling-window total from one source to one destination reaching\nit.  Like the update-credential block above, an empty string or a zero reads as UNSET on a\nchain that predates these params, so SuspiciousPolicyFromParams substitutes the compiled-in\ndefaults.  It must never interpret them literally: a zero threshold would flag every transfer\nand a zero window would expire the history instantly, silently disabling the aggregate rule.","type":"string"},"suspicious_transaction_threshold_overrides":{"description":"Per-jurisdiction thresholds, because the reporting limit is a legal number set locally and not\na converted one: PH files at PHP 500,000, the US at USD 10,000.  Anything not listed here falls\nback to suspicious_transaction_threshold.","type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.SuspiciousThresholdOverride"}},"suspicious_transaction_window_seconds":{"description":"Length of the rolling window.  Measured against the BLOCK time supplied to the enclave, never\nwall clock -- the scan runs on every validator and its verdict decides whether the transfer is\nrejected, so a non-deterministic clock here would fork the chain.","type":"string","format":"int64"},"update_birthdate_max_year_delta":{"type":"integer","format":"int64"},"update_credential_allow_gender_change":{"type":"boolean"},"update_credential_allow_last_name_life_event":{"type":"boolean","title":"gates so a jurisdiction can disable a transition by param rather than by fork"},"update_credential_fee":{"description":"MsgUpdateCredential.  Every numeric here reads as zero on a chain that predates these\nparams, so the policy loader substitutes the compiled-in defaults in\nx/qadena/common/credential_policy.go rather than rejecting every correction.  The\nbirthdate month/day-swap exception is deliberately NOT a param: it is part of what the\nbirthdate rule MEANS, not a quantity to tune.","type":"string"},"update_credential_max_changed_identity_fields":{"description":"How many identity-bearing fields (first/middle/last name, birthdate, gender) may change in a\nsingle MsgUpdateCredential.\n\nONE IS THE SAFE VALUE AND THE DEFAULT.  Two simultaneous changes are hard to distinguish from\nsubstituting one person for another, which is why this was a compiled-in constant until it\nbecame a param.  A zero here reads as UNSET and yields 1, so a chain whose params predate this\nkeeps exactly the behaviour it had.\n\nRaising it also weakens the surname life-event rule, which is only safe because the remaining\nidentity fields still pin the identity while the surname is replaced wholesale.  A chain that\nallows a life event AND another edit in one update has given up that anchor.","type":"integer","format":"int64"},"update_credential_max_identity_aliases":{"type":"integer","format":"int64","title":"cap on entries in a credential's identity-hash alias list; the list length is the\nhash-changing-update counter, so this is the lifetime update limit plus one"},"update_credential_max_life_events":{"type":"integer","format":"int64"},"update_credential_min_blocks_between_updates":{"type":"string","format":"int64"},"update_credential_policy_version":{"type":"integer","format":"int64","title":"bumped whenever the policy engine's behaviour changes, so a divergence between enclave\nbuilds is visible on chain instead of silent"},"update_name_max_edit_distance":{"type":"integer","format":"int64"},"update_name_max_edit_distance_percent":{"type":"integer","format":"int64"}}},"qadena.qadena.PioneerJar":{"type":"object","properties":{"jarID":{"type":"string"},"pioneerID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.PioneerUpdateEnclaveIdentity":{"type":"object","properties":{"enclaveIdentity":{"$ref":"#/definitions/qadena.qadena.EnclaveIdentity"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.ProtectKey":{"type":"object","properties":{"recoverShare":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.RecoverShare"}},"threshold":{"type":"integer","format":"int32"},"walletID":{"type":"string"}}},"qadena.qadena.PublicKey":{"type":"object","properties":{"pubK":{"type":"string"},"pubKID":{"type":"string"},"pubKType":{"type":"string"},"remoteReport":{"type":"string","format":"byte"},"shares":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.Share"}}}},"qadena.qadena.QueryAccountResponse":{"type":"object","properties":{"encryptedBalance":{"type":"string"},"transparentBalance":{"type":"string"}}},"qadena.qadena.QueryAllCredentialResponse":{"type":"object","properties":{"credential":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.Credential"}},"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"}}},"qadena.qadena.QueryAllEnclaveIdentityResponse":{"type":"object","properties":{"enclaveIdentity":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.EnclaveIdentity"}},"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"}}},"qadena.qadena.QueryAllIntervalPublicKeyIDResponse":{"type":"object","properties":{"intervalPublicKeyID":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.IntervalPublicKeyID"}},"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"}}},"qadena.qadena.QueryAllJarRegulatorResponse":{"type":"object","properties":{"jarRegulator":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.JarRegulator"}},"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"}}},"qadena.qadena.QueryAllPioneerJarResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"pioneerJar":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.PioneerJar"}}}},"qadena.qadena.QueryAllProtectKeyResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"protectKey":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.ProtectKey"}}}},"qadena.qadena.QueryAllPublicKeyResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"publicKey":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.PublicKey"}}}},"qadena.qadena.QueryAllRecoverKeyResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"recoverKey":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.RecoverKey"}}}},"qadena.qadena.QueryAllScannedContractWhitelistResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"scannedContractWhitelist":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.ScannedContractWhitelist"}}}},"qadena.qadena.QueryAllSuspiciousTransactionResponse":{"type":"object","properties":{"SuspiciousTransaction":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.SuspiciousTransaction"}},"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"}}},"qadena.qadena.QueryAllWalletResponse":{"type":"object","properties":{"pagination":{"$ref":"#/definitions/cosmos.base.query.v1beta1.PageResponse"},"wallet":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.Wallet"}}}},"qadena.qadena.QueryEnclaveRecoverKeyShareRequest":{"type":"object","properties":{"encShareWalletPubK":{"type":"string","format":"byte"},"newWalletID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"},"shareWalletID":{"type":"string"}}},"qadena.qadena.QueryEnclaveRecoverKeyShareResponse":{"type":"object","properties":{"encShareWalletPubK":{"type":"string","format":"byte"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.QueryEnclaveSecretShareRequest":{"type":"object","properties":{"enclavePubK":{"type":"string"},"pubKID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.QueryEnclaveSecretShareResponse":{"type":"object","properties":{"encSecretShareEnclavePubK":{"type":"string","format":"byte"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.QueryEnclaveSyncEnclaveRequest":{"type":"object","properties":{"enclavePubK":{"type":"string"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.QueryEnclaveSyncEnclaveResponse":{"type":"object","properties":{"encEnclaveParamsEnclavePubK":{"type":"string","format":"byte"},"remoteReport":{"type":"string","format":"byte"}}},"qadena.qadena.QueryEnclaveValidateEnclaveIdentityRequest":{"type":"object","properties":{"productID":{"type":"string"},"remoteReport":{"type":"string","format":"byte"},"signerID":{"type":"string"},"uniqueID":{"type":"string"}}},"qadena.qadena.QueryEnclaveValidateEnclaveIdentityResponse":{"type":"object","properties":{"remoteReport":{"type":"string","format":"byte"},"status":{"type":"string"}}},"qadena.qadena.QueryFindCredentialRequest":{"type":"object","properties":{"credentialPC":{"type":"string","format":"byte"},"credentialType":{"type":"string"},"encCheckPCSSIntervalPubK":{"type":"string","format":"byte"},"encProofPCSSIntervalPubK":{"type":"string","format":"byte"},"encUserCredentialPubKSSIntervalPubK":{"type":"string","format":"byte"},"sSIntervalPubKID":{"type":"string"}}},"qadena.qadena.QueryFindCredentialResponse":{"type":"object","properties":{"encCredentialIDUserCredentialPubK":{"type":"string","format":"byte"},"encPersonalInfoUserCredentialPubK":{"type":"string","format":"byte"}}},"qadena.qadena.QueryGetCredentialResponse":{"type":"object","properties":{"credential":{"$ref":"#/definitions/qadena.qadena.Credential"}}},"qadena.qadena.QueryGetEnclaveIdentityResponse":{"type":"object","properties":{"enclaveIdentity":{"$ref":"#/definitions/qadena.qadena.EnclaveIdentity"}}},"qadena.qadena.QueryGetIntervalPublicKeyIDResponse":{"type":"object","properties":{"intervalPublicKeyID":{"$ref":"#/definitions/qadena.qadena.IntervalPublicKeyID"}}},"qadena.qadena.QueryGetJarRegulatorResponse":{"type":"object","properties":{"jarRegulator":{"$ref":"#/definitions/qadena.qadena.JarRegulator"}}},"qadena.qadena.QueryGetPioneerJarResponse":{"type":"object","properties":{"pioneerJar":{"$ref":"#/definitions/qadena.qadena.PioneerJar"}}},"qadena.qadena.QueryGetProtectKeyResponse":{"type":"object","properties":{"protectKey":{"$ref":"#/definitions/qadena.qadena.ProtectKey"}}},"qadena.qadena.QueryGetPublicKeyResponse":{"type":"object","properties":{"publicKey":{"$ref":"#/definitions/qadena.qadena.PublicKey"}}},"qadena.qadena.QueryGetRecoverKeyRequest":{"type":"object","properties":{"timestamp":{"type":"string","format":"int64"},"timestampSignature":{"type":"string","format":"byte"},"walletID":{"type":"string"}}},"qadena.qadena.QueryGetRecoverKeyResponse":{"type":"object","properties":{"recoverKey":{"$ref":"#/definitions/qadena.qadena.RecoverKey"}}},"qadena.qadena.QueryGetScannedContractWhitelistResponse":{"type":"object","properties":{"scannedContractWhitelist":{"$ref":"#/definitions/qadena.qadena.ScannedContractWhitelist"}}},"qadena.qadena.QueryGetSubWalletIDByOriginalWalletIDResponse":{"type":"object","properties":{"subWalletID":{"type":"string"}}},"qadena.qadena.QueryGetSuspiciousTransactionResponse":{"type":"object","properties":{"SuspiciousTransaction":{"$ref":"#/definitions/qadena.qadena.SuspiciousTransaction"}}},"qadena.qadena.QueryGetWalletResponse":{"type":"object","properties":{"wallet":{"$ref":"#/definitions/qadena.qadena.Wallet"}}},"qadena.qadena.QueryIncentivesResponse":{"type":"object","properties":{"createEphemeralWalletIncentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"createEphemeralWalletTransparentIncentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"createWalletIncentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"createWalletTransparentIncentive":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"}}},"qadena.qadena.QueryParamsResponse":{"description":"QueryParamsResponse is response type for the Query/Params RPC method.","type":"object","properties":{"params":{"description":"params holds all the parameters of this module.","$ref":"#/definitions/qadena.qadena.Params"}}},"qadena.qadena.QueryTreasuryResponse":{"type":"object","properties":{"encryptedBalance":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"},"totalBalance":{"$ref":"#/definitions/cosmos.base.v1beta1.Coin"}}},"qadena.qadena.RecoverKey":{"type":"object","properties":{"NewWalletIDVShareBind":{"$ref":"#/definitions/qadena.qadena.VShareBindData"},"encNewWalletIDVShare":{"type":"string","format":"byte"},"recoverShare":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.RecoverShare"}},"signatory":{"type":"array","items":{"type":"string"}},"walletID":{"type":"string"}}},"qadena.qadena.RecoverKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.RecoverShare":{"type":"object","properties":{"encWalletPubKShare":{"type":"string","format":"byte"},"walletID":{"type":"string"}}},"qadena.qadena.RemoveCredentialReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.RemovePrivateKeyReply":{"type":"object"},"qadena.qadena.RollbackToHeightReply":{"type":"object","properties":{"fromHeight":{"type":"string","format":"int64"},"fromVersion":{"type":"string","format":"int64"},"reason":{"type":"string","title":"set when rolledBack is false: why not (already at height, height unknown, below horizon...)"},"rolledBack":{"type":"boolean"},"toHeight":{"type":"string","format":"int64"},"toVersion":{"type":"string","format":"int64"}}},"qadena.qadena.ScanBankSendCoin":{"description":"NOTE: no exchange rate.  MsgScanTransactions has to carry one because the enclave decrypts the\namount out of a Pedersen commitment and does the multiplication itself.  A bank send's amount is\npublic, so the keeper -- which holds the pricefeed -- values it directly and sends the result.\nThat also keeps the multi-denomination case in the one place that can price each denomination.","type":"object","properties":{"amount":{"type":"string"},"denom":{"type":"string"},"usdAmountAttoUSD":{"type":"string"}}},"qadena.qadena.ScanBankSendReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.ScanCountryThreshold":{"type":"object","properties":{"country":{"type":"string"},"thresholdAttoUSD":{"type":"string"}}},"qadena.qadena.ScanTransactionReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.ScannedContractWhitelist":{"description":"A non-wallet party that MAY take part in a bank send, and is still AML-scanned when it does.\n\nThis replaces the old bank-send whitelist, which exempted such accounts from scanning outright.\nThat exemption existed only because a report could not be built for a party with no credential:\ncreateSuspiciousTransaction decoded a personal-info credential for both sides and gave up without\none.  SuspiciousTransaction now carries a party KIND and a contract-shaped descriptor, so the\npremise is gone -- and with it the reason to have a list that turns scanning off.\n\nThe distinction matters: an entry here means \"scanned, but reported differently\", NOT \"exempt\".\nA send involving one of these accounts still runs the eKYC gate on the wallet side, still takes a\nthreshold, still accumulates in the rolling window, and still files a report when it crosses.\n\nMembership does not decide whether the send is scanned -- everything account-to-account is\nscanned.  It decides whether the party is allowed to be a non-wallet at all: an unlisted address\nwith no credential is refused as unscannable, exactly as before.","type":"object","properties":{"address":{"type":"string"},"codeID":{"description":"The wasm code ID this entry is pinned to, and 0 for an address that is not a wasm contract --\na funding treasury, say.\n\nPINNING IS THE POINT.  A wasmd contract's admin can migrate it to new code, so whitelisting a\nbare address whitelists whatever that address runs in future: get a benign escrow approved,\nthen migrate it into something that drains.  The send restriction re-checks the live code ID\nagainst this value on every send and refuses on a mismatch, so a migration revokes the entry\nrather than inheriting it.\n\nThe two directions are both errors and both caught: a contract listed with codeID 0, and a\nnon-contract listed with a codeID.","type":"string","format":"uint64"},"reason":{"description":"Why this party may move funds without being a wallet.  Required in practice -- an address on\nits own gives a reviewer no way to judge later whether the entry is still warranted -- and it\nis the text a regulator sees in the report, since there is no person to name.","type":"string"}}},"qadena.qadena.SecretSharePrivK":{"type":"object","properties":{"encEnclaveSSIDAndPrivK":{"type":"string","format":"byte"},"pioneerID":{"type":"string"}}},"qadena.qadena.SetCredentialReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetEnclaveIdentityReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetIntervalPublicKeyIdReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetJarRegulatorReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetPioneerJarReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetProtectKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetPublicKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetRecoverKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetSecretSharePrivateKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SetWalletReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.Share":{"type":"object","properties":{"encEnclaveShare":{"type":"string","format":"byte"},"pioneerID":{"type":"string"}}},"qadena.qadena.SignRecoverKeyReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.StoreHash":{"type":"object","properties":{"hash":{"type":"string"},"key":{"type":"string"}}},"qadena.qadena.SuspiciousPartyKind":{"description":"What kind of party a report names on one side.\n\nA report used to assume both sides were credentialed people, which is why a party without a\ncredential could not be reported at all and had to be exempted from scanning instead.  Naming the\nkind explicitly is what lets a contract or a treasury appear in a report honestly, rather than as\na person with invented details.\n\n - SUSPICIOUS_PARTY_KIND_WALLET: a wallet holding a personal-info credential; read encSource/DestinationPersonalInfoRegulatorPubK\n - SUSPICIOUS_PARTY_KIND_CONTRACT: a whitelisted non-wallet; read encSource/DestinationContractInfoRegulatorPubK instead\n - SUSPICIOUS_PARTY_KIND_ADDRESS_ONLY: A party with no identity on record at all, named by address only.  Also read from the\nContractInfo descriptor, which then carries an address with codeID 0 and no reason.\n\nReachable ONLY as the destination of a send from a whitelisted party.  That is the account\nbeing onboarded: a treasury funds a fresh key, and the key acquires a wallet and a credential\nafterwards, so at the moment of the send there is genuinely nothing to name it by.  A send\nbetween two ordinary parties still requires both to be identifiable, which is why this is not\nsimply \"anyone we could not resolve\".","type":"string","default":"SUSPICIOUS_PARTY_KIND_WALLET","enum":["SUSPICIOUS_PARTY_KIND_WALLET","SUSPICIOUS_PARTY_KIND_CONTRACT","SUSPICIOUS_PARTY_KIND_ADDRESS_ONLY"]},"qadena.qadena.SuspiciousThresholdOverride":{"description":"One jurisdiction's reporting threshold, in that jurisdiction's own currency.","type":"object","properties":{"country":{"description":"ISO 3166-1 alpha-2, matching the normalized Citizenship/Residency fields on a credential\n(tx_create_credential.go normalizes both through gountries to Alpha2).","type":"string"},"threshold":{"description":"e.g. \"500000php\".  The keeper converts this to a common unit through the pricefeed before the\nenclave sees it; the enclave has no pricefeed access of its own.","type":"string"}}},"qadena.qadena.SuspiciousTransaction":{"type":"object","properties":{"creator":{"type":"string"},"destinationKind":{"$ref":"#/definitions/qadena.qadena.SuspiciousPartyKind"},"encDestinationContractInfoRegulatorPubK":{"type":"string","format":"byte"},"encDestinationPersonalInfoRegulatorPubK":{"type":"string","format":"byte"},"encEAmountRegulatorPubK":{"type":"string","format":"byte"},"encOptInReasonRegulatorPubK":{"type":"string","format":"byte"},"encSourceContractInfoRegulatorPubK":{"type":"string","format":"byte","title":"EncryptableContractInfo, set only when the corresponding kind is CONTRACT"},"encSourcePersonalInfoRegulatorPubK":{"description":"Set only when the corresponding kind is WALLET; empty otherwise.  Exactly one of the two\ndescriptors per side is populated.","type":"string","format":"byte"},"id":{"type":"string","format":"uint64"},"jarID":{"type":"string"},"reason":{"type":"string"},"regulatorPubKID":{"type":"string"},"sourceKind":{"description":"WALLET on both sides for every report the transfer-funds path files, so existing readers that\nignore these fields still read those reports correctly -- WALLET is the zero value by design.","$ref":"#/definitions/qadena.qadena.SuspiciousPartyKind"},"time":{"type":"string","format":"date-time"}}},"qadena.qadena.SyncCredentialsReply":{"type":"object","properties":{"credentials":{"type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.Credential"}},"removedCredentials":{"description":"Credentials the enclave deleted.  Today deletion always originates on-chain, so nothing\npopulates this yet; it is the channel an enclave-originated removal will need once\nMsgRemoveCredential grows a user-initiated path.","type":"array","items":{"type":"object","$ref":"#/definitions/qadena.qadena.CredentialRef"}}}},"qadena.qadena.SyncEnclaveReply":{"type":"object","properties":{"status":{"type":"boolean"}}},"qadena.qadena.SyncRecoverKeysReply":{"type":"object","properties":{"recoverKeys":{"type":"array","items":{"type":"object","$ref