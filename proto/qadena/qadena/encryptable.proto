option go_package = "github.com/c3qtech/qadena_v3/x/qadena/types";

message EncryptableString {
	string Value = 1;
}

message EncryptableClaimCredentialExtraParms {
	bytes EncCredentialInfoVShare = 1;
	VShareBindData CredentialInfoVShareBind = 2;
	string WalletID = 3;
	BPedersenCommit FindCredentialPC = 4;
	BPedersenCommit NewCredentialPC = 5;
	bytes EncWalletIDVShare = 6;
	VShareBindData WalletIDVShareBind = 7;
	bytes EncCredentialHashVShare = 8;
	VShareBindData CredentialHashVShareBind = 9;
	EncryptablePedersenCommit ZeroPC = 10;
	BPedersenCommit ClaimPC = 11;
}

// EncryptableUpdateSubCredential carries one name sub-credential's share of an update.  The
// sub-updates travel inside the personal-info update rather than as separate messages: a
// sub-credential on its own has no personal-info context, so the enclave could not run the
// change policy on it, and a client could otherwise update a surname sub-credential without
// updating the identity hash it is supposed to agree with.
message EncryptableUpdateSubCredential {
	string CredentialType = 1;
	bytes EncCredentialInfoVShare = 2;
	VShareBindData CredentialInfoVShareBind = 3;
	BPedersenCommit FindCredentialPC = 4;
	BPedersenCommit NewCredentialPC = 5;
	EncryptablePedersenCommit ZeroPC = 6;
	BPedersenCommit ClaimPC = 7;
}

// EncryptableUpdateCredentialExtraParms mirrors EncryptableClaimCredentialExtraParms with two
// deliberate omissions: no EncWalletIDVShare/WalletIDVShareBind, which exist only to feed
// recoverKeyByCredential and an update never recovers; and no old identity hash, because the
// enclave recomputes it from the old row's own plaintext, which it must decrypt anyway.  A
// client-supplied old hash would be trusting the client with the alias index.
message EncryptableUpdateCredentialExtraParms {
	bytes EncCredentialInfoVShare = 1;
	VShareBindData CredentialInfoVShareBind = 2;
	string WalletID = 3;
	BPedersenCommit FindCredentialPC = 4;
	BPedersenCommit NewCredentialPC = 5;
	// 6 and 7 are EncWalletIDVShare/WalletIDVShareBind in the claim parms; the numbering is kept
	// parallel so the two messages read side by side
	reserved 6, 7;
	bytes EncCredentialHashVShare = 8;
	VShareBindData CredentialHashVShareBind = 9;
	EncryptablePedersenCommit ZeroPC = 10;
	BPedersenCommit ClaimPC = 11;
	repeated EncryptableUpdateSubCredential SubUpdates = 12;
}

// EncryptableCredentialIdentityHistory is the enclave's per-credential record of every identity
// hash that has ever resolved to it.  Its length doubles as the rate-limit counter: one entry for
// the original identity plus one per hash-changing update.  Scalars and a repeated field only --
// a proto map would not marshal deterministically.
message EncryptableCredentialIdentityHistory {
	repeated string Hashes = 1;
	uint32 LifeEventCount = 2;
	int64 LastUpdateHeight = 3;
}

// One recorded outgoing transfer, held in the enclave's rolling AML window.  The source wallet is
// the store key, so it is not repeated here.
//
// UnixTime is the BLOCK time the transfer was scanned at, in seconds.  It must never be wall clock:
// the scan runs inside the enclave on every validator and decides whether the transfer is rejected,
// so a clock that differed between nodes would fork the chain.  Seconds rather than a
// google.protobuf.Timestamp keeps this to plain scalars, matching the note on
// EncryptableCredentialIdentityHistory above.
message EncryptableScanTransfer {
	int64 UnixTime = 1;
	string DestinationWalletID = 2;
	cosmos.base.v1beta1.Coin USDCoinAmount = 3 [(gogoproto.nullable) = false];
	cosmos.base.v1beta1.Coin CoinAmount = 4 [(gogoproto.nullable) = false];

	// How this destination should be described if the rolling aggregate to it is ever reported.
	// Set only when the destination is on the scanned-contract whitelist; nil for a wallet.
	//
	// Held per ENTRY rather than taken from the send being scanned, because the aggregate rule
	// reports whichever destination crosses the threshold -- which is very often not the one in the
	// current message.  A treasury that pays a contract and then pays a wallet has both in its
	// window, and reading the current message's descriptor would describe the wrong party.
	ScannedContractWhitelist DestinationContract = 5;
}

// The window itself: every transfer one wallet has sent inside the configured period.  Entries
// older than the window are pruned lazily, the next time that wallet transfers.
message EncryptableScanTransferHistory {
	repeated EncryptableScanTransfer Transfers = 1;
}

message EncryptableAuthorizedSignatory {
	string Nonce = 1;
	repeated string WalletID = 2;
}

message EncryptableSignatory {
	string Nonce = 1;
	string Email = 2;
	string PhoneNumber = 3;
}

message EncryptableWalletAmount {
	string Nonce = 1;
	string TransactionID = 2;
	EncryptablePedersenCommit PedersenCommit = 3;
	string Note = 4;
	string RequiredSenderPIN = 5;
	string RequiredSenderFirstName = 6;
	string RequiredSenderMiddleName = 7;
	string RequiredSenderLastName = 8;
}

message EncryptablePersonalInfoDetails {
    string FirstName = 1;
    string MiddleName = 2;
    string LastName = 3;
    string Birthdate = 4;
    string Citizenship = 5;  // e.g US,PH,...
    string Residency = 6;
    string Gender = 7;
}

message EncryptablePersonalInfo {
    string Nonce = 1;
    string PIN = 2;
    EncryptablePersonalInfoDetails Details = 3; 
}

// What a report names in place of a person, when the party is not a wallet.
//
// Deliberately NOT an EncryptablePersonalInfo with invented fields: a regulator reading a report
// has to be able to tell a real identity from a contract, and a fake person is indistinguishable
// from a real one once encrypted.  SuspiciousTransaction carries a party kind alongside this so the
// reader knows which of the two descriptors to decrypt.
message EncryptableContractInfo {
    // Stands in for EncryptablePersonalInfo.Nonce when building the report's amount nonce.  The
    // address is public and stable, which is all that nonce needs to be.
    string Nonce = 1;
    string Address = 2;
    // 0 for a party that is not a wasm contract.  Recorded so a report says which code was running
    // at the time -- a later migration cannot retroactively change what was reported.
    uint64 CodeID = 3;
    // the governance-recorded justification from the whitelist entry
    string Reason = 4;
}

message EncryptableSingleContactInfoDetails {
    string Contact = 1;
}

message EncryptableSingleContactInfo {
    string Nonce = 1;
    string PIN = 2;
    EncryptableSingleContactInfoDetails Details = 3; 
}

message EncryptableValidatedCredential {
	string CredentialType = 1;
	string PIN = 2;
	BPedersenCommit CredentialPC = 3;
}

message EncryptableValidatedCredentials {
	repeated EncryptableValidatedCredential Credentials = 1;
}

message EncryptableCreateWalletEWalletIDExtraParms {
	BPedersenCommit ProofPC = 1;
}

message EncryptableCreateWalletEWalletID {
	string Nonce = 1;
	string WalletID = 2;
	EncryptableCreateWalletEWalletIDExtraParms ExtraParms = 3;
}


message EncryptableCreateWallet {
	EncryptableCreateWalletEWalletID DstEWalletID = 1;
}



message EncryptableTransferFundsEWalletIDExtraParms {
	BPedersenCommit AcceptPasswordPC = 1;
	bytes MatchFirstNameHashHex = 2;
	bytes MatchMiddleNameHashHex = 3;
	bytes MatchLastNameHashHex = 4;

	BPedersenCommit RequiredSenderFirstNameCheckPC = 5;
	BPedersenCommit RequiredSenderFirstNameProofPC = 6;
	BPedersenCommit RequiredSenderMiddleNameCheckPC = 7;
	BPedersenCommit RequiredSenderMiddleNameProofPC = 8;
	BPedersenCommit RequiredSenderLastNameCheckPC = 9;
	BPedersenCommit RequiredSenderLastNameProofPC = 10;
}

message EncryptableTransferFundsEWalletID {
	string Nonce = 1;
	string WalletID = 2;
	EncryptableTransferFundsEWalletIDExtraParms ExtraParms = 3;
}


message EncryptableTransferFunds {
	EncryptablePedersenCommit HiddenTransferPC = 1;
	EncryptableTransferFundsEWalletID DstEWalletID = 2;
	string OptInReason = 3;
}


message EncryptableReceiveFundsEWalletIDExtraParms {
	string Queue = 1;
}

message EncryptableReceiveFundsEWalletID {
	string Nonce = 1;
	string WalletID = 2;
	EncryptableReceiveFundsEWalletIDExtraParms ExtraParms = 3;
}

message EncryptableSignRecoverKeyEWalletID {
	string Nonce = 1;
	string WalletID = 2;
}



message EncryptableReceiveFunds {
	EncryptableReceiveFundsEWalletID EphEWalletID = 1;
}


message EncryptableAnonTransferFunds {
	EncryptablePedersenCommit TotalTransferPrimePC = 1;
	BInt TransparentTransferBF = 2;
}

message EncryptableESuspiciousAmount {
	string Nonce = 1;
	cosmos.base.v1beta1.Coin USDCoinAmount = 2;
	cosmos.base.v1beta1.Coin CoinAmount = 3;
}

message EncryptableSSIDAndPrivK {
	string PubKID = 1;
	string PubK = 2;
	string PrivK = 3;
}

message EncryptablePioneerIDs {
	repeated string PioneerIDs = 1;
}

message EncryptableEnclaveSSOwnerMap {
	map<string, EncryptablePioneerIDs> Pioneers = 1;
}

message EncryptableEnclavePubKCacheMap {
	map<string, string> PubKs = 1;
}

message EncryptableSharedEnclaveParams {
	string JarID = 1;
	string JarArmorPrivK = 2;
	string JarPrivK = 3;
	string JarPubK = 4;

	string RegulatorID = 5;
	string RegulatorArmorPrivK = 6;
	string RegulatorPrivK = 7;
	string RegulatorPubK = 8;

	// these only used temporarily to sync data from enclave to enclave
	EncryptableEnclaveSSOwnerMap SSIntervalOwners = 9;
	EncryptableEnclavePubKCacheMap SSIntervalPubKCache = 10;

	// THE TRUSTED SET: which enclave measurements this enclave will release secrets to.
	//
	// Distinct from the mirrored EnclaveIdentity store, which holds the CHAIN's opinion and is
	// accumulated and audited against it.  Mirrored rows arrive from the node, and a node with no
	// history to contradict it -- one whose data/ was wiped, replaying a genesis or a state-sync
	// snapshot it was handed -- can assert anything.  Genesis in particular names the launch
	// enclave `active` with no attestation attached and no field to carry one, so an enclave that
	// derived trust from mirrored status would take an unverifiable claim as authority over every
	// secret it holds (QueryEnclaveSyncEnclave, SecretShare, RecoverKeyShare, GetRecoverKey all
	// gate on it through verifyRemoteReport).
	//
	// Living HERE rather than in a store of its own is what makes the lifecycle work: this message
	// is the sync-enclave payload, so a joiner inherits the set over the seed's attested channel;
	// it is sealed into enclave_params_<uniqueID>.json, so it survives restarts and a wiped data/;
	// and UpgradeEnclave hands the whole storedEnclaveParams to the next measurement, so an upgrade
	// carries it forward.  It is never accumulated, so it cannot diverge the store audit.
	repeated EnclaveIdentity ActiveEnclaveIdentities = 11;
}

// One page of the sync-enclave handshake.
//
// WHY THIS EXISTS.  SSIntervalOwners grows without bound: a new SS interval key is minted every
// keyUpdateFrequency (555) blocks, so the map holds roughly chainHeight/555 entries -- ~166 at 92k,
// ~1,800 at 1M, ~18,000 at 10M.  It used to be sent as ONE message, which walks into both a latency
// ceiling and gRPC's 4 MiB message limit as the chain ages.  The failure would land on the joining
// operator as "add_full_node.sh fails at sync-enclave" against a seed that is perfectly healthy,
// with nothing in either log saying "too much data".
//
// nextCursor and done live INSIDE this message on purpose.  This message is encrypted to the
// joiner and the seed's remote report covers exactly those ciphertext bytes, so a network attacker
// cannot truncate the handshake by flipping `done` in the clear.  That matters more than it looks:
// a short owners map is not a visible failure.  It makes getSSPrivK return "" for the missing
// intervals much later, and an empty key is a valid-looking input that silently changes a state
// transition -- a fork with no error anywhere near it.
message EncryptableSyncEnclavePage {
	// Populated on the FIRST page only.  The key material is fixed-size and does not page; only the
	// owners map does.  Its SSIntervalOwners field is left empty -- the owners travel in the field
	// below so that every page carries them the same way.
	EncryptableSharedEnclaveParams params = 1;

	// This page's slice of SSIntervalOwners, keyed by SS interval pubKID.
	map<string, EncryptablePioneerIDs> SSIntervalOwners = 2;

	// Opaque to the caller; it is the last pubKID on this page.  Plaintext is fine -- a pubKID is
	// already public on chain as an IntervalPublicKeyID.
	bytes nextCursor = 3;
	bool  done = 4;
}

