message MsgPioneerAddPublicKey {
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1;
  string pubKID   = 2;
  string pubK     = 3;
  string pubKType = 4;
  repeated Share  shares   = 5;
  bytes remoteReport     = 6;
}

message MsgPioneerAddPublicKeyResponse {}

// RE-SHARE, NOT REKEY: no pubK field.  The handler inherits pubK from the stored row, so this
// message cannot change what the pubKID means -- only who holds shares of it.  shares is the FULL
// new owner set with fresh shares for every owner (old and new): shares from two different Split
// calls combine to garbage, so partial distribution is never valid.
message MsgPioneerUpdatePublicKey {
  option (cosmos.msg.v1.signer) = "creator";
  string creator        = 1;
  string pubKID         = 2;
  string pubKType       = 3;
  repeated Share shares = 4;
  // DER ECDSA signature by the interval private key over
  // sha256("qadena-reshare|" + creator + "|" + pubKID + "|" + pubKType + "|" + sharesJSON):
  // proof the sender HOLDS the key it is re-sharing, verified against the stored row's pubK.
  bytes possessionSig   = 5;
  bytes remoteReport    = 6;
}

message MsgPioneerUpdatePublicKeyResponse {}

message MsgPioneerUpdateIntervalPublicKeyID {
  option (cosmos.msg.v1.signer) = "creator";
  string creator           = 1;
  string pubKID            = 2;
  string nodeID            = 3;
  string nodeType          = 4;
