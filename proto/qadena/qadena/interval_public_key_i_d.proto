syntax = "proto3";
package qadena.qadena;

option go_package = "github.com/c3qtech/qadena_v3/x/qadena/types";

message IntervalPublicKeyID {
  string nodeID = 1; 
  string nodeType = 2; 
  string pubKID = 3; 
  string externalIPAddress = 4; 
  string serviceProviderType = 5;  
  bytes remoteReport = 6;  
  string homePioneerID = 7;

  // The key this record replaced.  A VShare bound to it stays acceptable until the NEXT rotation
  // overwrites this pointer, so the grace period expires on its own -- no height arithmetic, and
  // nothing to prune.  Empty on a first write and on records written before this field existed,
  // which simply means "no grace yet"; the first rotation after an upgrade fills it in.
  //
  // Derived only by SetIntervalPublicKeyID from what is already in the store, never taken from a
  // message, so every validator computes the same value and no caller can nominate a key of its
  // choosing.
  string previousPubKID = 8;

  // The block height at which this pioneer's validator left the bonded set, or 0 while it is in.
  // Written by the staking hooks beside the address they clear, and cleared again when the
  // validator re-bonds.
  //
  // WHY IT LIVES ON THE MIRRORED ROW rather than beside the parked address.  Dropping a departed
  // pioneer from an SS key's owner set needs TWO parties to agree: the chain validates the drop,
  // but the ENCLAVE is the only thing that can propose one, because it alone holds the key and
  // can re-split it.  The enclave sees this row -- the prefix is in mirroredStores, so it arrives
  // live on every write, survives a restart as ordinary chain state, and is seeded in bulk to a
  // node that joined later.  The parked-address store is deliberately NOT mirrored, so a height
  // kept only there would be invisible to the one component that has to act on it, and the
  // enclave would be left timing the absence itself -- an observation a restart forgets.
  //
  // IT DOES NOT ANSWER "IS THIS PIONEER ADDRESSABLE".  externalIPAddress still does, alone.  That
  // separation is why putting this here does not reintroduce the contradiction the parked store
  // was kept out of the mirror to avoid: this field says WHEN it left, never WHETHER it is here.
  //
  // ZERO IS "NOT DEPARTED", and it is also what a row written before this field existed
  // unmarshals as -- the two must mean the same thing or an upgrade would make every historical
  // row read as departed at genesis.
  int64 departedHeight = 9;
}

