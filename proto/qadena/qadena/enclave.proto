// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

service QadenaEnclave {
  // Asked once at startup, before deciding whether to initialize: is this enclave already
  // initialized?  The chain cannot infer this -- InitEnclaveReply is a single bool that means
  // "accepted", identically for "I initialized now" and "I was already initialized" -- and every
  // proxy for it is wrong somewhere: chain state rewinds during block replay, and a node's
  // identity in genesis says who it is rather than what its enclave holds.
  //
  // ADDITIVE ON PURPOSE.  An enclave that predates this answers Unimplemented, and the caller
  // treats that as "cannot tell, fall back", the same shape rollback.go uses for GetEnclaveHeight.
  rpc GetEnclaveStatus (MsgGetEnclaveStatus) returns (GetEnclaveStatusReply) {}

  // these are called from init_enclave
  rpc InitEnclave (MsgInitEnclave) returns (InitEnclaveReply) {}
  rpc SyncEnclave (MsgSyncEnclave) returns (SyncEnclaveReply) {}
  //rpc AddAsValidator (MsgAddAsValidator) returns (AddAsValidatorReply) {}
  rpc UpgradeEnclave (MsgUpgradeEnclave) returns (UpgradeEnclaveReply) {}

  // for debug only, called from init_enclave
  rpc ExportPrivateKey (MsgExportPrivateKey) returns (ExportPrivateKeyReply) {}
  rpc ExportPrivateState (MsgExportPrivateState) returns (ExportPrivateStateReply) {}
  rpc RemovePrivateKey (MsgRemovePrivateKey) returns (RemovePrivateKeyReply) {}
  rpc UpdateSSIntervalKey (MsgUpdateSSIntervalKey) returns (UpdateSSIntervalKeyReply) {}
  // debug-only: run the re-share AUDIT without minting a key -- lets a test drain a re-share
  // backlog without creating one junk interval key per forced rotation
  rpc AuditSSKeys (MsgAuditSSKeys) returns (AuditSSKeysReply) {}
  // debug-only: force a WHO-HAS query for one pubKID -- ask peer enclaves who holds it cached.
  // Exercises the rescue path directly, without having to contrive a threshold failure first.
  rpc WhoHasSSKey (MsgWhoHasSSKey) returns (WhoHasSSKeyReply) {}

  // Fetch this enclave's PRIVATE tables as of a height, for a peer that joined by state-sync and
  // therefore never executed the blocks that would have produced them.  Attested and paged.
  //
  // Deliberately NOT a mode of ExportPrivateState: that one hands PioneerPrivK, JarPrivK and
  // SealedTableSharedSecret to an unauthenticated local caller, and its debug gate is the only
  // thing standing between those and total key exfiltration.  Nothing should ever be able to reach
  // that handler over the network.
  rpc QueryEnclavePrivateState (QueryEnclavePrivateStateRequest) returns (QueryEnclavePrivateStateResponse) {}
  rpc QueryEnclavePrivateStateAvailability (QueryEnclavePrivateStateAvailabilityRequest) returns (QueryEnclavePrivateStateAvailabilityResponse) {}

  // local: pull the private tables at a height from peers, then commit them atomically
  rpc SyncPrivateState (MsgSyncPrivateState) returns (SyncPrivateStateReply) {}

  // these are called from the chain by an enclave
  rpc QueryEnclaveSyncEnclave (QueryEnclaveSyncEnclaveRequest) returns (QueryEnclaveSyncEnclaveResponse) {}
  rpc QueryEnclaveSecretShare (QueryEnclaveSecretShareRequest) returns (QueryEnclaveSecretShareResponse) {}
  // who-has: a cached interval privK for an attested peer (see query.proto for the domain tags)
  rpc QueryEnclaveSecretSharePrivK (QueryEnclaveSecretSharePrivKRequest) returns (QueryEnclaveSecretSharePrivKResponse) {}
  rpc QueryEnclaveRecoverKeyShare (QueryEnclaveRecoverKeyShareRequest) returns (QueryEnclaveRecoverKeyShareResponse) {}
  rpc QueryEnclaveValidateEnclaveIdentity (QueryEnclaveValidateEnclaveIdentityRequest) returns (QueryEnclaveValidateEnclaveIdentityResponse) {}
  // which build am I, and do I hold a trusted set -- see query.proto for why this is unauthenticated
  rpc QueryEnclaveMeasurement (QueryEnclaveMeasurementRequest) returns (QueryEnclaveMeasurementResponse) {}

  rpc SetEnclaveIdentity (EnclaveIdentity) returns (SetEnclaveIdentityReply) {}

  rpc UpdateEnclaveIdentity (PioneerUpdateEnclaveIdentity) returns (UpdateEnclaveIdentityReply) {}


  rpc SetWallet (Wallet) returns (SetWalletReply) {}
  rpc SetProtectKey (ProtectKey) returns (SetProtectKeyReply) {}
  rpc SetRecoverKey (RecoverKey) returns (SetRecoverKeyReply) {}
  rpc SetCredential (Credential) returns (SetCredentialReply) {}

  // SeedCredential is SetCredential for the MIRROR REPLAY, and exists because the two callers ask
  // different questions of the same row.
  //
  // A live issue asks "is this a fresh, unclaimed credential?", and SetCredential answers it with
  // `walletID == ""` -- correct, and always true at the moment an identity provider issues one.
  // enclaveSynchronizeStores asks "should this row be in the PCXY index?", and the answer is
  // whether it has a findCredentialPedersenCommit, because by replay time the walletID is
  // historical.  Using the live gate for the replay is what made a state-synced joiner skip every
  // credential claimed before it joined -- 972 of them on the test chain -- leaving its index
  // permanently short.  See docs/TESTING-BACKLOG.md item 39.
  //
  // It is also REPLAY-TOLERANT, which SetCredential must not be: a commitment already mapping to
  // the SAME credentialID is a row this enclave already has, not a duplicate identity, so seeding
  // it again succeeds.  Only a DIFFERENT credentialID behind one commitment is a real collision.
  // SetCredential refuses both, which is right for a user-submitted duplicate and wrong for a
  // bulk re-push -- and refuses BEFORE storing, so the row is dropped as well (item 43).
  rpc SeedCredential (Credential) returns (SetCredentialReply) {}

  // Seeding a store, a page at a time.  Replaces one RPC per row -- ~10k of them per table on a
  // state-synced joiner -- with one per page.  See MsgSeedStorePage.
  rpc SeedStorePage (MsgSeedStorePage) returns (SeedStorePageReply) {}

  // The accumulator seam: GetStoreHash's equivalent for the maintained per-store accumulators,
  // and DELIBERATELY A WRITING RPC where GetStoreHash must not be -- the handler establishes any
  // missing accumulator before answering, so "absent" is impossible in a current-height reply and
  // both sides of a comparison are guaranteed to exist at the moment of exchange.  See
  // MsgGetStoreAccumulators.
  rpc GetStoreAccumulators (MsgGetStoreAccumulators) returns (GetStoreAccumulatorsReply) {}
  rpc RemoveCredential (EnclaveRemoveCredentialRequest) returns (RemoveCredentialReply) {}
  rpc RecoverKeyByCredential (Credential) returns (RecoverKeyReply) {}
  rpc ClaimCredential(MsgClaimCredential) returns (MsgClaimCredentialResponse) {}
  rpc UpdateCredential(EnclaveUpdateCredentialRequest) returns (MsgUpdateCredentialResponse) {}
  rpc ClaimUpdatedCredential(MsgClaimUpdatedCredential) returns (MsgClaimUpdatedCredentialResponse) {}
  rpc SignRecoverKey(MsgSignRecoverPrivateKey) returns (SignRecoverKeyReply) {}
  rpc QueryGetRecoverKey(QueryGetRecoverKeyRequest) returns (QueryGetRecoverKeyResponse) {}
  rpc QueryFindCredential(QueryFindCredentialRequest) returns (QueryFindCredentialResponse) {}
  rpc QueryGetSubWalletIDByOriginalWalletID(Credential) returns (QueryGetSubWalletIDByOriginalWalletIDResponse) {}

  rpc ValidateAuthenticateServiceProvider(ValidateAuthenticateServiceProviderRequest) returns (ValidateAuthenticateServiceProviderReply) {}

  // used to validate the "authorized signatory" (this allows a user to specify which eph wallet ID is allowed to sign documents)
  rpc ValidateAuthorizedSignatory (ValidateAuthorizedSignatoryRequest) returns (ValidateAuthorizedSignatoryReply) {}

  // SEEDING ONLY -- writes a row the chain has ALREADY validated, with no re-validation.
  //
  // enclaveSynchronizeStores replays chain state into a fresh enclave, and every other store does
  // that through a setter (SetWallet, SetCredential, SetProtectKey...).  AuthorizedSignatory was
  // the exception: it seeded through ValidateAuthorizedSignatory, which applies the live-path
  // freshness rule -- a vshare bind must name the CURRENT or PREVIOUS ss interval key.  Seeded rows
  // are old by construction, so every one was refused, and a state-synced node ran with none of
  // them until a signer check disagreed with the network and forked it.
  //
  // The rule is right for the live path and is left alone there.  This is the write path.
  rpc SetAuthorizedSignatory (ValidateAuthorizedSignatoryRequest) returns (SetAuthorizedSignatoryReply) {}

  // used to validate whether this signer can sign a document (is the signer's credentials enough to sign the document?)
  rpc ValidateAuthorizedSigner (ValidateAuthorizedSignerRequest) returns (ValidateAuthorizedSignerReply) {}
  
  rpc SetPublicKey (PublicKey) returns (SetPublicKeyReply) {}
  rpc SetJarRegulator (JarRegulator) returns (SetJarRegulatorReply) {}
  rpc SetIntervalPublicKeyID (IntervalPublicKeyID) returns (SetIntervalPublicKeyIdReply) {}
  rpc SetPioneerJar (PioneerJar) returns (SetPioneerJarReply) {}
  rpc SetSecretSharePrivateKey (SecretSharePrivK) returns (SetSecretSharePrivateKeyReply) {}
  rpc ValidateDestinationWallet (MsgCreateWallet) returns (ValidateDestinationWalletReply) {}
  rpc ValidateCredential (MsgBindCredential) returns (ValidateCredentialReply) {}
  // Decrypts a freshly submitted credential and checks the fields the identity hash is built from,
  // so an identity provider is told at submission time rather than the credential silently becoming
  // unclaimable.  The chain cannot do this itself -- the details arrive encrypted.
  rpc ValidatePersonalInfo (MsgCreateCredential) returns (ValidatePersonalInfoReply) {}
  rpc ScanBankSend (MsgScanBankSend) returns (ScanBankSendReply) {}
  rpc ValidateTransferPrime (MsgTransferFunds) returns (ValidateTransferPrimeReply) {}
  rpc ValidateTransferDoublePrime (MsgReceiveFunds) returns (ValidateTransferDoublePrimeReply) {}
  rpc SyncWallets (MsgSyncWallets) returns (SyncWalletsReply) {}
  rpc SyncCredentials (MsgSyncCredentials) returns (SyncCredentialsReply) {}
  rpc SyncRecoverKeys (MsgSyncRecoverKeys) returns (SyncRecoverKeysReply) {}
  rpc SyncSuspiciousTransactions (MsgSyncSuspiciousTransactions) returns (SyncSuspiciousTransactionsReply) {}
  rpc ScanTransaction (MsgScanTransactions) returns (ScanTransactionReply) {}

  // called at BeginBlock at a certain interval (i.e. not at every BeginBlock)
  rpc UpdateHeight (MsgUpdateHeight) returns (UpdateHeightReply) {}

  // called after each transaction
  rpc TransactionComplete (MsgTransactionComplete) returns (TransactionCompleteReply) {}

  // called at each EndBlock
  rpc EndBlock (MsgEndBlock) returns (EndBlockReply) {}

  // called on init
  rpc GetStoreHash (MsgGetStoreHash) returns (GetStoreHashReply) {}

  // Height bookkeeping and rollback.  The enclave's IAVL versions are dense and cannot skip
  // (rootmulti.Commit is previousVersion+1), so heights are mapped to versions rather than
  // equated with them; these RPCs are how the chain reads and moves that mapping.
  rpc GetEnclaveHeight (MsgGetEnclaveHeight) returns (GetEnclaveHeightReply) {}
  rpc RollbackToHeight (MsgRollbackToHeight) returns (RollbackToHeightReply) {}
  rpc ConfirmHeight (MsgConfirmHeight) returns (ConfirmHeightReply) {}
}


message MsgEndBlock {
  // The chain height whose writes this commit makes durable.  The enclave stamps it into the
  // committed version (preparedHeight) and indexes height->version for rollback.  0 means a
  // chain binary that predates height bookkeeping; the enclave refuses to commit rather than
  // stamping height 0 forever.
  int64 height = 1;
}

message EndBlockReply {
  int64 preparedHeight = 1;
  int64 version = 2;
  // The enclave's per-store accumulators AS THIS BLOCK COMMITS THEM -- captured after the
  // handler's maintainAccumulators pass, immediately before its commit, so they describe exactly
  // the block-end state.  The chain compares them against its own rows at the same moment (its
  // maintain pass runs just before this rpc), giving continuous per-block content-agreement
  // checking for ~330 bytes in an rpc that already happens every block.  Backlog item 44.
  repeated StoreAccumulatorEntry accumulators = 3;
}

message MsgGetEnclaveHeight {
}

message GetEnclaveHeightReply {
  // last height whose writes are committed in the enclave's store (stamped inside the IAVL
  // version, so it rolls back with the tree)
  int64 preparedHeight = 1;
  // last height the CHAIN has durably committed, as confirmed to the enclave; advanced only by
  // ConfirmHeight, stored outside the tree so a rollback cannot forge it
  int64 confirmedHeight = 2;
  // the store's own IAVL version counter (not a height; SyncEnclave commits consume versions
  // that map to no height at all)
  int64 latestVersion = 3;
  // oldest height still present in the height->version index, i.e. the rollback horizon
  int64 earliestHeight = 4;
  // on-disk layout version of the enclave's stores
  uint32 schemaVersion = 5;
}

message MsgRollbackToHeight {
  int64 height = 1;
  // report what would happen without touching anything
  bool dryRun = 2;
}

message RollbackToHeightReply {
  int64 fromHeight = 1;
  int64 toHeight = 2;
  int64 fromVersion = 3;
  int64 toVersion = 4;
  bool rolledBack = 5;
  // set when rolledBack is false: why not (already at height, height unknown, below horizon...)
  string reason = 6;
}

message MsgConfirmHeight {
  int64 height = 1;
}


message ConfirmHeightReply {
  int64 confirmedHeight = 1;
}

message QueryGetSubWalletIDByOriginalWalletIDResponse {
	string subWalletID = 1;
}

message StoreHash {
  string key = 1;
  string hash = 2;
}

message MsgGetStoreHash {
  // Which store prefixes to hash.  EMPTY MEANS ALL TEN, so existing callers are unaffected.
  //
  // Hashing a prefix is a full scan of it, and the reply used to be all-or-nothing: the dsvs
  // module handles exactly one prefix (AuthorizedSignatory, 167 rows) and was triggering a scan of
  // all ten (~16,000 rows) to obtain it, discarding the other nine with "Ignoring key=...".
  //
  // The RESPONSE ORDER IS NOT THE REQUEST ORDER.  Hashes come back in the enclave's canonical
  // order regardless of what was asked for, because enclaveSynchronizeStores pushes out-of-sync
  // stores in exactly the order it receives them, and that order is load-bearing -- EnclaveIdentity
  // and IntervalPublicKeyID must precede ProtectKey and RecoverKey, whose handlers cannot decrypt
  // without them.  A caller cannot reorder the seeding by reordering its request.
  repeated string keys = 1;
}

message GetStoreHashReply {
  repeated StoreHash hashes = 1;
}


message MsgAddAsValidator {
}

message MsgSyncEnclave {
  string pioneerID = 1;
  string externalAddress = 2;
  string pioneerArmorPrivK = 3;
  string pioneerArmorPassPhrase = 4;
  string seedNode = 5;
}

message MsgUpgradeEnclave {
  bytes remoteReport = 1;
  string enclavePubK      = 2;
}

message UpgradeEnclaveReply {
  bytes remoteReport = 1;
  bytes encEnclavePrivateStateEnclavePubK      = 2;
}


message MsgExportPrivateKey {
  string pubKID = 1;
}

message MsgRemovePrivateKey {
  string pubKID = 1;
}

// ---- private-state transfer, for a node that joined by state-sync ----
//
// SIZE.  Every hop runs on grpc-go defaults -- 4 MiB receive, no overrides anywhere -- and the
// tightest one is the SERVING node's qadenad receiving its own enclave's reply over the unix
// socket.  The reply then travels back as CometBFT RPC JSON, where bytes are base64 and inflate by
// 4/3.  Pages are therefore budgeted on the FINAL CIPHERTEXT at 1 MiB, which lands near 1.4 MiB
// once base64-encoded and leaves generous headroom under 4 MiB on every hop.
//
// COMPRESSION happens BEFORE encryption, which is the only order that helps: ciphertext is
// high-entropy and does not compress.  The window compresses well -- wallet IDs and denoms repeat
// across every entry -- which is what keeps realistic transfers inside one or two pages.  The
// tradeoff, stated rather than hidden: compressing attacker-influenceable content and then
// encrypting it leaks a little through ciphertext LENGTH, since someone who can make transfers and
// watch page sizes learns something about how compressible the rest of the window is.  That is
// judged acceptable here -- this is a bulk transfer that happens once at join, not a repeated
// oracle -- but it is the reason page sizes should not become a per-request tunable.

message MsgSyncPrivateState {
  int64 height = 1;
  // AML window and block time AS OF height, taken from the requester's restored chain state.  The
  // serving enclave cannot supply these: policy reaches the enclave per-message from the chain
  // (SuspiciousPolicyFromParams), so an enclave asked for a historical view holds no window value
  // of its own.
  int64 windowSeconds = 2;
  int64 blockTimeUnix = 3;
  // peer chain RPC endpoints, tried in order
  repeated string peers = 4;
}

message SyncPrivateStateReply {
  bool  status    = 1;
  int64 height    = 2;
  uint64 rows     = 3;
  uint32 pages    = 4;
  string servedBy = 5;
}

// EnclavePrivateStatePage is the DECRYPTED payload.  It never exists outside an enclave.
message EnclavePrivateStatePage {
  int64 height = 1;
  repeated EnclavePrivateStateRow rows = 2;
  bytes nextCursor = 3;
  bool  done = 4;
}

message EnclavePrivateStateRow {
  string table = 1; // the store prefix this row belongs to
  string key   = 2; // PLAINTEXT logical key; the receiver re-seals with its own secret
  bytes  value = 3; // PLAINTEXT marshalled value
}

message MsgExportPrivateState {
  // Dump the enclave's state AS OF this chain height instead of as of now.  0 means current.
  //
  // Made possible by height bookkeeping: the height is mapped to the IAVL version committed for
  // it and the export reads that version.  This is the tool the 2026-08-09 fork had no answer
  // to -- "what did this enclave actually hold at the height where the two nodes diverged?"
  int64 height = 1;

  // Return one digest per section instead of the content.  THE ONLY MODE THAT CANNOT OUTGROW THE
  // TRANSPORT: the reply is a fixed handful of rows whatever the chain has done.  Comparing two
  // enclaves is comparing these, and the content dump is only needed for a section whose digest
  // already disagreed.
  bool digest_only = 2;

  // Restrict the dump to this section (a field name of the export struct, e.g. "CredentialPCXYMap").
  // Empty means all of them.  This is what makes a differing section fetchable on a chain whose
  // full export no longer fits.
  string section = 3;

  // Refuse rather than return more than this many bytes of content.  0 uses the built-in default.
  // Sections are measured as they are marshalled and the whole export is abandoned as soon as the
  // running total crosses the limit, so an over-large export costs one section of memory rather
  // than all of it -- which matters inside an enclave, where the budget is EPC.
  uint64 max_bytes = 4;
}

// PrivateStateSectionDigest identifies one section's content without carrying it.
//
// CANONICALIZED BEFORE HASHING, because neither of the obvious byte streams is comparable across
// nodes: rows live under STABLE-SEALED KEYS and stable sealing is per-node, and the slice sections
// are built by store iteration, so their order follows those per-node keys.  The exporters already
// unseal both key and value, and JSON sorts map keys; the remaining fix is to sort array elements.
// What is hashed is therefore the logical content, which two correct enclaves agree on and two
// diverged ones do not.
message PrivateStateSectionDigest {
  string name = 1;
  // Rows for a map or slice section; 1 for a scalar or a single struct.
  int64 rows = 2;
  // Hex sha256 over the canonicalized JSON of the section.
  string sha256 = 3;
  // Bytes of that canonicalized JSON -- names the section to pull when a digest disagrees, and the
  // section to blame when a full export no longer fits.
  int64 bytes = 4;
}

