// MsgSeedStorePage carries a run of rows from ONE mirrored store, for the chain->enclave seed.
//
// Rows travel MARSHALLED rather than as a typed repeated field, so that one message serves all ten
// mirrored stores instead of ten near-identical ones.  The key names which store, using the same
// identifiers GetStoreHash reports, and the enclave unmarshals into the type that store's handler
// expects:
//
//     Wallet/value/               -> Wallet              Credential/value/       -> Credential
//     PublicKey/value/            -> PublicKey           PioneerJar/value/       -> PioneerJar
//     JarRegulator/value/         -> JarRegulator        ProtectKey/value/       -> ProtectKey
//     IntervalPublicKeyID/value/  -> IntervalPublicKeyID RecoverKey/value/       -> RecoverKey
//     EnclaveIdentity/value/      -> EnclaveIdentity
//
// EACH ROW STILL GOES THROUGH ITS OWN HANDLER inside the enclave.  This changes how rows arrive,
// never what happens to them: SetProtectKey and SetRecoverKey decrypt a vshare and build derived
// indexes, and SeedCredential maintains the PCXY index.  A bulk write straight to the store would
// be faster still and would reintroduce exactly the class of bug that left CredentialPCXY 972 rows
// short -- a derived index rebuilt by a path that skipped the logic that maintains it.
message MsgSeedStorePage {
  string key = 1;
  repeated bytes rows = 2;
}

// Rejections are COUNTED, not fatal, and the caller decides.  A handler can legitimately fail for
// reasons that have nothing to do with the page -- ProtectKey and RecoverKey reconstruct a
// historical interval key from its owners over the network -- and the seed treats any rejection as
// grounds to refuse to continue rather than proceeding half-seeded.
message SeedStorePageReply {
  uint32 accepted = 1;
  uint32 failed = 2;
}

// MsgGetStoreAccumulators asks for the maintained per-store accumulators.
//
// height 0 means CURRENT, and current is establish-then-answer: the handler scans-and-saves any
// store that has no accumulator yet, so every requested key is present in the reply.  A non-zero
// height reads the versioned store as of that height WITHOUT establishing (history cannot be
// written), so historical entries may honestly report absent -- an accumulator did not exist
// before the block that established it, and inventing a zero would read as "empty store".
message MsgGetStoreAccumulators {
  // empty = all mirrored stores, same identifiers GetStoreHash reports
  repeated string keys = 1;
  int64 height = 2;
}

message StoreAccumulatorEntry {
  string key = 1;
  // the 32-byte accumulator value; meaningful only when present = true
  bytes acc = 2;
  // rows counted when the handler had to SCAN (establishment, or a historical read that walked
  // the store); -1 when the value was served from the maintained row without a scan, because
  // counting would cost the very scan the accumulator exists to avoid
  int64 rows = 3;
  bool present = 4;
}

message GetStoreAccumulatorsReply {
  repeated StoreAccumulatorEntry accumulators = 1;
}

// Outbox drains are PAGED.  Each Msg carries a byte budget and each Reply reports whether the
// queue still holds entries; the caller loops until it does not.
//
// The bound exists for two reasons, and the first is the enclave rather than the wire.  Draining
// resolves every queued ID into a full row and holds them all at once, inside the EPC -- tens to a
// couple hundred megabytes, shared with everything else the enclave is doing.  An unbounded drain
// makes the enclave's peak memory a function of how busy the block was.  The second reason is the
// 4 MiB grpc-go default, which nothing on this path overrides.
//
// PAGE ALL OF IT WITHIN ONE BLOCK.  The clear rides the transaction cache, so every page's clear
// becomes durable together at commit, exactly when the chain's writes do.  Stopping partway through
// and resuming in a later block would break that: the rows are applied and the queue keeps them.
message MsgSyncWallets {
  bool clear = 1;
  // 0 means the enclave's own page budget.  The caller does not need to know it.
  uint32 maxBytes = 2;
}

message SyncWalletsReply {
  repeated Wallet wallets = 1;
  // The queue was not emptied by this call.  Call again, in the same block.
  bool more = 2;
}

message MsgSyncCredentials {
  bool clear = 1;
  uint32 maxBytes = 2;
}

// CredentialRef names a credential without carrying it.  Not "CredentialKey": that name is
// already the store-key helper in x/qadena/types/key_credential.go.
message CredentialRef {
  string credentialID = 1;
  string credentialType = 2;
}

message SyncCredentialsReply {
  repeated Credential credentials = 1;
  // Credentials the enclave deleted.  Today deletion always originates on-chain, so nothing
  // populates this yet; it is the channel an enclave-originated removal will need once
  // MsgRemoveCredential grows a user-initiated path.
  repeated CredentialRef removedCredentials = 2;
  bool more = 3;
}

// EnclaveRemoveCredentialRequest carries who asked for the removal.  An empty requesterWalletID
// means the identity provider path, which may only remove ownerless credentials; a non-empty one
// is a user removing a credential they own.  Passing it explicitly keeps the identity provider's
// ownerless-only guarantee intact rather than loosening the check for both callers.
message EnclaveRemoveCredentialRequest {
  Credential credential = 1;
  string requesterWalletID = 2;
}

// EnclaveUpdateCredentialRequest wraps the user's message with the two things the enclave cannot
// determine for itself and must not take from the client: the block height, and the module
// params the change policy is evaluated against.  Both are stamped by the keeper, so they are
// identical across validators and the verdict stays deterministic.
message EnclaveUpdateCredentialRequest {
  MsgUpdateCredential msg = 1;
  int64 blockHeight = 2;
  Params params = 3 [(gogoproto.nullable) = false];
}


