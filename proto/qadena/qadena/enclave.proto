message MsgUpdateHeight {
  int64 height = 1;
  bool isProposer = 2;
  // Is this block CURRENT, or is the node replaying history?  Set by the keeper from
  // ctx.BlockTime(), the same predicate the enclave-init dispatch uses.
  //
  // The enclave cannot work this out for itself -- it has no clock it can trust and no view of the
  // chain head -- and it must not confuse the two.  Replayed blocks carry historical state
  // transitions: an identity deactivated years ago and reactivated since would, applied naively,
  // strip trust that is currently valid, and a months-old attestation would be checked against
  // collateral that has long since moved on.  Trust changes therefore act on LIVE blocks only;
  // during replay the enclave keeps what the sync-enclave bootstrap gave it, which describes now.
  bool isLive = 3;
}

message MsgScanTransactions {
  google.protobuf.Timestamp  timestamp   = 1 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  int64 height = 2;
  MsgTransferFunds msg = 3;
  string exchangerate = 4;
  // The AML policy, read per scan rather than fixed at enclave startup, so a governance change to
  // the window or the eKYC gate takes effect without restarting every node.
  Params params = 5 [(gogoproto.nullable) = false];
  // Thresholds already converted to attoUSD by the keeper.  They arrive pre-resolved because
  // neither side can do this alone: the keeper holds the pricefeed but cannot see the sender's
  // countries, which are sealed inside a credential, while the enclave can read the countries but
  // has no pricefeed.  So the keeper values every configured threshold and the enclave only picks.
  repeated ScanCountryThreshold countryThresholds = 6;
  // Applied when none of the sender's countries is configured.  Also in attoUSD.
  string defaultThresholdAttoUSD = 7;
}

message ScanCountryThreshold {
  string country = 1;
  string thresholdAttoUSD = 2;
}

// A direct bank send, put through the same AML scan as MsgTransferFunds.
//
// Separate from MsgScanTransactions because almost none of that message applies here: a transfer's
// amount is spread across Pedersen commitments and VShares that the enclave has to decrypt, whereas
// a bank send's amount is public and arrives as a plain integer.  What the two share -- the window,
// the jurisdiction lookup, the threshold table -- is shared as code inside the enclave rather than
// by forcing one message to carry both shapes.
message MsgScanBankSend {
  google.protobuf.Timestamp timestamp = 1 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  int64 height = 2;
  string srcWalletID = 3;
  string dstWalletID = 4;
  // One per denomination in the send.  bank SendCoins carries sdk.Coins, so a single message can
  // move several denominations at once and each needs its own market and its own fail-closed
  // pricing check.
  repeated ScanBankSendCoin coins = 5;
  Params params = 6 [(gogoproto.nullable) = false];
  repeated ScanCountryThreshold countryThresholds = 7;
  string defaultThresholdAttoUSD = 8;
  string jarID = 9;
  // Set when the corresponding side is on the scanned-contract whitelist, nil otherwise.
  //
  // The KEEPER resolves this, not the enclave.  Whitelist membership and the pinned-code-ID check
  // are chain state the enclave does not hold, and the enclave has no way to ask whether an address
  // is a contract.  Passing the resolved entry keeps the enclave deciding only what it is for --
  // whether the value is reportable -- and keeps contract detection on the side that can do it.
  ScannedContractWhitelist srcContract = 10;
  ScannedContractWhitelist dstContract = 11;
}

// NOTE: no exchange rate.  MsgScanTransactions has to carry one because the enclave decrypts the
// amount out of a Pedersen commitment and does the multiplication itself.  A bank send's amount is
// public, so the keeper -- which holds the pricefeed -- values it directly and sends the result.
// That also keeps the multi-denomination case in the one place that can price each denomination.
message ScanBankSendCoin {
  string denom = 1;
