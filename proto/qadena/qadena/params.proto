syntax = "proto3";
package qadena.qadena;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

import "cosmos/base/v1beta1/coin.proto";


option go_package = "github.com/c3qtech/qadena_v3/x/qadena/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "github.com/c3qtech/qadena_v3/x/qadena/Params";
  option (gogoproto.equal) = true;

  cosmos.base.v1beta1.Coin  create_wallet_incentive = 1
      [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"create_wallet_incentive\""];
  cosmos.base.v1beta1.Coin  create_ephemeral_wallet_incentive = 2
      [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"create_ephemeral_wallet_incentive\""];
  cosmos.base.v1beta1.Coin  create_wallet_transparent_incentive = 3
      [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"create_wallet_transparent_incentive\""];
  cosmos.base.v1beta1.Coin  create_ephemeral_wallet_transparent_incentive = 4
      [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"create_ephemeral_wallet_transparent_incentive\""];
  string create_credential_fee = 5;
  string ekyc_submit_new_app_royalty_percentage = 6;
  string ekyc_submit_reuse_app_royalty_percentage = 7;
  string ekyc_submit_reuse_provider_royalty_percentage = 8;
  string ekyc_identity_owner_royalty_percentage = 9;
  string create_bulk_credentials_fee = 10;

  // MsgUpdateCredential.  Every numeric here reads as zero on a chain that predates these
  // params, so the policy loader substitutes the compiled-in defaults in
  // x/qadena/common/credential_policy.go rather than rejecting every correction.  The
  // birthdate month/day-swap exception is deliberately NOT a param: it is part of what the
  // birthdate rule MEANS, not a quantity to tune.
  string update_credential_fee = 11;
  // bumped whenever the policy engine's behaviour changes, so a divergence between enclave
  // builds is visible on chain instead of silent
  uint32 update_credential_policy_version = 12;
  // cap on entries in a credential's identity-hash alias list; the list length is the
  // hash-changing-update counter, so this is the lifetime update limit plus one
  uint32 update_credential_max_identity_aliases = 13;
  uint32 update_credential_max_life_events = 14;
  uint32 update_name_max_edit_distance = 15;
  uint32 update_name_max_edit_distance_percent = 16;
  uint32 update_birthdate_max_year_delta = 17;
  int64 update_credential_min_blocks_between_updates = 18;
  // gates so a jurisdiction can disable a transition by param rather than by fork
  bool update_credential_allow_last_name_life_event = 19;
  bool update_credential_allow_gender_change = 20;

  // The AML scan in the enclave (ScanTransaction).  Two rules use these: a single transfer at or
  // above the threshold, and the rolling-window total from one source to one destination reaching
  // it.  Like the update-credential block above, an empty string or a zero reads as UNSET on a
  // chain that predates these params, so SuspiciousPolicyFromParams substitutes the compiled-in
  // defaults.  It must never interpret them literally: a zero threshold would flag every transfer
  // and a zero window would expire the history instantly, silently disabling the aggregate rule.
  string suspicious_transaction_threshold = 21;
  // Length of the rolling window.  Measured against the BLOCK time supplied to the enclave, never
  // wall clock -- the scan runs on every validator and its verdict decides whether the transfer is
  // rejected, so a non-deterministic clock here would fork the chain.
  int64 suspicious_transaction_window_seconds = 22;
  // Per-jurisdiction thresholds, because the reporting limit is a legal number set locally and not
  // a converted one: PH files at PHP 500,000, the US at USD 10,000.  Anything not listed here falls
  // back to suspicious_transaction_threshold.
  repeated SuspiciousThresholdOverride suspicious_transaction_threshold_overrides = 23
      [(gogoproto.nullable) = false];
  // Whether a wallet with no claimed credential may send at all.  Named for what it PERMITS so
  // that proto3's zero value (false) is the ENFORCING state: an unset param must never silently
  // switch an AML control off, and every other spelling of this flag would do exactly that on a
  // chain whose params predate it.
  bool allow_transfer_without_ekyc = 24;
  // What to do with a reportable transfer whose sender gave no --opt-in-reason.
  //
  // FALSE (default): file the report anyway, substituting "No reason provided", and let the
  // transfer through.  TRUE: refuse it and file nothing, which is what this chain did before the
  // flag existed.
  //
  // The old behaviour made every report self-selected: a sender unwilling to be named was blocked
  // rather than reported, so the regulator saw only volunteered transfers and never the refusals.
  // Defaulting to false means an un-upgraded chain starts producing MORE reports, never fewer,
  // which is why the proto3 zero is safe here even though it reads as "do not block".
  bool block_transfer_without_opt_in_reason = 26;

  // How many identity-bearing fields (first/middle/last name, birthdate, gender) may change in a
  // single MsgUpdateCredential.
  //
  // ONE IS THE SAFE VALUE AND THE DEFAULT.  Two simultaneous changes are hard to distinguish from
  // substituting one person for another, which is why this was a compiled-in constant until it
  // became a param.  A zero here reads as UNSET and yields 1, so a chain whose params predate this
  // keeps exactly the behaviour it had.
  //
  // Raising it also weakens the surname life-event rule, which is only safe because the remaining
  // identity fields still pin the identity while the surname is replaced wholesale.  A chain that
  // allows a life event AND another edit in one update has given up that anchor.
  uint32 update_credential_max_changed_identity_fields = 25;

  // Whether an INSTITUTIONAL guardian must state, in MsgSignRecoverPrivateKey, the identity it
  // verified -- so the enclave can resolve that identity to a wallet itself and refuse to sign
  // anything else.
  //
  //   0 = off      do not look at the assertion at all (pre-upgrade behaviour)
  //   1 = audit    resolve and compare, LOG a mismatch, still accept
  //   2 = enforce  resolve and compare, log, and REJECT a mismatch
  //
  // Guardians matched as a raw bech32 address (family and friends) are exempt in every mode: the
  // hole this closes is specific to a SERVER resolving identity->wallet on its own side, which an
  // individual signing from their own app does not do, and CreateCredentialHash needs all five
  // identity fields byte-exact after canonicalization, so a human could not comply reliably.
  //
  // AN ENUM IN A uint32, NOT A bool, because "verify but do not reject yet" is the state this
  // whole change is built around.  The scheme rests on one unproven invariant -- that the hash a
  // guardian computes at signing time equals the one issuance produced -- and if that is wrong,
  // enforcing it fails every institutional signature closed.  Mode 1 proves it against real
  // traffic first.  Validate() rejects anything above 2.
  //
  // THE DIRECTION IS THE OPPOSITE OF allow_transfer_without_ekyc (24), deliberately.  That flag is
  // named so proto3's zero is the ENFORCING state, because an unset param must never silently
  // switch an AML control off.  That reasoning does not carry here: this control does not exist
  // before the upgrade, and no guardian has ever sent an assertion, so a zero that meant "enforce"
  // would break every institutional signature on an un-upgraded chain the moment it upgraded.
  // Zero therefore means "behave exactly as before", which is the same exception
  // block_transfer_without_opt_in_reason (26) documents for itself.
  uint32 sign_recover_key_guardian_assertion_mode = 27;

  // Whether a validator leaving the bonded set has its pioneer row's ExternalIPAddress cleared
  // (parked, and restored when it re-bonds).  The published address is a SECURITY PARAMETER: the
  // enclave's owner-candidate set for every NEW secret-share interval key is exactly the pioneer
  // rows with a non-empty address, and it also sizes the share threshold and the enclave-identity
  // vote quorum.  Without this, a validator that unbonds or is jailed counts as a share owner
  // forever.
  //
  // TURNING IT OFF STOPS NEW PARKING ONLY.  An address parked while it was on is still restored
  // when its validator re-bonds; otherwise switching this off with a validator mid-jail would
  // leave that pioneer bonded but permanently unaddressable, since the enclave never fills an
  // empty row and re-enabling the param cannot replay a re-bond that already happened.
  //
  // TRUE BY DEFAULT.  DefaultParams sets it, and both config/config.yml and
  // config/launch-config.yml state it, so every chain launched from here has it on; a chain must
  // opt OUT, not in.
  //
  // THE UNAVOIDABLE EXCEPTION IS STORED STATE THAT PREDATES THE FIELD.  Params bytes written before
  // field 28 existed carry no 28, so they unmarshal as proto3's false, and GetParams on an empty
  // store returns the zero value too.  Neither can be defaulted away, and neither should be: a new
  // binary replaying such a chain's history must reproduce the app hashes the old binary produced,
  // and hooks firing at a height where they originally did not would fork the state root.  (The
  // empty-store case also covers bootstrap ordering for free -- genesis validators bond during
  // staking's InitGenesis, before qadena's has run.)  Such a chain turns it on by governance
  // (MsgUpdateParams -- which replaces the WHOLE params object, see the NOTE below), which records
  // the change at a height that replay can follow.
  bool release_address_on_unbond = 28;

  // Governance's half of the enclave trust policy.  A BLOCK rather than a bare field so the knobs
  // that follow (attestation age, rollback freeze) are additive and do not each claim a Params
  // number of their own.
  //
  // EMPTY IS UNRESTRICTED, and it has to be.  Params bytes written before field 29 carry no 29, and
  // GetParams on an empty store returns the zero value -- so an absent block must mean "the binary's
  // own policy applies unchanged", exactly as it did before this existed.  The opposite sentinel
  // ("an empty list permits nothing") would stop every chain attesting the moment this shipped.
  EnclaveTrustPolicy enclave_trust_policy = 29 [(gogoproto.nullable) = false];

  // NOTE: the bank-send whitelist is deliberately NOT a param.  Params are replaced wholesale by
  // MsgUpdateParams, so adding one address would mean restating every other one, and a mistake
  // there silently drops exemptions.  It lives in its own keyed state with add/remove messages --
  // see BankSendWhitelist in genesis.proto and tx.proto.
}

// One jurisdiction's reporting threshold, in that jurisdiction's own currency.
message SuspiciousThresholdOverride {
  // Params sets gogoproto.equal, and its generated Equal recurses into this message, so this must
  // generate an Equal too.
  option (gogoproto.equal) = true;

  // ISO 3166-1 alpha-2, matching the normalized Citizenship/Residency fields on a credential
  // (tx_create_credential.go normalizes both through gountries to Alpha2).
  string country = 1;
  // e.g. "500000php".  The keeper converts this to a common unit through the pricefeed before the
  // enclave sees it; the enclave has no pricefeed access of its own.
  string threshold = 2;
}

// What governance is allowed to say about which enclaves this chain trusts.
//
// GOVERNANCE MAY ONLY SUBTRACT.  The binary carries the most permissive set it will ever honour --
// that set is hashed into MRENCLAVE -- and this block can only remove from it:
//
//     effective = (compiled ∩ governance) ∪ {UpToDate}
//
// The asymmetry is the whole design, not a limitation.  Tightening is the move an operator actually
// needs (a host gets its microcode patched; a new advisory lands) and it should not cost a rebuild,
// a new enclave identity and a fleet upgrade.  Loosening beyond the build must keep costing exactly
// that, because a measurement is only worth something if it is an upper bound on what the node will
// accept -- otherwise two nodes with the same MRENCLAVE could trust different things.
//
// It is also what makes it safe to hand this to the ENCLAVE at all.  The enclave hears about the
// chain through the node process, which is unmeasured host code.  If the host could WIDEN the
// policy, its operator would say "accept anything", stand up a fake peer and be handed the
// sealed-table secret -- the enclave defeated through its own configuration channel.  Because the
// push can only narrow, a hostile host achieves nothing but making its own enclave refuse everyone.
//
// See x/qadena/common/tcbpolicy.go, which implements this and holds the compiled set.
message EnclaveTrustPolicy {
  // Params sets gogoproto.equal, and its generated Equal recurses into this message, so this must
  // generate an Equal too.
  option (gogoproto.equal) = true;

  // Canonical ego tcbstatus names: "UpToDate", "ConfigurationNeeded", "SWHardeningNeeded",
  // "ConfigurationAndSWHardeningNeeded", "OutOfDateConfigurationNeeded", "OutOfDate", "Revoked".
  //
  // EMPTY MEANS UNRESTRICTED -- the compiled set applies as-is.  A name not on the compiled list is
  // accepted by Validate but has no effect, because the intersection drops it; naming "OutOfDate"
  // here does NOT admit it.
  //
  // "UpToDate" is permitted whether or not it appears here.  A proposal cannot remove it, so no
  // vote -- mistaken or malicious -- can leave the fleet unable to attest at all, which is the one
  // failure this design could otherwise create and could then only recover from with a rebuild.
  repeated string permitted_tcb_statuses = 1;
}